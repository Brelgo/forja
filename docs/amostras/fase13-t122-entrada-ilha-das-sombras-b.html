<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forja · Entrada da Ilha das Sombras (B)</title>
<!-- F13-T122, opção B: "O Cais dos Afogados" — a entrada da Ilha das Sombras no molde de Águas de Sentina (T120).
     Mesmo esqueleto (palco 1440×900, três camadas da câmera, vão 600–840 × 404–790, folhas em CSS 3D, trava,
     interior com o lojista, clarão, painel da loja, placa com as classes da integração, window.abrir, DUR 1950);
     a arte toda própria, em SVG/CSS: a casa de um mercador nobre de Helia num cais de pedra que afunda no mar
     escuro; mármore enegrecido, janelas altas de vitral partido acesas de verde-azulado por dentro; a Névoa Negra
     sobe da água e escala a fachada, com olhos, um rosto e mãos que se formam e somem, e entra pela porta quando
     ela abre; lanternas de alma em postes de ferro; correntes presas em argolas na pedra; o casco de um navio e
     estátuas veladas tombadas na água; ao fundo a ilha com a torre de Helia e o céu negro rasgado de luz.
     Nada flutua: a placa pende por correntes de um braço de ferro chumbado na pilastra, com o mísula de pedra
     por baixo. Sem áudio. Só a textura de papel do projeto, por caminho relativo. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --papel: #e5d3ad;
  --tinta: #2c1d12;
  --tinta-suave: #5a4630;
  --alma: #2fe0b8;
  --alma-clara: #7dffd0;
  --alma-branca: #e2fff4;
  --osso: #e9e3d3;
  --titulos: 'IM Fell English SC', 'IM Fell English', Georgia, serif;
  --texto: 'Alegreya', Georgia, serif;
  --gravado: 'Cinzel', Georgia, serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: #020304; overflow: hidden; color: var(--tinta); font-family: var(--texto); }

/* ============ A CENA ============ */
.entrada { position: fixed; inset: 0; overflow: hidden; cursor: pointer; background: #020304; }
/* o palco: 1440×900 de desenho, encaixado inteiro na tela (o resto da arte sangra para fora) */
.palco { position: absolute; left: 50%; top: 50%; width: 1440px; height: 900px; transform-origin: 50% 50%; }
/* três camadas de câmera (paralaxe): longe (céu rasgado, mar, ilha com a torre, casco, estátuas tombadas),
   mundo (o cais e a casa do mercador), perto (lanternas de alma, o frade de pedra com a corrente, espinheiros).
   A câmera anda por JS (requestAnimationFrame). */
.camada { position: absolute; inset: 0; transform-origin: 720px 597px; transform: scale(.86); will-change: transform; }
.camada > * { position: absolute; }
.longe { pointer-events: none; }
.perto { pointer-events: none; }

/* o céu quase preto, com um bafo roxo no meio e o verde-azulado perto do rasgo */
.ceu { left: -900px; top: -700px; width: 3240px; height: 2000px;
  background:
    radial-gradient(ellipse 1500px 380px at 1150px 720px, rgba(47,224,184,.13), transparent 70%),
    radial-gradient(ellipse 1300px 420px at 2250px 1000px, rgba(64,28,88,.32), transparent 70%),
    radial-gradient(ellipse 900px 300px at 500px 1150px, rgba(52,22,70,.28), transparent 70%),
    linear-gradient(180deg, #010203 0, #030406 420px, #06080d 820px, #0a0e15 1100px, #0d1519 1240px, #10201f 1258px, #10201f 1270px); }
svg.rasgo { left: -900px; top: -700px; width: 3240px; height: 2000px; overflow: visible; animation: rasgo 6.5s ease-in-out infinite; }
@keyframes rasgo { 0%,100% { opacity: .84; } 50% { opacity: 1; } }
svg.nuvens { left: -900px; top: -700px; width: 3240px; height: 2000px; overflow: visible; animation: nuvens 80s ease-in-out infinite alternate; }
@keyframes nuvens { from { transform: translateX(0); } to { transform: translateX(-120px); } }
/* o rasgo pulsa e, de vez em quando, abre num clarão curto */
.clarao-rasgo { left: -900px; top: -700px; width: 3240px; height: 1400px; pointer-events: none; opacity: 0; mix-blend-mode: screen;
  background: radial-gradient(ellipse 900px 300px at 1150px 690px, rgba(170,255,230,.5), rgba(47,224,184,.16) 45%, transparent 75%);
  animation: clarao-rasgo 12s linear infinite; }
@keyframes clarao-rasgo { 0%, 58% { opacity: 0; } 58.6% { opacity: .95; } 59.4% { opacity: .15; } 60.2% { opacity: .7; } 62%, 100% { opacity: 0; } }
svg.ilha { left: -900px; top: -700px; width: 3240px; height: 2000px; overflow: visible; }
svg.ilha .reflexo { animation: cintila 3.6s ease-in-out infinite; }
@keyframes cintila { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
/* o farol de alma no alto da torre de Helia */
.farol { left: 1300px; top: 98px; width: 240px; height: 240px; margin: -120px 0 0 -120px; border-radius: 50%; pointer-events: none; mix-blend-mode: screen;
  background: radial-gradient(circle, rgba(220,255,245,.9) 0, rgba(125,255,208,.5) 8%, rgba(47,224,184,.18) 28%, transparent 62%);
  animation: respira 4.2s ease-in-out infinite; }

svg.fundo { left: -600px; top: -400px; width: 2640px; height: 1700px; overflow: visible; }
svg.frente { left: -600px; top: -400px; width: 2640px; height: 1700px; overflow: visible; }
/* a Névoa Negra: fumaça escura com veios de alma, que sobe da água e escala a fachada */
svg.nevoa-negra { left: -200px; top: -50px; width: 1900px; height: 950px; overflow: visible; pointer-events: none;
  transform-origin: 50% 100%; animation: nevoa-sobe 11s ease-in-out infinite; }
@keyframes nevoa-sobe { 0%,100% { transform: translateY(0) scaleY(1); } 50% { transform: translateY(-8px) scaleY(1.012); } }
svg.olhos { left: -200px; top: -50px; width: 1900px; height: 950px; overflow: visible; pointer-events: none; animation: nevoa-sobe 11s ease-in-out infinite; transform-origin: 50% 100%; }
.olho { transform-box: fill-box; transform-origin: 50% 50%; animation: pisca-olho 6.4s ease-in-out infinite; }
@keyframes pisca-olho { 0%, 90%, 100% { transform: scaleY(1); } 93% { transform: scaleY(.08); } 96% { transform: scaleY(1); } }
.olho-some { animation: olho-some 9s ease-in-out infinite; }
@keyframes olho-some { 0%, 100% { opacity: 0; } 25%, 70% { opacity: 1; } }
/* rostos e mãos que se formam na névoa e se desfazem */
.forma { opacity: 0; animation: forma 10s ease-in-out infinite; }
@keyframes forma { 0% { opacity: 0; } 30% { opacity: .95; } 62% { opacity: .9; } 84%, 100% { opacity: 0; } }

/* o brilho das janelas de vitral e da lanterna da estátua */
.lanterna-halo { width: 200px; height: 200px; margin: -100px 0 0 -100px; border-radius: 50%; pointer-events: none; mix-blend-mode: screen;
  background: radial-gradient(circle, rgba(125,255,208,.6), rgba(47,224,184,.2) 36%, transparent 70%); animation: tremula 2.6s steps(8) infinite; }
.lanterna-halo.l1 { left: 742px; top: -80px; width: 170px; height: 170px; margin: -85px 0 0 -85px; }
.janelas-halo { left: 340px; top: 60px; width: 760px; height: 760px; pointer-events: none; mix-blend-mode: screen;
  background:
    radial-gradient(ellipse 120px 210px at 142px 520px, rgba(47,224,184,.30), transparent 72%),
    radial-gradient(ellipse 120px 210px at 617px 520px, rgba(47,224,184,.30), transparent 72%),
    radial-gradient(ellipse 100px 150px at 142px 190px, rgba(47,224,184,.24), transparent 72%),
    radial-gradient(ellipse 100px 150px at 617px 190px, rgba(47,224,184,.24), transparent 72%),
    radial-gradient(ellipse 150px 190px at 380px 180px, rgba(47,224,184,.30), transparent 72%),
    radial-gradient(ellipse 180px 90px at 380px 300px, rgba(47,224,184,.28), transparent 72%);
  animation: respira 4.8s ease-in-out infinite; }
@keyframes respira { 0%,100% { opacity: .74; } 45% { opacity: 1; } 70% { opacity: .84; } }
@keyframes tremula { 0% { opacity: .82; } 13% { opacity: .95; } 27% { opacity: .78; } 41% { opacity: 1; } 55% { opacity: .86; } 70% { opacity: .97; } 84% { opacity: .8; } 100% { opacity: .9; } }

/* ============ A PORTA ============ */
/* o vão: 240×386, de x 600 a 840, y 404 a 790 (sob o arco ogival de mármore) */
.vao { left: 600px; top: 404px; width: 240px; height: 386px; perspective: 820px; perspective-origin: 50% 46%; }
.interior { position: absolute; inset: 0; overflow: hidden; background: #062a26; }
.interior svg { display: block; width: 100%; height: 100%; }
.interior .acende { position: absolute; inset: 0; opacity: 0;
  background: radial-gradient(ellipse 70% 55% at 50% 34%, #f0fffa, rgba(125,255,208,.6) 45%, rgba(47,224,184,0) 80%); mix-blend-mode: screen; }
.folha { position: absolute; top: 0; width: 120px; height: 386px; transform-style: preserve-3d; backface-visibility: hidden; will-change: transform; }
.folha.esq { left: 0; transform-origin: 0 50%; }
.folha.dir { right: 0; transform-origin: 100% 50%; }
/* o ébano das folhas: tábuas em pé, veio fino, a poeira de alma que subiu de baixo */
.chapas { position: absolute; inset: 0;
  background:
    linear-gradient(180deg, rgba(0,0,0,.5), transparent 16%, transparent 72%, rgba(47,224,184,.08) 90%, rgba(125,255,208,.16)),
    repeating-linear-gradient(90deg, rgba(0,0,0,.6) 0 2px, rgba(160,255,230,.05) 2px 3px, transparent 3px 40px),
    repeating-linear-gradient(91deg, rgba(220,240,235,.03) 0 1px, transparent 1px 5px),
    linear-gradient(90deg, #08090c, #191b22 34%, #14161c 68%, #07080a); }
.folha.esq .chapas { box-shadow: inset 0 0 0 5px #030405, inset 0 0 0 7px #7d786c, inset -3px 0 0 7px #020203; }
.folha.dir .chapas { box-shadow: inset 0 0 0 5px #030405, inset 0 0 0 7px #7d786c, inset 3px 0 0 7px #020203; }
.entalhe { position: absolute; inset: 0; width: 120px; height: 386px; overflow: visible; }
.folha.dir .entalhe { transform: scaleX(-1); }
/* as ferragens: cintas de ferro negro com ponta de lança e cravos que pegam a luz verde */
.cinta { position: absolute; height: 16px; width: 106px;
  background:
    radial-gradient(circle at 50% 50%, #a8eedc 0 1.4px, #1a1d22 2.4px, transparent 3px) 10px 0 / 22px 100% repeat-x,
    linear-gradient(180deg, #3c424c 0, #1c1f25 45%, #08090b 100%);
  box-shadow: 0 3px 3px rgba(0,0,0,.7), inset 0 1px 0 rgba(125,255,208,.28); }
.folha.esq .cinta { left: -6px; clip-path: polygon(0 0, 84% 0, 90% 22%, 100% 50%, 90% 78%, 84% 100%, 0 100%); }
.folha.dir .cinta { right: -6px; clip-path: polygon(16% 0, 100% 0, 100% 100%, 16% 100%, 10% 78%, 0 50%, 10% 22%); }
.cinta.c1 { top: 22px; } .cinta.c2 { top: 244px; } .cinta.c3 { top: 344px; }
/* os grampos da tranca (a parte da frente repete por cima da barra; ver .grampo-frente) */
.suporte { position: absolute; top: 188px; width: 22px; height: 50px; border-radius: 3px;
  background: radial-gradient(circle at 50% 6px, #a8c8c0 0 1.7px, transparent 2.5px), radial-gradient(circle at 50% 44px, #a8c8c0 0 1.7px, transparent 2.5px), linear-gradient(90deg, #0d0f12, #3c424a 50%, #0d0f12);
  box-shadow: 0 2px 3px rgba(0,0,0,.7); }
.folha.esq .suporte { left: 46px; } .folha.dir .suporte { right: 58px; }
/* as argolas: aro de ferro preso num espelho de osso */
.argola { position: absolute; top: 266px; width: 34px; height: 36px; }
.folha.esq .argola { right: 14px; } .folha.dir .argola { left: 14px; }
.argola::before { content: ""; position: absolute; left: 9px; top: -6px; width: 16px; height: 16px; border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #f2eee2, #8f897c 70%); box-shadow: 0 1px 2px rgba(0,0,0,.8), 0 0 0 3px #050608; }
.argola::after { content: ""; position: absolute; left: 1px; top: 4px; width: 32px; height: 32px; border-radius: 50%;
  border: 4px solid #2a2f36; border-top-color: #9ff0da; box-shadow: 0 3px 3px rgba(0,0,0,.7); }
/* meio sol de Helia partido em cada folha: fechada, a porta mostra o medalhão inteiro */
.meia { position: absolute; top: 50px; width: 66px; height: 136px; overflow: hidden; filter: drop-shadow(0 3px 2px rgba(0,0,0,.8)); }
.folha.esq .meia { right: 0; } .folha.dir .meia { left: 0; }
.folha .sombra { position: absolute; inset: 0; background: #010202; opacity: 0; }
/* espessura da folha (a borda que aparece quando gira) */
.folha .borda { position: absolute; top: 0; height: 100%; width: 18px; background: linear-gradient(90deg, #050607, #22262c, #040505); }
.folha.esq .borda { right: 0; transform-origin: 100% 50%; transform: rotateY(-90deg); }
.folha.dir .borda { left: 0; transform-origin: 0 50%; transform: rotateY(90deg); }
/* a luz de alma pela fresta do meio (quase apagada onde o medalhão atravessa, y 454–590) e debaixo da porta */
.fresta-meio { left: 718px; top: 404px; width: 4px; height: 386px; pointer-events: none;
  background: linear-gradient(180deg, rgba(47,224,184,0), rgba(125,255,208,.75) 10%, rgba(200,255,238,.9) 64%, rgba(47,224,184,.6));
  -webkit-mask-image: linear-gradient(180deg, #000 0, #000 12%, rgba(0,0,0,.1) 15%, rgba(0,0,0,.1) 48%, #000 52%, #000 100%);
          mask-image: linear-gradient(180deg, #000 0, #000 12%, rgba(0,0,0,.1) 15%, rgba(0,0,0,.1) 48%, #000 52%, #000 100%);
  filter: blur(1.5px); mix-blend-mode: screen; }
.fresta-chao { left: 596px; top: 783px; width: 248px; height: 14px; pointer-events: none; border-radius: 50%;
  background: radial-gradient(ellipse at 50% 50%, rgba(190,255,235,.95), rgba(47,224,184,.5) 45%, transparent 75%);
  filter: blur(2px); mix-blend-mode: screen; }
/* a tranca: uma barra de ferro com a corrente enrolada, que corre pelos grampos e entra na bainha de pedra à esquerda */
.tranca { left: 632px; top: 598px; width: 160px; height: 32px; border-radius: 4px;
  background:
    linear-gradient(90deg, transparent 0 18px, #0b0c0f 18px 30px, transparent 30px calc(100% - 44px), #0b0c0f calc(100% - 44px) calc(100% - 32px), transparent calc(100% - 32px)),
    repeating-linear-gradient(118deg, transparent 0 10px, rgba(0,0,0,.7) 10px 12px, #59616b 12px 14px, #2a2e35 14px 17px, rgba(0,0,0,.7) 17px 19px, transparent 19px 26px),
    linear-gradient(180deg, #4c535d, #262a31 40%, #121418 75%, #060708);
  box-shadow: 0 7px 9px rgba(0,0,0,.75), inset 0 1px 0 rgba(125,255,208,.4), inset 0 -2px 0 rgba(0,0,0,.6); }
/* o punho de ferro, que fica de fora pela fenda da bainha */
.tranca::after { content: ""; position: absolute; left: 56px; top: -24px; width: 16px; height: 28px; border-radius: 8px 8px 3px 3px;
  background: radial-gradient(circle at 40% 30%, #c8f4e8 0 2px, transparent 4px), linear-gradient(90deg, #121418, #4c545e 45%, #16181c);
  box-shadow: 0 2px 2px rgba(0,0,0,.6); }
.tranca::before { content: ""; position: absolute; right: -10px; top: -5px; width: 16px; height: 42px; border-radius: 3px;
  background: linear-gradient(90deg, #0d0f12, #464d56 50%, #0d0f12); box-shadow: 0 3px 3px rgba(0,0,0,.6); }
svg.bainha { left: 432px; top: 568px; width: 186px; height: 84px; overflow: visible; pointer-events: none; }
.grampo-frente { width: 22px; height: 50px; top: 592px; border-radius: 3px; pointer-events: none;
  background: radial-gradient(circle at 50% 6px, #a8c8c0 0 1.7px, transparent 2.5px), radial-gradient(circle at 50% 44px, #a8c8c0 0 1.7px, transparent 2.5px), linear-gradient(90deg, #0d0f12, #3c424a 50%, #0d0f12);
  box-shadow: 0 2px 3px rgba(0,0,0,.7); }
.grampo-frente.g1 { left: 646px; } .grampo-frente.g2 { left: 760px; }
/* as faíscas frias do ferro da tranca raspando no grampo */
.faiscas-trinco { left: 648px; top: 612px; width: 0; height: 0; pointer-events: none; }
.faiscas-trinco i { position: absolute; left: 0; top: 0; width: 3px; height: 3px; border-radius: 50%; background: #e8fff8;
  box-shadow: 0 0 5px 2px rgba(47,224,184,.9); opacity: 0; }

/* a luz de alma que sai pela porta e deita nas lajes molhadas do cais */
.luz-neve { left: 420px; top: 760px; width: 600px; height: 200px; pointer-events: none; opacity: .3; border-radius: 50%;
  background: radial-gradient(ellipse 50% 50% at 50% 30%, rgba(125,255,208,.7), rgba(47,224,184,.24) 50%, transparent 78%);
  mix-blend-mode: screen; }
.poca { left: 360px; top: 806px; width: 720px; height: 360px; pointer-events: none; opacity: .5; transform-origin: 50% 0;
  clip-path: polygon(33% 0, 67% 0, 100% 100%, 0 100%);
  background: radial-gradient(ellipse 60% 85% at 50% 0, rgba(200,255,238,.9), rgba(47,224,184,.4) 45%, transparent 82%);
  mix-blend-mode: screen; transform: scaleY(.3); }
.raios { left: 270px; top: 200px; width: 900px; height: 800px; pointer-events: none; opacity: 0;
  background:
    radial-gradient(ellipse 30% 40% at 50% 50%, rgba(200,255,238,.85), rgba(47,224,184,.25) 55%, transparent 80%),
    repeating-conic-gradient(from 0deg at 50% 50%, rgba(125,255,208,.18) 0 4deg, transparent 4deg 11deg);
  -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 0, rgba(0,0,0,.6) 35%, transparent 70%);
          mask-image: radial-gradient(circle at 50% 50%, #000 0, rgba(0,0,0,.6) 35%, transparent 70%);
  mix-blend-mode: screen; }
/* a névoa rente ao chão, dos dois lados da soleira: na abertura ela é sugada porta adentro */
.nevoa-entra { left: 440px; top: 690px; width: 560px; height: 150px; pointer-events: none; }
.nevoa-entra i { position: absolute; border-radius: 50%; filter: blur(6px);
  background: radial-gradient(ellipse at 50% 55%, rgba(8,5,14,.95) 0, rgba(18,10,30,.78) 38%, rgba(47,224,184,.16) 60%, transparent 72%);
  animation: deriva 7s ease-in-out infinite alternate; }
@keyframes deriva { from { transform: translateX(-6px); } to { transform: translateX(8px); } }

/* ============ AS LANTERNAS DE ALMA (camada de perto): gaiola de ferro no alto de um poste ============ */
.lampiao { width: 140px; height: 330px; top: 575px; transform: scale(1.12); transform-origin: 50% 100%; }
.lampiao.b1 { left: 395px; } .lampiao.b2 { left: 905px; }
.lampiao svg { position: absolute; inset: 0; width: 140px; height: 330px; overflow: visible; }
.halo { position: absolute; left: 70px; top: 82px; width: 520px; height: 520px; margin: -260px 0 0 -260px; border-radius: 50%;
  background: radial-gradient(circle, rgba(125,255,208,.36), rgba(47,224,184,.13) 30%, rgba(47,224,184,.05) 52%, transparent 66%);
  animation: tremula 2.3s steps(9) infinite; }
.b2 .halo { animation-duration: 1.9s; animation-delay: -.7s; }
.chamas { position: absolute; left: 70px; top: 104px; width: 0; height: 0; }
.ch { position: absolute; bottom: -2px; transform-origin: 50% 100%; mix-blend-mode: screen; filter: blur(1px);
  animation: chama .8s ease-in-out infinite alternate; }
.ch::before { content: ""; position: absolute; left: 0; bottom: 0; width: 100%; aspect-ratio: 1; border-radius: 0 50% 50% 50%; transform: rotate(45deg); transform-origin: 50% 50%;
  background: radial-gradient(circle at 62% 62%, #f4fffb 0, #9dffe0 28%, #2fe0b8 58%, rgba(20,140,110,0) 84%); }
.ch.f1 { left: -9px; width: 18px; height: 18px; animation-duration: .9s; }
.ch.f2 { left: -5px; width: 10px; height: 10px; animation-duration: .62s; animation-delay: -.3s; }
.ch.f2::before { background: radial-gradient(circle at 62% 62%, #ffffff 0, #e2fff4 35%, #7dffd0 62%, rgba(47,224,184,0) 84%); }
@keyframes chama { 0% { transform: scale(1, 1.7) skewX(-5deg); } 35% { transform: scale(.85, 2.1) skewX(-10deg); } 70% { transform: scale(1.05, 1.6) skewX(-3deg); } 100% { transform: scale(.92, 1.95) skewX(-8deg); } }

/* a luz das lanternas e dos vitrais na pedra */
.luz-fachada { left: 0; top: 0; width: 1440px; height: 900px; pointer-events: none; mix-blend-mode: soft-light;
  background:
    radial-gradient(ellipse 380px 330px at 465px 650px, rgba(47,224,184,.95), transparent 70%),
    radial-gradient(ellipse 380px 330px at 975px 650px, rgba(47,224,184,.95), transparent 70%),
    radial-gradient(ellipse 420px 200px at 720px 320px, rgba(125,255,208,.6), transparent 70%);
  animation: tremula 2.7s steps(7) infinite; }

/* ============ A PLACA: laje de mármore negro pendurada por duas correntes no braço de ferro chumbado na pilastra ============ */
.placa-grupo { left: 1056px; top: 398px; width: 360px; transform-origin: 50% 0; animation: balanca 6.4s ease-in-out infinite; cursor: default; }
@keyframes balanca { 0%,100% { transform: rotate(-.8deg); } 50% { transform: rotate(.9deg); } }
/* a corrente: elos de ferro */
.corrente { position: absolute; top: -6px; width: 9px; height: 40px;
  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='9' height='14'><rect x='1.5' y='1' width='6' height='8.5' rx='3' fill='none' stroke='%23000' stroke-width='2.8'/><rect x='1.5' y='1' width='6' height='8.5' rx='3' fill='none' stroke='%23727c86' stroke-width='1.5'/><rect x='3.4' y='7.6' width='2.2' height='6.6' fill='%23000'/><rect x='3.9' y='7.6' width='1.2' height='6.6' fill='%23a8eedc'/></svg>") 0 0 / 9px 14px repeat-y;
  filter: drop-shadow(1px 2px 1px rgba(0,0,0,.6)); }
.corrente.e { left: 35px; } .corrente.d { right: 35px; }

/* a etiqueta da versão: uma tabuinha de mármore pendurada por duas correntinhas sob a laje */

.etiqueta::before, .etiqueta::after { content: ""; position: absolute; top: -20px; width: 7px; height: 20px;

/* ============ SOBRE A CENA (tela, não mundo) ============ */
/* a cinza e as faíscas de alma que sobem devagar */
.neve { position: absolute; left: -60%; top: -60%; width: 220%; height: 220%; pointer-events: none; will-change: transform; }
.neve.n1 { animation: cinza 16s linear infinite; opacity: .7; }
.neve.n2 { animation: cinza 10s linear infinite; opacity: .55; filter: blur(.8px); }
@keyframes cinza { from { transform: rotate(-12deg) translateY(0); } to { transform: rotate(-12deg) translateY(calc(var(--t) * -1)); } }
.nevoa { position: absolute; left: -20%; right: -20%; bottom: -4%; height: 42%; pointer-events: none;
  background:
    radial-gradient(ellipse 30% 40% at 18% 72%, rgba(22,10,36,.55), transparent 70%),
    radial-gradient(ellipse 34% 36% at 78% 82%, rgba(18,8,30,.5), transparent 70%),
    radial-gradient(ellipse 26% 22% at 50% 92%, rgba(47,224,184,.07), transparent 70%),
    linear-gradient(180deg, transparent, rgba(8,4,14,.3) 60%, rgba(4,2,8,.55));
  animation: nevoa 16s ease-in-out infinite alternate; }
@keyframes nevoa { from { transform: translateX(-4%); } to { transform: translateX(4%); } }
/* rolos de Névoa Negra que atravessam o cais */
.rajada { position: absolute; left: -60%; width: 90%; height: 220px; pointer-events: none; border-radius: 50%;
  background: radial-gradient(ellipse at 50% 50%, rgba(20,10,34,.42), rgba(47,224,184,.04) 55%, transparent 72%); filter: blur(16px);
  animation: rajada 19s linear infinite; }
.rajada.r2 { top: 66%; animation-duration: 24s; animation-delay: -10s; height: 280px; }
.rajada.r1 { top: 34%; }
@keyframes rajada { 0% { transform: translate(0, 0) rotate(-2deg); opacity: 0; } 20% { opacity: 1; } 80% { opacity: .8; } 100% { transform: translate(190%, -4vh) rotate(-2deg); opacity: 0; } }
.vinheta { position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse 80% 76% at 50% 56%, transparent 50%, rgba(0,1,2,.72) 100%); }
.grao { position: absolute; inset: 0; pointer-events: none; opacity: .26; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .6 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); }
.flash { position: absolute; inset: 0; pointer-events: none; opacity: 0;
  background: radial-gradient(ellipse 70% 70% at 50% 55%, #f4fffb, #a8ffe2 45%, #1f8f78 100%); }
.dica { position: absolute; left: 0; right: 0; bottom: 16px; margin: 0; text-align: center; pointer-events: none;
  font-family: var(--texto); font-style: italic; font-size: 14px; letter-spacing: .04em; color: rgba(220,245,236,.55);
  text-shadow: 0 1px 2px rgba(0,0,0,.8); animation: dica-chega 1.2s ease 1.4s both, dica-pulsa 4s ease-in-out 2.6s infinite; }
@keyframes dica-chega { from { opacity: 0; } to { opacity: 1; } }
@keyframes dica-pulsa { 0%,100% { opacity: 1; } 50% { opacity: .62; } }
/* o botão para leitor de tela e teclado: invisível até receber foco pelo teclado (Tab) */
.btn-entrar { position: absolute; left: 50%; bottom: 50px; transform: translateX(-50%); padding: 8px 22px; cursor: pointer;
  font-family: var(--titulos); font-size: 17px; letter-spacing: .08em; color: #eef6f1; background: #0f4a40;
  border: 1px solid #052a24; border-radius: 2px; box-shadow: 0 3px 0 #031c18, 0 6px 12px rgba(0,0,0,.5);
  opacity: 0; }
.btn-entrar:focus-visible { opacity: 1; outline: 2px solid var(--alma-clara); outline-offset: 3px; }

/* a loja (placeholder: na integração é o app) */
.loja { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  visibility: hidden; opacity: 0;
  background:
    radial-gradient(ellipse 900px 520px at 50% 40%, rgba(47,224,184,.14), transparent 70%),
    repeating-linear-gradient(180deg, transparent 0 58px, rgba(0,0,0,.4) 58px 60px),
    linear-gradient(180deg, #121820, #0b1014 60%, #070a0c); }
.loja h2 { margin: 0; font-family: var(--titulos); font-weight: 400; font-size: 64px; color: #dff3ea; text-shadow: 0 2px 0 #000, 0 0 18px rgba(47,224,184,.4); letter-spacing: .03em; }
.loja p { margin: 0; font-family: var(--texto); font-style: italic; font-size: 15px; color: #8fb8aa; }
.loja .atalho { position: absolute; right: 18px; bottom: 14px; font-family: var(--gravado); font-size: 11px; letter-spacing: .2em; color: #5f8a7c; text-transform: uppercase; }

/* ============ A ABERTURA ============ */
body.abrindo .entrada { cursor: default; }
/* a tranca: um tranco para a direita (destrava), corre para a esquerda e bate no fundo da bainha (0–0,42 s) */
body.abrindo .tranca { animation: tranca .42s cubic-bezier(.5,0,.3,1) both; }
@keyframes tranca {
  0%   { transform: translateX(0); }
  14%  { transform: translateX(7px) translateY(-1px); }
  24%  { transform: translateX(4px); }
  82%  { transform: translateX(-192px); }
  91%  { transform: translateX(-181px); }
  100% { transform: translateX(-186px); }
}
body.abrindo .grampo-frente { animation: some .12s linear .26s both; }
body.abrindo .faiscas-trinco i { animation: faisca-trinco .5s cubic-bezier(.2,.7,.4,1) both; }
@keyframes faisca-trinco { 0% { opacity: 0; transform: translate(0, 0); } 8% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--fx), var(--fy)); } }
/* o olho do sol de Helia acende no clique */
body.abrindo .insignia-acorda { animation: acorda .7s ease-out both; }
@keyframes acorda { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: .85; } }
body.abrindo .folha.esq { animation: abre-esq 1.25s cubic-bezier(.55,.02,.2,1) .26s both; }
body.abrindo .folha.dir { animation: abre-dir 1.25s cubic-bezier(.55,.02,.2,1) .26s both; }
@keyframes abre-esq { 0% { transform: rotateY(0); } 7% { transform: rotateY(-1.2deg); } 100% { transform: rotateY(82deg); } }
@keyframes abre-dir { 0% { transform: rotateY(0); } 7% { transform: rotateY(1.2deg); } 100% { transform: rotateY(-82deg); } }
body.abrindo .folha .sombra { animation: escurece 1.25s ease-in .26s both; }
@keyframes escurece { to { opacity: .7; } }
body.abrindo .interior .acende { animation: acende 1.1s ease-out .3s both; }
@keyframes acende { to { opacity: 1; } }
body.abrindo .fresta-meio { animation: some .3s ease .32s both; }
@keyframes some { to { opacity: 0; } }
/* a Névoa Negra rente ao chão é puxada para dentro da porta */
body.abrindo .nevoa-entra i { animation: entra-nevoa 1.35s cubic-bezier(.55,0,.75,1) .28s both; }
@keyframes entra-nevoa { 0% { transform: translate(0, 0) scale(1); opacity: 1; } 70% { opacity: .9; } 100% { transform: translate(var(--dx), var(--dy)) scale(.3); opacity: 0; } }
/* a luz de alma se espalha pelo cais logo no começo */
body.abrindo .luz-neve { animation: luz-neve .6s ease-out .02s both; }
@keyframes luz-neve { to { opacity: 1; transform: scale(1.25, 1.1); } }
body.abrindo .poca { animation: poca 1.1s cubic-bezier(.3,.6,.3,1) .05s both; }
@keyframes poca { to { opacity: 1; transform: scaleY(1); } }
body.abrindo .raios { animation: raios 1.4s ease-out .4s both; }
@keyframes raios { 0% { opacity: 0; transform: scale(.6); } 100% { opacity: .95; transform: scale(1.15); } }
body.abrindo .dica { animation: some .3s ease both; }
body.abrindo .placa-grupo, body.abrindo .etiqueta { animation-play-state: paused; }
body.abrindo .flash { animation: flash .45s ease-in 1.4s both; }
@keyframes flash { from { opacity: 0; } to { opacity: 1; } }
body.abrindo .loja { animation: loja .42s ease-out 1.68s both; }
@keyframes loja { 0% { visibility: visible; opacity: 0; transform: scale(1.04); } 100% { visibility: visible; opacity: 1; transform: none; } }
body.aberta .entrada { visibility: hidden; }
.neve-tela { position: absolute; inset: 0; pointer-events: none; transform-origin: 50% 60%; will-change: transform, opacity;
  -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,.25) 0, rgba(0,0,0,.6) 30%, #000 58%);
          mask-image: linear-gradient(180deg, rgba(0,0,0,.25) 0, rgba(0,0,0,.6) 30%, #000 58%); }
/* pré-aquecimento: as luzes da abertura já nascem em camada própria */
.raios, .poca, .luz-neve, .flash, .interior .acende, .fresta-meio { will-change: transform, opacity; }

/* menos movimento: as portas só esmaecem, sem câmera */
@media (prefers-reduced-motion: reduce) {
  .neve, .nevoa, .rajada, svg.nuvens, svg.rasgo, .clarao-rasgo, .farol, svg.nevoa-negra, svg.olhos, .olho, .olho-some, .forma, .halo, .luz-fachada, .ch, .placa-grupo, .etiqueta, .lanterna-halo, .janelas-halo, .nevoa-entra i, svg.ilha .reflexo, .dica { animation: none !important; }
  .clarao-rasgo { display: none; }
  .forma { opacity: .7; }
  .olho-some { opacity: 1; }
  .neve.n2 { display: none; }
  .dica { opacity: 1; }
  body.abrindo .dica { opacity: 0 !important; visibility: hidden; }
  body.abrindo .neve-tela, body.abrindo .raios, body.abrindo .flash, body.abrindo .poca, body.abrindo .luz-neve, body.abrindo .insignia-acorda, body.abrindo .faiscas-trinco i { animation: none !important; }
  body.abrindo .fresta-meio, body.abrindo .fresta-chao { animation: none !important; opacity: 0; }
  body.abrindo .nevoa-entra i { animation: esmaece .4s ease both !important; }
  body.abrindo .tranca, body.abrindo .grampo-frente, body.abrindo svg.bainha { animation: esmaece .4s ease both !important; }
  body.abrindo .folha.esq, body.abrindo .folha.dir { animation: esmaece .55s ease both !important; }
  body.abrindo .loja { animation: loja-calma .45s ease .5s both !important; }
}
@keyframes esmaece { to { opacity: 0; } }
@keyframes loja-calma { 0% { visibility: visible; opacity: 0; } 100% { visibility: visible; opacity: 1; } }
</style>

  /* ---------- perto: os frades de pedra, as argolas e as correntes; os espinheiros dos cantos ---------- */
  function corrente(g, a, b, cai, elo, grosso) {
    var n = Math.max(2, Math.round(Math.hypot(b[0] - a[0], b[1] - a[1]) / elo)), mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2 + cai;

        el("ellipse", { cx: 0, cy: 0, rx: f1(elo * .66), ry: f1(grosso * 1.05), fill: "none", stroke: "#3a4049", "stroke-width": f1(grosso * .38), transform: tr }, g);
        el("path", { d: "M" + f1(-elo * .5) + " " + f1(-grosso * .9) + " Q0 " + f1(-grosso * 1.4) + " " + f1(elo * .5) + " " + f1(-grosso * .9), fill: "none", stroke: "#7dffd0", "stroke-width": 1, opacity: .6, transform: tr }, g);

  (function () {
    var gF = $("frades"), gC = $("correntes-perto"), gE = $("espinheiros-perto");

    espinheiro(gE, ramo(-60, 900, -.6, 0, 6, 26), 4, true);

  /* ---------- as faíscas da tranca (frias, de alma) ---------- */
  (function () {

  /* ---------- encaixe na tela ---------- */

  /* ---------- a câmera (requestAnimationFrame) ---------- */
  // Progressão geométrica sobre a escala, acelerando: p = t^1,8; a casa vai de 0,86 a 7,6 e
  // sobe até centrar a porta; o primeiro plano (lanternas, frades, espinheiros) vai a 30 e sai do quadro;
  // o céu só avança 1,3×.
  var DUR = 1950, S0 = .86;
  var longe = $("longe"), mundo = $("mundo"), perto = $("perto"), neveTela = $("neveTela");
  function quadro(ms) {
    var t = Math.min(1, Math.max(0, ms / DUR)), p = Math.pow(t, 1.8), q = Math.pow(t, 2.2);
    mundo.style.transform = "translate(0px," + (-110 * p).toFixed(2) + "px) scale(" + (S0 * Math.pow(7.6 / S0, p)).toFixed(4) + ")";
    perto.style.transform = "translate(0px," + (-60 * p).toFixed(2) + "px) scale(" + (S0 * Math.pow(30 / S0, p)).toFixed(4) + ")";
    perto.style.visibility = t > .62 ? "hidden" : "";
    longe.style.transform = "translate(0px," + (-36 * p).toFixed(2) + "px) scale(" + (S0 * Math.pow(1.3, p)).toFixed(4) + ")";
    neveTela.style.transform = "scale(" + (1 + 2.2 * q).toFixed(3) + ")";
    neveTela.style.opacity = (1 - q).toFixed(3);
  }

    [mundo, perto, longe].forEach(function (c) { c.style.transform = "scale(" + S0 + ")"; });

  }
  repouso();

  /* ---------- abrir e reiniciar ---------- */
  var estado = "fechada", timer = 0, laco = 0;
  var entrada = $("entrada"), loja = $("loja"), botao = $("entrar");
  var calmo = matchMedia("(prefers-reduced-motion: reduce)");

    if (estado !== "fechada") return;
    estado = "abrindo";
    // na integração o som nasce aqui, no clique
    Som.destravar(); Som.play("catalog:open");
    document.body.classList.add("abrindo");
    var reduz = calmo.matches;
    if (!reduz) {
      var t0 = performance.now();
      var passo = function (agora) {
        if (estado !== "abrindo" || window.__congelado) return;
        quadro(agora - t0);
        if (agora - t0 < DUR) laco = requestAnimationFrame(passo);
      };
      laco = requestAnimationFrame(passo);

      estado = "aberta"; document.body.classList.add("aberta");

    clearTimeout(timer); cancelAnimationFrame(laco); window.__congelado = false;
    if (Som.parar) Som.parar();

    repouso();
    void document.body.offsetWidth;
    estado = "fechada";
    botao.focus({ preventScroll: true });
  }

  entrada.addEventListener("click", function (e) {
    if (e.target.closest(".ea-id")) return;
    abrir();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "r" || e.key === "R") { if (!e.ctrlKey && !e.metaKey && !e.altKey) reiniciar(); return; }
    if ((e.key === "Enter" || e.key === " ") && estado === "fechada") {
      if (e.target.closest && e.target.closest(".ea-id")) return;
      e.preventDefault(); abrir();
    }
  });

  // para o QA: congela a abertura no instante ms (câmera e animações CSS juntas, em quadros comparáveis)
  var DA_ABERTURA = /^(tranca|acorda|abre-esq|abre-dir|escurece|acende|some|luz-neve|poca|raios|flash|loja|esmaece|loja-calma|faisca-trinco|entra-nevoa)$/;
