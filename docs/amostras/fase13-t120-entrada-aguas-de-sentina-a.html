<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forja · Entrada de Águas de Sentina (A)</title>
<!-- F13-T120, opção A: "A popa do galeão encalhado" — a entrada de Águas de Sentina no molde de Noxus (T99).
     Mesmo esqueleto (palco 1440×900, camadas da câmera, vão 600–840 × 404–790, folhas em CSS 3D, trava,
     interior com o lojista, clarão, painel da loja, placa com as classes da integração); a arte toda própria,
     em SVG/CSS: a loja é a popa de um galeão pirata varado no cais, com as janelas de popa acesas, a bandeira
     negra rasgada no mastro de mezena, canhões nas portinholas, a cidade de cascos na encosta, a carcaça da
     serpente do mar no guindaste das docas e o pôr do sol de tempestade. Sem áudio. Só a textura de papel do
     projeto, por caminho relativo.
     Ajustes do juiz (07/11): a carcaça virou esqueleto de osso claro (crânio de crocodilo, costelas, crista)
     que balança na roldana de um guindaste mais alto, pingando sangue numa mancha vermelha com ondinhas;
     o galeão de velas negras contra o sol com o tiro de canhão periódico e o relâmpago raro nas nuvens;
     canhões saindo das portinholas; a cidade de cascos com quilha, tábuas e mastros de passarela; o gancho
     da capitã num braço erguido; a rede com a boia no guindaste; gaivotas maiores num sentido só e uma
     pousada no lais; o baú inteiro na tela. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --papel: #e5d3ad;
  --tinta: #2c1d12;
  --tinta-suave: #5a4630;
  --ouro: #d2a04a;
  --ouro-claro: #f3d58a;
  --rum: #8d2c22;
  --lampiao: #ffb35a;
  --lampiao-claro: #ffe2a8;
  --mar: #0d3236;
  --titulos: 'IM Fell English SC', 'IM Fell English', Georgia, serif;
  --texto: 'Alegreya', Georgia, serif;
  --gravado: 'Cinzel', Georgia, serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: #0a0610; overflow: hidden; color: var(--tinta); font-family: var(--texto); }

/* ============ A CENA ============ */
.entrada { position: fixed; inset: 0; overflow: hidden; cursor: pointer; background: #12081a; }
/* o palco: 1440×900 de desenho, encaixado inteiro na tela (o resto da arte sangra para fora) */
.palco { position: absolute; left: 50%; top: 50%; width: 1440px; height: 900px; transform-origin: 50% 50%; }
/* três camadas de câmera (paralaxe): longe (céu, mar, cidade de cascos, guindaste), mundo (o galeão),
   perto (lampiões, estacas com o cabo, o canhão e o baú). A câmera anda por JS (requestAnimationFrame). */
.camada { position: absolute; inset: 0; transform-origin: 720px 597px; transform: scale(.86); will-change: transform; }
.camada > * { position: absolute; }
.longe { pointer-events: none; }
.perto { pointer-events: none; }

/* o céu do pôr do sol de tempestade: anil no alto, magenta no meio, laranja no horizonte (y 600) */
.ceu { left: -900px; top: -700px; width: 3240px; height: 2000px;
  background:
    radial-gradient(ellipse 760px 300px at 1090px 1290px, rgba(255,170,80,.75), transparent 72%),
    radial-gradient(ellipse 1500px 420px at 1300px 1300px, rgba(255,110,60,.45), transparent 70%),
    radial-gradient(ellipse 900px 300px at 2300px 1120px, rgba(190,50,110,.45), transparent 70%),
    linear-gradient(180deg, #0c0716 0, #170b26 420px, #2c1040 640px, #521850 800px, #8a2352 940px, #c23e44 1080px, #e8693a 1190px, #f6994a 1270px, #fbb35a 1300px, #fbb35a 1320px); }
/* o sol baixo, meio afundado no mar (o mar desenhado por cima corta a parte de baixo) */
.sol { left: 112px; top: 506px; width: 160px; height: 160px; border-radius: 50%;
  background: radial-gradient(circle, #fff6d8 0, #ffe2a0 22%, #ffb35a 40%, #ff7a3a 52%, rgba(255,90,50,.0) 70%); }
.sol::before { content: ""; position: absolute; left: -110%; top: -110%; width: 320%; height: 320%; border-radius: 50%; mix-blend-mode: screen; pointer-events: none;
  background: radial-gradient(circle, rgba(255,170,90,.55) 0, rgba(255,110,70,.22) 20%, rgba(220,60,90,.08) 38%, transparent 56%); }
svg.nuvens { left: -900px; top: -700px; width: 3240px; height: 2000px; overflow: visible; animation: nuvens 70s ease-in-out infinite alternate; }
@keyframes nuvens { from { transform: translateX(0); } to { transform: translateX(-140px); } }
svg.cidade { left: -900px; top: -700px; width: 3240px; height: 2000px; overflow: visible; }
svg.cidade .reflexo { animation: cintila 3.4s ease-in-out infinite; }
svg.cidade .reflexo2 { animation: cintila 2.6s ease-in-out -1.3s infinite; }
@keyframes cintila { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
svg.cidade .janelas-vivas { animation: respira 5.5s ease-in-out infinite; }
/* as gaivotas: brancas, de ponta de asa escura, atravessam o céu num sentido só (da esquerda para a direita) */
.gaivota { left: -460px; width: 64px; height: 30px; overflow: visible; animation: voo 44s linear infinite; }
.gaivota .asas { transform-box: fill-box; transform-origin: 50% 62%; animation: asa .62s ease-in-out infinite alternate; }
.gaivota.v1 { top: 120px; animation-delay: -32.5s; }
.gaivota.v2 { top: 236px; width: 50px; height: 24px; animation-duration: 52s; animation-delay: -41.8s; }
.gaivota.v3 { top: 20px; animation-duration: 40s; animation-delay: -33.3s; }
.gaivota.v4 { top: 330px; width: 44px; height: 21px; animation-duration: 58s; animation-delay: -1s; }
.gaivota.v2 .asas { animation-duration: .74s; } .gaivota.v3 .asas { animation-duration: .54s; animation-delay: -.2s; } .gaivota.v4 .asas { animation-duration: .5s; animation-delay: -.3s; }
@keyframes voo { 0% { transform: translate(0, 0); } 30% { transform: translate(620px, 16px); } 62% { transform: translate(1300px, -14px); } 100% { transform: translate(2100px, 8px); } }
@keyframes asa { from { transform: scaleY(1); } to { transform: scaleY(-.45); } }
/* a carcaça da serpente do mar no gancho do guindaste: balança devagar em torno da roldana */
svg.serpente { left: 45px; top: -8px; width: 312px; height: 671px; overflow: visible; pointer-events: none;
  transform-origin: 145px 20px; animation: carcaca 9s ease-in-out infinite; }
@keyframes carcaca { 0%,100% { transform: rotate(-.9deg); } 50% { transform: rotate(.8deg); } }
/* o sangue que pinga do focinho e as ondinhas que ele faz na água */
.gota { animation: pinga 2.4s cubic-bezier(.5,0,1,1) infinite; }
.gota.g2 { animation-delay: -1.1s; animation-duration: 3.1s; }
@keyframes pinga { 0%, 20% { transform: translateY(0); opacity: 0; } 24% { opacity: 1; } 92% { opacity: 1; } 100% { transform: translateY(40px); opacity: 0; } }
.onda { transform-box: fill-box; transform-origin: 50% 50%; animation: onda 2.4s ease-out infinite; }
.onda.o2 { animation-delay: -1.1s; animation-duration: 3.1s; }
@keyframes onda { 0%, 88% { transform: scale(.2); opacity: 0; } 92% { opacity: .9; } 100% { transform: scale(1.6); opacity: 0; } }
/* o relâmpago dentro das nuvens (raro, curto, abafado) */
.relampago { left: -900px; top: -700px; width: 3240px; height: 1300px; pointer-events: none; opacity: 0; mix-blend-mode: screen;
  background: radial-gradient(ellipse 760px 380px at 2080px 720px, rgba(220,200,255,.55), rgba(160,120,220,.18) 45%, transparent 75%);
  animation: relampago 13s linear infinite; }
@keyframes relampago { 0%, 61% { opacity: 0; } 61.6% { opacity: .9; } 62.3% { opacity: .1; } 63% { opacity: .6; } 64.5%, 100% { opacity: 0; } }
/* o tiro de canhão do galeão de velas negras ao longe: clarão e fumaça */
.tiro { left: 104px; top: 597px; width: 0; height: 0; }
.tiro i { position: absolute; border-radius: 50%; }
.tiro .clarao { left: -18px; top: -14px; width: 36px; height: 28px; mix-blend-mode: screen;
  background: radial-gradient(circle, #fff4d0 0, #ffb050 35%, rgba(255,120,40,0) 70%); opacity: 0; animation: tiro-clarao 11s linear -1.2s infinite; }
.tiro .fumo { left: -34px; top: -30px; width: 68px; height: 56px; filter: blur(4px);
  background: radial-gradient(circle, rgba(236,226,220,.92), rgba(200,186,186,.5) 55%, transparent 75%); opacity: 0; animation: tiro-fumo 11s ease-out -1.2s infinite; }
@keyframes tiro-clarao { 0%, 30% { opacity: 0; } 30.4% { opacity: 1; } 31.5%, 100% { opacity: 0; } }
@keyframes tiro-fumo { 0%, 30% { opacity: 0; transform: translate(0,0) scale(.3); } 31% { opacity: .9; } 60% { opacity: .35; } 80%, 100% { opacity: 0; transform: translate(34px, -34px) scale(2.6); } }

svg.fundo { left: -600px; top: -400px; width: 2640px; height: 1700px; overflow: visible; }
svg.frente { left: -600px; top: -400px; width: 2640px; height: 1700px; overflow: visible; }
/* a bandeira negra rasgada: presa ao mastro de mezena pela borda da direita, ondula no compositor */
svg.bandeira { left: 361px; top: -74px; width: 232px; height: 116px; overflow: visible; transform-origin: 100% 40%; pointer-events: none;
  animation: bandeira 3.8s ease-in-out infinite; }
@keyframes bandeira { 0%,100% { transform: skewY(0deg) scaleX(1); } 25% { transform: skewY(2.4deg) scaleX(.965); } 55% { transform: skewY(-1.6deg) scaleX(1.01); } 78% { transform: skewY(1.2deg) scaleX(.98); } }
/* o brilho das lanternas de popa e das janelas acesas */
.lanterna-halo { width: 200px; height: 200px; margin: -100px 0 0 -100px; border-radius: 50%; pointer-events: none; mix-blend-mode: screen;
  background: radial-gradient(circle, rgba(255,200,110,.55), rgba(255,140,60,.18) 38%, transparent 70%); animation: tremula 2.6s steps(8) infinite; }
.lanterna-halo.l1 { left: 720px; top: 50px; width: 240px; height: 240px; margin: -120px 0 0 -120px; }
.lanterna-halo.l2 { left: 410px; top: 88px; animation-duration: 2.1s; animation-delay: -.6s; }
.lanterna-halo.l3 { left: 1030px; top: 88px; animation-duration: 2.9s; animation-delay: -1.2s; }
.janelas-halo { left: 400px; top: 150px; width: 640px; height: 250px; pointer-events: none; mix-blend-mode: screen;
  background:
    radial-gradient(ellipse 46% 26% at 50% 34%, rgba(255,170,80,.34), transparent 75%),
    radial-gradient(ellipse 40% 22% at 50% 76%, rgba(255,150,70,.26), transparent 75%);
  animation: respira 4.8s ease-in-out infinite; }
@keyframes respira { 0%,100% { opacity: .74; } 45% { opacity: 1; } 70% { opacity: .84; } }
@keyframes tremula { 0% { opacity: .82; } 13% { opacity: .95; } 27% { opacity: .78; } 41% { opacity: 1; } 55% { opacity: .86; } 70% { opacity: .97; } 84% { opacity: .8; } 100% { opacity: .9; } }
/* o ouro do baú pisca */
.brilho-ouro { width: 14px; height: 14px; margin: -7px 0 0 -7px; pointer-events: none; mix-blend-mode: screen; opacity: 0;
  background: radial-gradient(circle, #fff 0 1px, rgba(255,230,150,.9) 2px, transparent 7px),
    linear-gradient(90deg, transparent 6px, rgba(255,240,190,.9) 6px 8px, transparent 8px),
    linear-gradient(0deg, transparent 6px, rgba(255,240,190,.9) 6px 8px, transparent 8px);
  animation: pisca 3.2s ease-in-out infinite; }
@keyframes pisca { 0%,70%,100% { opacity: 0; transform: scale(.4) rotate(0); } 82% { opacity: 1; transform: scale(1) rotate(30deg); } }

/* ============ A PORTA ============ */
/* o vão: 240×386, de x 600 a 840, y 404 a 790 (a escotilha de carga aberta na popa) */
.vao { left: 600px; top: 404px; width: 240px; height: 386px; perspective: 820px; perspective-origin: 50% 46%; }
.interior { position: absolute; inset: 0; overflow: hidden; background: #4a2008; }
.interior svg { display: block; width: 100%; height: 100%; }
.interior .acende { position: absolute; inset: 0; opacity: 0;
  background: radial-gradient(ellipse 70% 55% at 50% 34%, #fff0c8, rgba(255,190,100,.6) 45%, rgba(255,140,50,0) 80%); mix-blend-mode: screen; }
.folha { position: absolute; top: 0; width: 120px; height: 386px; transform-style: preserve-3d; backface-visibility: hidden; will-change: transform; }
.folha.esq { left: 0; transform-origin: 0 50%; }
.folha.dir { right: 0; transform-origin: 100% 50%; }
/* as tábuas do casco, em pé: juntas calafetadas com breu, veios, nós e o sal que subiu de baixo */
.chapas { position: absolute; inset: 0;
  background:
    linear-gradient(180deg, rgba(0,0,0,.42), transparent 18%, transparent 70%, rgba(190,200,170,.06) 86%, rgba(255,170,80,.16)),
    radial-gradient(circle at 50% 50%, #c9a25a 0 1.3px, #5a3a14 2.2px, transparent 2.9px) 13px 22px / 30px 46px,
    repeating-linear-gradient(90deg, rgba(0,0,0,.62) 0 2px, rgba(255,210,160,.08) 2px 3px, transparent 3px 30px),
    repeating-linear-gradient(91deg, rgba(255,226,190,.035) 0 1px, transparent 1px 6px),
    radial-gradient(ellipse 7px 12px at 22% 30%, rgba(20,8,2,.5), transparent 70%),
    radial-gradient(ellipse 6px 10px at 74% 72%, rgba(20,8,2,.45), transparent 70%),
    linear-gradient(90deg, #2c1a10, #4e301c 34%, #452a18 68%, #24150c); }
.folha.esq .chapas { box-shadow: inset 0 0 0 5px #140a05, inset 0 0 0 7px #5a3a1e, inset -3px 0 0 7px #0e0603; }
.folha.dir .chapas { box-shadow: inset 0 0 0 5px #140a05, inset 0 0 0 7px #5a3a1e, inset 3px 0 0 7px #0e0603; }
/* as ferragens: cintas de ferro negro com a ponta em flor-de-lis cortada */
.cinta { position: absolute; height: 18px; width: 108px;
  background:
    radial-gradient(circle at 50% 50%, #b0a49a 0 1.8px, #2a2420 2.6px, transparent 3.2px) 10px 0 / 22px 100% repeat-x,
    linear-gradient(180deg, #4e4640 0, #2c2622 40%, #141110 100%);
  box-shadow: 0 3px 3px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.12); }
.folha.esq .cinta { left: -6px; clip-path: polygon(0 0, 82% 0, 88% 30%, 100% 50%, 88% 70%, 82% 100%, 0 100%); }
.folha.dir .cinta { right: -6px; clip-path: polygon(18% 0, 100% 0, 100% 100%, 18% 100%, 12% 70%, 0 50%, 12% 30%); }
.cinta.c1 { top: 26px; } .cinta.c2 { top: 250px; } .cinta.c3 { top: 340px; }
/* os grampos da tranca (a parte da frente repete por cima da barra; ver .grampo-frente) */
.suporte { position: absolute; top: 188px; width: 22px; height: 50px; border-radius: 3px;
  background: radial-gradient(circle at 50% 6px, #b0a49a 0 1.7px, transparent 2.5px), radial-gradient(circle at 50% 44px, #b0a49a 0 1.7px, transparent 2.5px), linear-gradient(90deg, #171311, #4a423c 50%, #171311);
  box-shadow: 0 2px 3px rgba(0,0,0,.6); }
.folha.esq .suporte { left: 46px; } .folha.dir .suporte { right: 58px; }
/* argolas de latão (puxadores) presas num espelho redondo */
.argola { position: absolute; top: 264px; width: 34px; height: 36px; }
.folha.esq .argola { right: 14px; } .folha.dir .argola { left: 14px; }
.argola::before { content: ""; position: absolute; left: 9px; top: -6px; width: 16px; height: 16px; border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #f3d58a, #8a5f18 70%); box-shadow: 0 1px 2px rgba(0,0,0,.8), 0 0 0 3px #3a2408; }
.argola::after { content: ""; position: absolute; left: 1px; top: 4px; width: 32px; height: 32px; border-radius: 50%;
  border: 4px solid #8a5f18; border-top-color: #f0cc78; box-shadow: 0 3px 3px rgba(0,0,0,.6); }
/* meia serpente de latão em cada folha: fechada, a porta mostra o medalhão inteiro */
.meia { position: absolute; top: 50px; width: 66px; height: 136px; overflow: hidden; filter: drop-shadow(0 3px 2px rgba(0,0,0,.7)); }
.folha.esq .meia { right: 0; } .folha.dir .meia { left: 0; }
.folha .sombra { position: absolute; inset: 0; background: #050304; opacity: 0; }
/* espessura da folha (a borda que aparece quando gira) */
.folha .borda { position: absolute; top: 0; height: 100%; width: 18px; background: linear-gradient(90deg, #160c06, #4a2e1a, #120a05); }
.folha.esq .borda { right: 0; transform-origin: 100% 50%; transform: rotateY(-90deg); }
.folha.dir .borda { left: 0; transform-origin: 0 50%; transform: rotateY(90deg); }
/* a luz pela fresta do meio (quase apagada onde o medalhão atravessa, y 454–590) e debaixo da porta */
.fresta-meio { left: 718px; top: 404px; width: 4px; height: 386px; pointer-events: none;
  background: linear-gradient(180deg, rgba(255,170,80,0), rgba(255,190,110,.7) 10%, rgba(255,214,150,.85) 64%, rgba(255,170,80,.6));
  -webkit-mask-image: linear-gradient(180deg, #000 0, #000 12%, rgba(0,0,0,.1) 15%, rgba(0,0,0,.1) 48%, #000 52%, #000 100%);
          mask-image: linear-gradient(180deg, #000 0, #000 12%, rgba(0,0,0,.1) 15%, rgba(0,0,0,.1) 48%, #000 52%, #000 100%);
  filter: blur(1.5px); mix-blend-mode: screen; }
.fresta-chao { left: 596px; top: 783px; width: 248px; height: 14px; pointer-events: none; border-radius: 50%;
  background: radial-gradient(ellipse at 50% 50%, rgba(255,214,140,.95), rgba(255,150,60,.5) 45%, transparent 75%);
  filter: blur(2px); mix-blend-mode: screen; }
/* a tranca: uma viga de carvalho cintada de ferro que corre pelos grampos e entra na bainha à esquerda */
.tranca { left: 632px; top: 598px; width: 160px; height: 32px; border-radius: 3px;
  background:
    linear-gradient(90deg, transparent 0 18px, #1c1714 18px 30px, transparent 30px calc(100% - 44px), #1c1714 calc(100% - 44px) calc(100% - 32px), transparent calc(100% - 32px)),
    radial-gradient(circle at 50% 50%, #b8aca0 0 1.8px, #2a2420 2.8px, transparent 3.4px) 21px 0 / 120px 100% repeat-x,
    repeating-linear-gradient(180deg, rgba(255,226,190,.07) 0 2px, transparent 2px 6px),
    linear-gradient(180deg, #7a5232, #5a3a22 40%, #3e2616 75%, #24160c);
  box-shadow: 0 7px 9px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,230,190,.25), inset 0 -2px 0 rgba(0,0,0,.5); }
/* o punho de ferro, que fica de fora pela fenda da bainha */
.tranca::after { content: ""; position: absolute; left: 56px; top: -24px; width: 16px; height: 28px; border-radius: 8px 8px 3px 3px;
  background: radial-gradient(circle at 40% 30%, #c9bdb2 0 2px, transparent 4px), linear-gradient(90deg, #221c18, #6a5e56 45%, #2a2420);
  box-shadow: 0 2px 2px rgba(0,0,0,.6); }
.tranca::before { content: ""; position: absolute; right: -10px; top: -5px; width: 16px; height: 42px; border-radius: 3px;
  background: linear-gradient(90deg, #191512, #57504a 50%, #191512); box-shadow: 0 3px 3px rgba(0,0,0,.6); }
svg.bainha { left: 432px; top: 568px; width: 186px; height: 84px; overflow: visible; pointer-events: none; }
.grampo-frente { width: 22px; height: 50px; top: 592px; border-radius: 3px; pointer-events: none;
  background: radial-gradient(circle at 50% 6px, #b0a49a 0 1.7px, transparent 2.5px), radial-gradient(circle at 50% 44px, #b0a49a 0 1.7px, transparent 2.5px), linear-gradient(90deg, #171311, #4a423c 50%, #171311);
  box-shadow: 0 2px 3px rgba(0,0,0,.6); }
.grampo-frente.g1 { left: 646px; } .grampo-frente.g2 { left: 760px; }
/* as faíscas do ferro da tranca raspando no grampo */
.faiscas-trinco { left: 648px; top: 612px; width: 0; height: 0; pointer-events: none; }
.faiscas-trinco i { position: absolute; left: 0; top: 0; width: 3px; height: 3px; border-radius: 50%; background: #fff1c0;
  box-shadow: 0 0 5px 2px rgba(255,170,60,.9); opacity: 0; }

/* a luz que sai pela escotilha e deita nas tábuas molhadas do cais */
.luz-neve { left: 420px; top: 760px; width: 600px; height: 200px; pointer-events: none; opacity: .3; border-radius: 50%;
  background: radial-gradient(ellipse 50% 50% at 50% 30%, rgba(255,190,100,.7), rgba(255,130,50,.26) 50%, transparent 78%);
  mix-blend-mode: screen; }
.poca { left: 360px; top: 806px; width: 720px; height: 360px; pointer-events: none; opacity: .5; transform-origin: 50% 0;
  clip-path: polygon(33% 0, 67% 0, 100% 100%, 0 100%);
  background: radial-gradient(ellipse 60% 85% at 50% 0, rgba(255,210,130,.95), rgba(255,140,60,.42) 45%, transparent 82%);
  mix-blend-mode: screen; transform: scaleY(.3); }
.raios { left: 270px; top: 200px; width: 900px; height: 800px; pointer-events: none; opacity: 0;
  background:
    radial-gradient(ellipse 30% 40% at 50% 50%, rgba(255,220,150,.85), rgba(255,160,70,.25) 55%, transparent 80%),
    repeating-conic-gradient(from 0deg at 50% 50%, rgba(255,200,120,.18) 0 4deg, transparent 4deg 11deg);
  -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 0, rgba(0,0,0,.6) 35%, transparent 70%);
          mask-image: radial-gradient(circle at 50% 50%, #000 0, rgba(0,0,0,.6) 35%, transparent 70%);
  mix-blend-mode: screen; }

/* ============ OS LAMPIÕES (camada de perto): lanterna de navio no alto de uma estaca de cais ============ */
.lampiao { width: 140px; height: 330px; top: 575px; transform: scale(1.12); transform-origin: 50% 100%; }
.lampiao.b1 { left: 395px; } .lampiao.b2 { left: 905px; }
.lampiao svg { position: absolute; inset: 0; width: 140px; height: 330px; overflow: visible; }
.halo { position: absolute; left: 70px; top: 76px; width: 520px; height: 520px; margin: -260px 0 0 -260px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,190,100,.38), rgba(255,140,50,.13) 30%, rgba(255,110,40,.05) 52%, transparent 66%);
  animation: tremula 2.3s steps(9) infinite; }
.b2 .halo { animation-duration: 1.9s; animation-delay: -.7s; }
.chamas { position: absolute; left: 70px; top: 100px; width: 0; height: 0; }
.ch { position: absolute; bottom: -2px; transform-origin: 50% 100%; mix-blend-mode: screen; filter: blur(1px);
  animation: chama .8s ease-in-out infinite alternate; }
.ch::before { content: ""; position: absolute; left: 0; bottom: 0; width: 100%; aspect-ratio: 1; border-radius: 0 50% 50% 50%; transform: rotate(45deg); transform-origin: 50% 50%;
  background: radial-gradient(circle at 62% 62%, #fff6d8 0, #ffd27a 26%, #ff9a3a 55%, rgba(220,90,20,0) 84%); }
.ch.f1 { left: -9px; width: 18px; height: 18px; animation-duration: .9s; }
.ch.f2 { left: -5px; width: 10px; height: 10px; animation-duration: .62s; animation-delay: -.3s; }
.ch.f2::before { background: radial-gradient(circle at 62% 62%, #fffdf0 0, #fff0b8 35%, #ffc260 60%, rgba(255,150,40,0) 82%); }
@keyframes chama { 0% { transform: scale(1, 1.6) skewX(-5deg); } 35% { transform: scale(.9, 1.9) skewX(-9deg); } 70% { transform: scale(1.06, 1.5) skewX(-3deg); } 100% { transform: scale(.95, 1.8) skewX(-7deg); } }

/* a luz dos lampiões e das lanternas no casco */
.luz-fachada { left: 0; top: 0; width: 1440px; height: 900px; pointer-events: none; mix-blend-mode: soft-light;
  background:
    radial-gradient(ellipse 380px 330px at 465px 640px, rgba(255,170,80,.9), transparent 70%),
    radial-gradient(ellipse 380px 330px at 975px 640px, rgba(255,170,80,.9), transparent 70%),
    radial-gradient(ellipse 520px 200px at 720px 120px, rgba(255,180,90,.6), transparent 70%);
  animation: tremula 2.7s steps(7) infinite; }

/* ============ A PLACA: tábua de proa pendurada por dois cabos no lais que sai da alheta do galeão ============ */
.placa-grupo { left: 1024px; top: 398px; width: 360px; transform-origin: 50% 0; animation: balanca 5.6s ease-in-out infinite; cursor: default; }
@keyframes balanca { 0%,100% { transform: rotate(-1.1deg); } 50% { transform: rotate(1.2deg); } }
/* o cabo: corda torcida de cânhamo */
.corrente { position: absolute; top: -6px; width: 9px; height: 40px; border-radius: 4px;
  background:
    repeating-linear-gradient(62deg, #d8b678 0 2.5px, #9a7440 2.5px 5px, #5a3e1e 5px 6.5px),
    #8a6a3a;
  box-shadow: 1px 2px 2px rgba(0,0,0,.5); }
.corrente.e { left: 35px; } .corrente.d { right: 35px; }
.entrada-placa { position: relative; margin-top: 32px; padding: 16px 20px 18px; border-radius: 6px; text-align: center;
  border: 2px solid #0e0704;
  background:
    radial-gradient(circle at 14px 14px, #f0cc78 0 2.2px, #5a3a14 3.4px, transparent 4.4px),
    radial-gradient(circle at calc(100% - 14px) 14px, #f0cc78 0 2.2px, #5a3a14 3.4px, transparent 4.4px),
    radial-gradient(circle at 14px calc(100% - 14px), #f0cc78 0 2.2px, #5a3a14 3.4px, transparent 4.4px),
    radial-gradient(circle at calc(100% - 14px) calc(100% - 14px), #f0cc78 0 2.2px, #5a3a14 3.4px, transparent 4.4px),
    radial-gradient(ellipse 60% 50% at 0% 100%, rgba(170,200,180,.10), transparent 70%),
    radial-gradient(ellipse 50% 40% at 80% 6%, rgba(255,200,140,.10), transparent 70%),
    repeating-linear-gradient(180deg, transparent 0 58px, rgba(0,0,0,.55) 58px 60px, rgba(255,220,180,.07) 60px 61px, transparent 61px 119px),
    repeating-linear-gradient(91deg, rgba(255,230,200,.035) 0 1px, transparent 1px 5px, rgba(0,0,0,.06) 5px 6px),
    linear-gradient(180deg, #13302f, #0f2726 48%, #0a1c1c);
  box-shadow: 0 20px 30px rgba(0,0,0,.72), inset 0 0 0 4px #0a0a08, inset 0 0 0 6px #c8963e, inset 0 0 0 7px #3a2408, inset 0 2px 0 7px rgba(255,255,255,.05); }
/* as volutas entalhadas e douradas nas duas pontas da tábua */
.entrada-placa::before, .entrada-placa::after { content: ""; position: absolute; top: 50%; width: 30px; height: 64px; margin-top: -32px; pointer-events: none;
  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 64'><path d='M28 4 C8 6 2 20 8 30 C12 36 22 34 21 27 C20 22 13 23 14 27 M28 60 C8 58 2 44 8 34' fill='none' stroke='%230e0704' stroke-width='7' stroke-linecap='round'/><path d='M28 4 C8 6 2 20 8 30 C12 36 22 34 21 27 C20 22 13 23 14 27 M28 60 C8 58 2 44 8 34' fill='none' stroke='%23c8963e' stroke-width='4' stroke-linecap='round'/><path d='M27 5 C10 7 4 19 9 28' fill='none' stroke='%23f3d58a' stroke-width='1.2' stroke-linecap='round'/></svg>") center / contain no-repeat; }
.entrada-placa::before { left: -26px; }
.entrada-placa::after { right: -26px; transform: scaleX(-1); }
.entrada-titulo { margin: 4px 0 12px; font-family: var(--titulos); font-weight: 400; font-size: 44px; line-height: 1; letter-spacing: .03em;
  color: #f3d58a; text-shadow: 0 2px 0 #000, 0 0 14px rgba(255,190,90,.28); }
.pergaminho { position: relative; padding: 14px 15px 13px; transform: rotate(-.6deg);
  background-color: var(--papel); background-image: url("../../assets/textures/shopitem_papertexture03_psd.png");
  background-size: 420px; background-blend-mode: multiply; color: var(--tinta);
  box-shadow: 0 3px 6px rgba(0,0,0,.6), inset 0 0 18px rgba(110,60,30,.28), inset 0 0 50px rgba(40,10,0,.08);
  clip-path: polygon(0 1%, 7% 0, 22% 1.2%, 41% .2%, 63% 1%, 84% 0, 100% 1.4%, 99.4% 30%, 100% 62%, 99.2% 99%, 78% 100%, 55% 98.8%, 31% 100%, 12% 99%, .6% 100%, 0 70%, .8% 38%); }
.pergaminho .cravo { position: absolute; top: 6px; width: 9px; height: 9px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #b0a49a, #2a2420 70%); box-shadow: 0 1px 1px rgba(0,0,0,.6), 0 0 0 1.5px rgba(30,20,20,.35); }
.pergaminho .cravo.e { left: 7px; } .pergaminho .cravo.d { right: 7px; }
.entrada-hobby { margin: 0 0 10px; font-style: italic; font-size: 17px; line-height: 1.3; color: var(--tinta); }
.entrada-contato { margin: 0; padding-top: 9px; border-top: 1px dashed rgba(60,40,20,.38);
  font-family: var(--gravado); font-size: 13.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--tinta-suave); line-height: 1.75; }
.entrada-contato .ea-rot { display: block; font-size: 13.5px; font-weight: 600; letter-spacing: .2em; margin-bottom: 1px; }
.entrada-contato .ea-canal { display: block; white-space: nowrap; }
.entrada-contato .ea-id { font-family: var(--texto); font-size: 19px; font-weight: 700; letter-spacing: .02em; text-transform: none;
  color: var(--tinta); user-select: all; -webkit-user-select: all; cursor: text; margin-left: 4px;
  border-bottom: 1px dotted rgba(44,29,18,.35); }
.entrada-contato .ea-id:hover { border-bottom-color: var(--rum); color: var(--rum); }
/* a etiqueta da versão: uma tabuinha pendurada por dois cabinhos sob a tábua */
.etiqueta { position: relative; width: 360px; margin: 18px auto 0; padding: 7px 8px 8px; border-radius: 3px; text-align: center;
  border: 2px solid #0e0704; transform-origin: 50% -18px; animation: balanca2 4.2s ease-in-out infinite;
  background:
    repeating-linear-gradient(91deg, rgba(255,230,200,.04) 0 1px, transparent 1px 5px),
    linear-gradient(180deg, #5a3820, #45291a 60%, #34200f);
  box-shadow: 0 8px 14px rgba(0,0,0,.6), inset 0 0 0 2px #1c0f06, inset 0 1px 0 2px rgba(255,210,160,.12); }
.etiqueta::before, .etiqueta::after { content: ""; position: absolute; top: -20px; width: 6px; height: 20px; border-radius: 3px;
  background: repeating-linear-gradient(62deg, #d8b678 0 2px, #9a7440 2px 4px, #5a3e1e 4px 5px); }
.etiqueta::before { left: 36px; } .etiqueta::after { right: 36px; }
@keyframes balanca2 { 0%,100% { transform: rotate(1.4deg); } 50% { transform: rotate(-1.6deg); } }
.entrada-nota .nw { white-space: nowrap; }
.entrada-nota { margin: 0; font-style: italic; font-size: 15px; color: #f1e2cc; line-height: 1.3; text-shadow: 0 1px 0 #120302; }

/* ============ SOBRE A CENA (tela, não mundo) ============ */
/* o borrifo do mar que o vento traz (gotas finas, inclinadas) */
.neve { position: absolute; left: -60%; top: -60%; width: 220%; height: 220%; pointer-events: none; will-change: transform; }
.neve.n1 { animation: cai 7s linear infinite; opacity: .55; }
.neve.n2 { animation: cai 4.2s linear infinite; opacity: .5; filter: blur(.8px); }
@keyframes cai { from { transform: rotate(64deg) translateY(calc(var(--t) * -1)); } to { transform: rotate(64deg) translateY(0); } }
.nevoa { position: absolute; left: -20%; right: -20%; bottom: -4%; height: 40%; pointer-events: none;
  background:
    radial-gradient(ellipse 30% 40% at 20% 70%, rgba(150,170,180,.14), transparent 70%),
    radial-gradient(ellipse 34% 36% at 70% 80%, rgba(170,140,170,.12), transparent 70%),
    linear-gradient(180deg, transparent, rgba(30,40,50,.18) 60%, rgba(20,24,34,.32));
  animation: nevoa 16s ease-in-out infinite alternate; }
@keyframes nevoa { from { transform: translateX(-4%); } to { transform: translateX(4%); } }
/* rolos de maresia que atravessam o cais */
.rajada { position: absolute; left: -60%; width: 90%; height: 220px; pointer-events: none; border-radius: 50%;
  background: radial-gradient(ellipse at 50% 50%, rgba(190,190,210,.13), transparent 70%); filter: blur(16px);
  animation: rajada 17s linear infinite; }
.rajada.r2 { top: 64%; animation-duration: 21s; animation-delay: -9s; height: 280px; }
.rajada.r1 { top: 30%; }
@keyframes rajada { 0% { transform: translate(0, 0) rotate(3deg); opacity: 0; } 20% { opacity: 1; } 80% { opacity: .8; } 100% { transform: translate(190%, 6vh) rotate(3deg); opacity: 0; } }
.vinheta { position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse 80% 76% at 50% 56%, transparent 52%, rgba(8,3,12,.62) 100%); }
.grao { position: absolute; inset: 0; pointer-events: none; opacity: .28; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .6 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); }
.flash { position: absolute; inset: 0; pointer-events: none; opacity: 0;
  background: radial-gradient(ellipse 70% 70% at 50% 55%, #fff6e0, #ffd59a 45%, #e8924a 100%); }
.dica { position: absolute; left: 0; right: 0; bottom: 16px; margin: 0; text-align: center; pointer-events: none;
  font-family: var(--texto); font-style: italic; font-size: 14px; letter-spacing: .04em; color: rgba(240,226,206,.55);
  text-shadow: 0 1px 2px rgba(0,0,0,.7); animation: dica-chega 1.2s ease 1.4s both, dica-pulsa 4s ease-in-out 2.6s infinite; }
@keyframes dica-chega { from { opacity: 0; } to { opacity: 1; } }
@keyframes dica-pulsa { 0%,100% { opacity: 1; } 50% { opacity: .62; } }
/* o botão para leitor de tela e teclado: invisível até receber foco pelo teclado (Tab) */
.btn-entrar { position: absolute; left: 50%; bottom: 50px; transform: translateX(-50%); padding: 8px 22px; cursor: pointer;
  font-family: var(--titulos); font-size: 17px; letter-spacing: .08em; color: #f4e6d4; background: var(--rum);
  border: 1px solid #4a0c09; border-radius: 2px; box-shadow: 0 3px 0 #3a0907, 0 6px 12px rgba(0,0,0,.5);
  opacity: 0; }
.btn-entrar:focus-visible { opacity: 1; outline: 2px solid var(--lampiao-claro); outline-offset: 3px; }

/* a loja (placeholder: na integração é o app) */
.loja { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  visibility: hidden; opacity: 0;
  background:
    radial-gradient(ellipse 900px 520px at 50% 40%, rgba(255,190,110,.14), transparent 70%),
    repeating-linear-gradient(180deg, transparent 0 10px, rgba(0,0,0,.09) 10px 11px),
    repeating-linear-gradient(180deg, transparent 0 118px, rgba(0,0,0,.45) 118px 120px),
    linear-gradient(180deg, #3b2617, #2a1a0f 60%, #21130a); }
.loja h2 { margin: 0; font-family: var(--titulos); font-weight: 400; font-size: 64px; color: #e8d3a2; text-shadow: 0 2px 0 #1a0d05; letter-spacing: .03em; }
.loja p { margin: 0; font-family: var(--texto); font-style: italic; font-size: 15px; color: #b89a66; }
.loja .atalho { position: absolute; right: 18px; bottom: 14px; font-family: var(--gravado); font-size: 11px; letter-spacing: .2em; color: #8a6e48; text-transform: uppercase; }

/* ============ A ABERTURA ============ */
body.abrindo .entrada { cursor: default; }
/* a tranca: um tranco para a direita (destrava), corre para a esquerda e bate no fundo da bainha (0–0,42 s) */
body.abrindo .tranca { animation: tranca .42s cubic-bezier(.5,0,.3,1) both; }
@keyframes tranca {
  0%   { transform: translateX(0); }
  14%  { transform: translateX(7px) translateY(-1px); }
  24%  { transform: translateX(4px); }
  82%  { transform: translateX(-192px); }
  91%  { transform: translateX(-181px); }
  100% { transform: translateX(-186px); }
}
body.abrindo .grampo-frente { animation: some .12s linear .26s both; }
body.abrindo .faiscas-trinco i { animation: faisca-trinco .5s cubic-bezier(.2,.7,.4,1) both; }
@keyframes faisca-trinco { 0% { opacity: 0; transform: translate(0, 0); } 8% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--fx), var(--fy)); } }
/* o olho da serpente de latão acende no clique */
body.abrindo .insignia-acorda { animation: acorda .7s ease-out both; }
@keyframes acorda { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: .85; } }
body.abrindo .folha.esq { animation: abre-esq 1.25s cubic-bezier(.55,.02,.2,1) .26s both; }
body.abrindo .folha.dir { animation: abre-dir 1.25s cubic-bezier(.55,.02,.2,1) .26s both; }
@keyframes abre-esq { 0% { transform: rotateY(0); } 7% { transform: rotateY(-1.2deg); } 100% { transform: rotateY(82deg); } }
@keyframes abre-dir { 0% { transform: rotateY(0); } 7% { transform: rotateY(1.2deg); } 100% { transform: rotateY(-82deg); } }
body.abrindo .folha .sombra { animation: escurece 1.25s ease-in .26s both; }
@keyframes escurece { to { opacity: .66; } }
body.abrindo .interior .acende { animation: acende 1.1s ease-out .3s both; }
@keyframes acende { to { opacity: 1; } }
body.abrindo .fresta-meio { animation: some .3s ease .32s both; }
@keyframes some { to { opacity: 0; } }
/* a luz quente se espalha pelo cais logo no começo */
body.abrindo .luz-neve { animation: luz-neve .6s ease-out .02s both; }
@keyframes luz-neve { to { opacity: 1; transform: scale(1.25, 1.1); } }
body.abrindo .poca { animation: poca 1.1s cubic-bezier(.3,.6,.3,1) .05s both; }
@keyframes poca { to { opacity: 1; transform: scaleY(1); } }
body.abrindo .raios { animation: raios 1.4s ease-out .4s both; }
@keyframes raios { 0% { opacity: 0; transform: scale(.6); } 100% { opacity: .95; transform: scale(1.15); } }
body.abrindo .dica { animation: some .3s ease both; }
body.abrindo .placa-grupo, body.abrindo .etiqueta { animation-play-state: paused; }
body.abrindo .flash { animation: flash .45s ease-in 1.4s both; }
@keyframes flash { from { opacity: 0; } to { opacity: 1; } }
body.abrindo .loja { animation: loja .42s ease-out 1.68s both; }
@keyframes loja { 0% { visibility: visible; opacity: 0; transform: scale(1.04); } 100% { visibility: visible; opacity: 1; transform: none; } }
body.aberta .entrada { visibility: hidden; }
.neve-tela { position: absolute; inset: 0; pointer-events: none; transform-origin: 50% 60%; will-change: transform, opacity;
  /* o borrifo rareia no alto (o céu fica limpo; ele aparece contra o casco e o cais) */
  -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,.1) 0, rgba(0,0,0,.35) 24%, #000 52%);
          mask-image: linear-gradient(180deg, rgba(0,0,0,.1) 0, rgba(0,0,0,.35) 24%, #000 52%); }
/* pré-aquecimento: as luzes da abertura já nascem em camada própria */
.raios, .poca, .luz-neve, .flash, .interior .acende, .fresta-meio { will-change: transform, opacity; }

/* menos movimento: as portas só esmaecem, sem câmera */
@media (prefers-reduced-motion: reduce) {
  .neve, .nevoa, .rajada, svg.nuvens, .gaivota, .gaivota .asas, svg.serpente, .gota, .onda, .tiro i, .relampago, .halo, .luz-fachada, .ch, .placa-grupo, .etiqueta, .lanterna-halo, .janelas-halo, .brilho-ouro, svg.bandeira, svg.cidade .reflexo, svg.cidade .reflexo2, svg.cidade .janelas-vivas, .dica { animation: none !important; }
  .brilho-ouro { display: none; }
  .gota, .onda, .tiro, .relampago { display: none; }
  .neve.n2 { display: none; }
  .dica { opacity: 1; }
  body.abrindo .dica { opacity: 0 !important; visibility: hidden; }
  body.abrindo .neve-tela, body.abrindo .raios, body.abrindo .flash, body.abrindo .poca, body.abrindo .luz-neve, body.abrindo .insignia-acorda, body.abrindo .faiscas-trinco i { animation: none !important; }
  body.abrindo .fresta-meio, body.abrindo .fresta-chao { animation: none !important; opacity: 0; }
  body.abrindo .tranca, body.abrindo .grampo-frente, body.abrindo svg.bainha { animation: esmaece .4s ease both !important; }
  body.abrindo .folha.esq, body.abrindo .folha.dir { animation: esmaece .55s ease both !important; }
  body.abrindo .loja { animation: loja-calma .45s ease .5s both !important; }
}
@keyframes esmaece { to { opacity: 0; } }
@keyframes loja-calma { 0% { visibility: visible; opacity: 0; } 100% { visibility: visible; opacity: 1; } }
</style>
</head>
<body>

<div id="entrada" class="entrada" role="dialog" aria-modal="true" aria-label="Entrada da loja — a popa do galeão no porto de Águas de Sentina">
  <div class="palco" id="palco">

    <!-- ===== LONGE: o céu de tempestade, o sol no mar, o guindaste com a serpente, a cidade de cascos ===== -->
    <div class="camada longe" id="longe" aria-hidden="true">
      <div class="ceu"></div>
      <div class="sol"></div>
      <svg class="nuvens" viewBox="-900 -700 3240 2000">
        <defs><filter id="borraoNuvem" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="5"/></filter></defs>
        <g id="nuvens-g" filter="url(#borraoNuvem)"></g>
      </svg>
      <div class="relampago"></div>
      <svg class="cidade" viewBox="-900 -700 3240 2000">
        <defs>
          <linearGradient id="gMar" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#3a4a52"/><stop offset=".04" stop-color="#1d4446"/><stop offset=".25" stop-color="#0f3236"/><stop offset=".6" stop-color="#082226"/><stop offset="1" stop-color="#05161a"/>
          </linearGradient>
          <linearGradient id="gMorro" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#3a1838"/><stop offset="1" stop-color="#1c0c1c"/>
          </linearGradient>
          <filter id="borraoL"><feGaussianBlur stdDeviation="6"/></filter>
          <filter id="borraoS"><feGaussianBlur stdDeviation="3"/></filter>
          <radialGradient id="gSangue" cx=".5" cy=".5" r=".5">
            <stop offset="0" stop-color="#8a0c18" stop-opacity=".95"/><stop offset=".6" stop-color="#6a0a14" stop-opacity=".7"/><stop offset="1" stop-color="#4a0a10" stop-opacity="0"/>
          </radialGradient>
          <filter id="brilhoJan" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>
        <!-- o mar verde-azulado escuro, com o reflexo do sol e do céu -->
        <rect x="-900" y="598" width="3240" height="702" fill="url(#gMar)"/>
        <g class="reflexo" id="reflexo-sol" fill="#ffc070"></g>
        <g class="reflexo2" id="reflexo-ceu" fill="#e0607a" opacity=".5"></g>
        <g id="ondas" fill="none" stroke="#5a8a86" stroke-width="1.2" opacity=".35"></g>
        <!-- navios fundeados ao longe, à esquerda, e o galeão de velas negras recortado contra o sol -->
        <g id="navios-longe" fill="#21101e"></g>
        <g id="galeao-negro"></g>
        <!-- o morro da cidade, à direita, e a cidade de cascos virados empilhada nele -->
        <path d="M980 640 C1120 560 1260 520 1400 440 C1600 330 1900 200 2400 120 L2400 1300 L980 1300Z" fill="url(#gMorro)"/>
        <g id="cidade-casas"></g>
        <g id="cidade-janelas" class="janelas-vivas" fill="#ffb052" filter="url(#brilhoJan)"></g>
        <g id="mastros-porto" stroke="#1a0b18" fill="none"></g>

<script>
(function () {

  var NS = "http://www.w3.org/2000/svg";
  // sorteio estável (a cena é sempre a mesma)

  function el(tag, at, pai) { var e = document.createElementNS(NS, tag); for (var k in at) e.setAttribute(k, at[k]); if (pai) pai.appendChild(e); return e; }
  function $(id) { return document.getElementById(id); }
  function f1(n) { return n.toFixed(1); }
  function oval(cx, cy, rx, ry) { return "M" + f1(cx - rx) + " " + f1(cy) + "a" + f1(rx) + " " + f1(ry) + " 0 1 0 " + f1(2 * rx) + " 0a" + f1(rx) + " " + f1(ry) + " 0 1 0 " + f1(-2 * rx) + " 0Z"; }
  function cravo(x, y, r) { return "M" + f1(x) + " " + f1(y - r) + "a" + r + " " + r + " 0 1 0 .1 0Z"; }

  /* ---------- o que na integração vem do app (CATALOG.meta.patch e ATUALIZACAO) ---------- */
  var ATUALIZACAO = "13.120", CATALOG = { meta: { patch: "16.22.1" } };
  document.querySelectorAll("[data-patch]").forEach(function (e) { e.textContent = CATALOG.meta.patch || ""; });
  document.querySelectorAll("[data-atualizacao]").forEach(function (e) { e.textContent = ATUALIZACAO; });

  /* ---------- o som: na integração é o módulo Som do app; a amostra é muda ---------- */
  var Som = window.Som || { destravar: function () {}, play: function () {}, parar: function () {} };

  /* ---------- o céu: faixas de nuvem de tempestade, acesas por baixo pelo sol ---------- */
  (function () {
    var g = $("nuvens-g"), dB = "", dE = "", dM = "";
    [[-60, 30, 0], [40, 34, 0], [150, 26, 1], [250, 24, 1], [350, 18, 1], [440, 12, 1]].forEach(function (f) {
      for (var x = -1000; x < 2500; x += 70 + rnd() * 150) {
        var rx = 110 + rnd() * 240, ry = f[1] * (.5 + rnd() * .9), cy = f[0] + (rnd() - .5) * 36;
        if (f[2]) dM += oval(x, cy, rx, ry); else dE += oval(x, cy, rx, ry);
        dB += oval(x + 10, cy + ry * .45, rx * .96, ry);
      }
    });
    el("path", { d: dB, fill: "#ff8a52", opacity: .42 }, g);
    el("path", { d: dE, fill: "#140a1e", opacity: .92 }, g);
    el("path", { d: dM, fill: "#4a1a44", opacity: .82 }, g);
  })();

  /* ---------- o mar: o rastro do sol, os reflexos magenta e as cristas ---------- */
  (function () {
    var dS = "", dC = "", dO = "";
    for (var y = 604; y < 760; y += 5 + (y - 600) * .06) {
      var w = 20 + (y - 600) * 1.1, n = 1 + Math.floor(rnd() * 3);
      for (var i = 0; i < n; i++) {
        var x = 190 + (rnd() - .5) * w * 1.4, l = 8 + rnd() * w * .5;
        dS += "M" + f1(x) + " " + f1(y) + "h" + f1(l) + "v" + f1(1.2 + (y - 600) * .012) + "h" + f1(-l) + "Z";
      }
    }
    for (var k = 0; k < 70; k++) {
      var cx = -900 + rnd() * 1900, cy = 604 + rnd() * 120, cl = 10 + rnd() * 40;
      dC += "M" + f1(cx) + " " + f1(cy) + "h" + f1(cl) + "v1.2h" + f1(-cl) + "Z";
    }
    for (var o = 0; o < 90; o++) {
      var ox = -900 + rnd() * 3240, oy = 610 + rnd() * 160, ol = 14 + rnd() * 40;
      dO += "M" + f1(ox) + " " + f1(oy) + "q" + f1(ol / 2) + " -3 " + f1(ol) + " 0";
    }
    el("path", { d: dS }, $("reflexo-sol"));
    el("path", { d: dC }, $("reflexo-ceu"));
    el("path", { d: dO }, $("ondas"));
    // navios fundeados ao longe (cascos e mastros com vergas)

  /* ---------- a câmera (requestAnimationFrame) ---------- */
  // Progressão geométrica sobre a escala, acelerando: p = t^1,8; o galeão vai de 0,86 a 7,6 e
  // sobe até centrar a escotilha; o primeiro plano (lampiões, estacas, canhão) vai a 30 e sai do quadro;
  // o céu só avança 1,3×.
  var DUR = 1950, S0 = .86;
  var longe = $("longe"), mundo = $("mundo"), perto = $("perto"), neveTela = $("neveTela");
  function quadro(ms) {
    var t = Math.min(1, Math.max(0, ms / DUR)), p = Math.pow(t, 1.8), q = Math.pow(t, 2.2);

  /* ---------- abrir e reiniciar ---------- */
  var estado = "fechada", timer = 0, laco = 0;

  var calmo = matchMedia("(prefers-reduced-motion: reduce)");
  function abrir() {
    if (estado !== "fechada") return;

    // na integração o som nasce aqui, no clique

    document.body.classList.add("abrindo");
    var reduz = calmo.matches;
    if (!reduz) {

  var DA_ABERTURA = /^(tranca|acorda|abre-esq|abre-dir|escurece|acende|some|luz-neve|poca|raios|flash|loja|esmaece|loja-calma|faisca-trinco)$/;
