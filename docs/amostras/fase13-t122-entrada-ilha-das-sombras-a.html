<title>Forja · Entrada da Ilha das Sombras (A)</title>
<!-- F13-T122, opção A: "O Relicário de Helia" — a entrada da Ilha das Sombras no molde de Águas de Sentina (T120).
     Mesmo esqueleto (palco 1440×900, três camadas da câmera, vão 600–840 × 404–790, folhas em CSS 3D, trava,
     interior com o lojista, clarão, painel da loja, placa com as classes da integração, window.abrir()); a arte
     toda própria, em SVG/CSS: a loja é a entrada de um relicário nobre de Helia — portal gótico de arquivoltas
     finas, rosácea, campanário aberto com o sino preso na viga, duas estátuas veladas de mármore branco-osso
     (enegrecidas, rachadas, acorrentadas em argolas do pedestal), a Névoa Negra como um corpo de fumaça com veios
     verde-azulados que sobe do adro e se enrola na fachada e nas estátuas (rostos nascem da borda dela, mãos só
     existem formadas dentro dela, olhos acendem lá dentro), espinheiros como coral morto, lanternas de alma,
     destroços nobres de Helia no chão (balaustrada tombada, urna partida, capitel caído); ao fundo a
     cidade-catedral de Helia contra o céu quase preto. A placa pende de um braço de ferro que sai do contraforte.
     O lojista é um espectro de mercador de capuz redondo, atrás do balcão com o livro-caixa, a balança e as moedas.
     Ajustes do juiz aplicados (placa longe da estátua, névoa com volume, sem lápide nem mãos no chão, capuz,
     rostos na névoa, remate abaixo do topo). Sem áudio. Só a textura de papel do projeto, por caminho relativo. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --papel: #e5d3ad;
  --tinta: #2c1d12;
  --tinta-suave: #5a4630;
  --alma: #2fe0b8;
  --alma-clara: #7dffd0;
  --osso: #e6e0d0;
  --breu: #040607;
  --nevoa: #1a0f24;
  --titulos: 'IM Fell English SC', 'IM Fell English', Georgia, serif;
  --texto: 'Alegreya', Georgia, serif;
  --gravado: 'Cinzel', Georgia, serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: #020304; overflow: hidden; color: var(--tinta); font-family: var(--texto); }

/* ============ A CENA ============ */
.entrada { position: fixed; inset: 0; overflow: hidden; cursor: pointer; background: #020405; }
.palco { position: absolute; left: 50%; top: 50%; width: 1440px; height: 900px; transform-origin: 50% 50%; }
/* três camadas de câmera (paralaxe): longe (céu, Névoa no céu, Helia), mundo (o relicário), perto (lanternas de alma,
   espinheiros, a cabeça caída, o marco com a corrente). A câmera anda por JS (requestAnimationFrame). */
.camada { position: absolute; inset: 0; transform-origin: 720px 597px; transform: scale(.86); will-change: transform; }
.camada > * { position: absolute; }
.longe { pointer-events: none; }
.perto { pointer-events: none; }

/* o céu: preto quase total, e a única luz forte é o verde-azulado que sobe de trás da cidade */
.ceu { left: -900px; top: -700px; width: 3240px; height: 2000px;
  background:
    radial-gradient(ellipse 620px 300px at 2040px 1300px, rgba(125,255,208,.42), transparent 70%),
    radial-gradient(ellipse 1300px 520px at 1980px 1260px, rgba(47,224,184,.30), transparent 72%),
    radial-gradient(ellipse 760px 300px at 820px 1300px, rgba(47,224,184,.20), transparent 72%),
    radial-gradient(ellipse 1500px 700px at 1500px 1000px, rgba(52,22,70,.40), transparent 72%),
    linear-gradient(180deg, #010203 0, #030507 520px, #050b0d 900px, #082022 1140px, #0d3a34 1260px, #12463e 1310px, #0a1e1c 1400px); }
svg.nuvens { left: -900px; top: -700px; width: 3240px; height: 2000px; overflow: visible; animation: nuvens 80s ease-in-out infinite alternate; }
@keyframes nuvens { from { transform: translateX(0); } to { transform: translateX(-160px); } }
svg.cidade { left: -900px; top: -700px; width: 3240px; height: 2000px; overflow: visible; }
svg.cidade .janelas-vivas { animation: respira 5.5s ease-in-out infinite; }
/* o pulso da luz por trás da catedral */
.pulso { left: 860px; top: 380px; width: 640px; height: 420px; pointer-events: none; mix-blend-mode: screen; border-radius: 50%;
  background: radial-gradient(ellipse at 50% 60%, rgba(125,255,208,.26), rgba(47,224,184,.08) 45%, transparent 72%);
  animation: respira 7s ease-in-out infinite; }

svg.fundo { left: -600px; top: -400px; width: 2640px; height: 1700px; overflow: visible; }
svg.frente { left: -600px; top: -400px; width: 2640px; height: 1700px; overflow: visible; }
svg.bruma { left: -600px; top: -400px; width: 2640px; height: 1700px; overflow: visible; pointer-events: none; }
/* o sino: preso na viga do campanário, oscila devagar em torno do ponto de suspensão */
.sino { transform-box: fill-box; transform-origin: 50% 0; animation: sino 6.5s ease-in-out infinite; }
@keyframes sino { 0%,100% { transform: rotate(-2.2deg); } 50% { transform: rotate(2.4deg); } }
/* a Névoa Negra: um corpo de fumaça escura (com borda acesa e veios de alma) que sobe do adro e respira devagar */
svg.bruma { transform-origin: 50% 70%; animation: nevoa-sobe 11s ease-in-out infinite; }
@keyframes nevoa-sobe { 0%,100% { transform: translateY(0) scaleY(1); } 50% { transform: translateY(-7px) scaleY(1.006); } }
/* os olhos acesos dentro da névoa: piscam, e alguns somem e voltam */
.olho { transform-box: fill-box; transform-origin: 50% 50%; animation: pisca-olho 6.4s ease-in-out infinite; }
@keyframes pisca-olho { 0%, 90%, 100% { transform: scaleY(1); } 93% { transform: scaleY(.08); } 96% { transform: scaleY(1); } }
.olho-some { animation: olho-some 9s ease-in-out infinite; }
@keyframes olho-some { 0%, 100% { opacity: 0; } 25%, 70% { opacity: 1; } }
/* os rostos nascem da borda da névoa, meio desfeitos, e voltam para ela (três no máximo) */
.rosto { opacity: 0; animation: rosto 11s ease-in-out infinite; }
.rosto.r2 { animation-delay: -4.2s; animation-duration: 12.5s; }
.rosto.r3 { animation-delay: -8s; animation-duration: 10s; }
@keyframes rosto { 0%, 100% { opacity: 0; transform: translateY(14px); } 30% { opacity: .95; transform: translateY(0); }
  58% { opacity: .8; transform: translateY(-3px); } 80% { opacity: 0; transform: translateY(10px); } }
/* as mãos só existem formadas dentro da névoa */
.forma { opacity: 0; animation: forma 10s ease-in-out infinite; }
@keyframes forma { 0% { opacity: 0; } 30% { opacity: .95; } 62% { opacity: .9; } 84%, 100% { opacity: 0; } }
/* as rachaduras que vazam a luz verde respiram */
.vaza { animation: respira 3.8s ease-in-out infinite; }

/* o brilho das lanternas das estátuas, da rosácea e das janelas */
.lanterna-halo { width: 200px; height: 200px; margin: -100px 0 0 -100px; border-radius: 50%; pointer-events: none; mix-blend-mode: screen;
  background: radial-gradient(circle, rgba(125,255,208,.55), rgba(47,224,184,.18) 38%, transparent 70%); animation: tremula 2.6s steps(8) infinite; }
.lanterna-halo.l1 { left: 720px; top: 214px; width: 260px; height: 260px; margin: -130px 0 0 -130px; animation: respira 4.4s ease-in-out infinite; }
.lanterna-halo.l2 { left: 230px; top: 380px; animation-duration: 2.1s; animation-delay: -.6s; }
.lanterna-halo.l3 { left: 1548px; top: 380px; animation-duration: 2.9s; animation-delay: -1.2s; }
.janelas-halo { left: 400px; top: 240px; width: 640px; height: 360px; pointer-events: none; mix-blend-mode: screen;
  background:
    radial-gradient(ellipse 70px 150px at 87px 180px, rgba(47,224,184,.34), transparent 75%),
    radial-gradient(ellipse 70px 150px at 553px 180px, rgba(47,224,184,.34), transparent 75%),
    radial-gradient(ellipse 120px 50px at 320px 64px, rgba(125,255,208,.22), transparent 75%);
  animation: respira 4.8s ease-in-out infinite; }
@keyframes respira { 0%,100% { opacity: .72; } 45% { opacity: 1; } 70% { opacity: .84; } }
@keyframes tremula { 0% { opacity: .82; } 13% { opacity: .95; } 27% { opacity: .78; } 41% { opacity: 1; } 55% { opacity: .86; } 70% { opacity: .97; } 84% { opacity: .8; } 100% { opacity: .9; } }

/* ============ A PORTA ============ */
/* o vão: 240×386, de x 600 a 840, y 404 a 790 (as portas do relicário) */
.vao { left: 600px; top: 404px; width: 240px; height: 386px; perspective: 820px; perspective-origin: 50% 46%; }
.interior { position: absolute; inset: 0; overflow: hidden; background: #03100e; }
.interior svg { display: block; width: 100%; height: 100%; }
.interior .acende { position: absolute; inset: 0; opacity: 0;
  background: radial-gradient(ellipse 70% 55% at 50% 30%, rgba(232,255,246,.5), rgba(125,255,208,.3) 45%, rgba(47,224,184,0) 80%); mix-blend-mode: screen; }
.folha { position: absolute; top: 0; width: 120px; height: 386px; transform-style: preserve-3d; backface-visibility: hidden; will-change: transform; }
.folha.esq { left: 0; transform-origin: 0 50%; }
.folha.dir { right: 0; transform-origin: 100% 50%; }
/* as folhas: bronze escurecido de relicário, com almofadas góticas e o verdete que subiu do chão */
.chapas { position: absolute; inset: 0;
  background:
    linear-gradient(180deg, rgba(0,0,0,.45), transparent 16%, transparent 70%, rgba(47,224,184,.06) 88%, rgba(47,224,184,.16)),
    radial-gradient(ellipse 40% 12% at 30% 96%, rgba(80,150,130,.22), transparent 70%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.018) 0 1px, transparent 1px 7px),
    linear-gradient(90deg, #0d1112, #1e2526 34%, #1a2021 68%, #0a0d0e); }
.folha.esq .chapas { box-shadow: inset 0 0 0 4px #030405, inset 0 0 0 6px #5c6a66, inset -3px 0 0 6px #020303; }
.folha.dir .chapas { box-shadow: inset 0 0 0 4px #030405, inset 0 0 0 6px #5c6a66, inset 3px 0 0 6px #020303; }
.lavor { position: absolute; inset: 0; width: 120px; height: 386px; overflow: visible; pointer-events: none; }
/* as cintas de ferro negro com a ponta em espinho */
.cinta { position: absolute; height: 16px; width: 106px;
  background:
    radial-gradient(circle at 50% 50%, #9fb4ad 0 1.6px, #1c2322 2.4px, transparent 3px) 10px 0 / 22px 100% repeat-x,
    linear-gradient(180deg, #3a4442 0, #1c2221 40%, #0a0d0d 100%);
  box-shadow: 0 3px 3px rgba(0,0,0,.6), inset 0 1px 0 rgba(125,255,208,.22); }
.folha.esq .cinta { left: -6px; clip-path: polygon(0 0, 80% 0, 86% 18%, 100% 50%, 86% 82%, 80% 100%, 0 100%); }
.folha.dir .cinta { right: -6px; clip-path: polygon(20% 0, 100% 0, 100% 100%, 20% 100%, 14% 82%, 0 50%, 14% 18%); }
.cinta.c1 { top: 22px; } .cinta.c2 { top: 256px; } .cinta.c3 { top: 344px; }
.suporte { position: absolute; top: 188px; width: 22px; height: 50px; border-radius: 3px;
  background: radial-gradient(circle at 50% 6px, #9fb4ad 0 1.7px, transparent 2.5px), radial-gradient(circle at 50% 44px, #9fb4ad 0 1.7px, transparent 2.5px), linear-gradient(90deg, #0b0e0e, #3a4442 50%, #0b0e0e);
  box-shadow: 0 2px 3px rgba(0,0,0,.6); }
.folha.esq .suporte { left: 40px; } .folha.dir .suporte { right: 44px; }
/* as argolas (aldravas) de ferro negro presas num espelho com espinhos */
.argola { position: absolute; top: 268px; width: 34px; height: 36px; }
.folha.esq .argola { right: 14px; } .folha.dir .argola { left: 14px; }
.argola::before { content: ""; position: absolute; left: 8px; top: -7px; width: 18px; height: 18px; border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #bfe8dc, #2c3634 70%); box-shadow: 0 1px 2px rgba(0,0,0,.8), 0 0 0 3px #080a0a; }
.argola::after { content: ""; position: absolute; left: 1px; top: 4px; width: 32px; height: 32px; border-radius: 50%;
  border: 4px solid #2c3634; border-top-color: #9fd8c6; box-shadow: 0 3px 3px rgba(0,0,0,.6), 0 0 6px rgba(47,224,184,.25); }
/* meio emblema do relicário em cada folha: fechada, a porta mostra a vesica inteira */
.meia { position: absolute; top: 50px; width: 66px; height: 136px; overflow: hidden; filter: drop-shadow(0 3px 2px rgba(0,0,0,.7)); }
.folha.esq .meia { right: 0; } .folha.dir .meia { left: 0; }
.folha .sombra { position: absolute; inset: 0; background: #010202; opacity: 0; }
.folha .borda { position: absolute; top: 0; height: 100%; width: 18px; background: linear-gradient(90deg, #060808, #2a3233, #050707); }
.folha.esq .borda { right: 0; transform-origin: 100% 50%; transform: rotateY(-90deg); }
.folha.dir .borda { left: 0; transform-origin: 0 50%; transform: rotateY(90deg); }
/* a luz verde pela fresta do meio (apagada onde o emblema atravessa, y 454–590) e debaixo da porta */
.fresta-meio { left: 718px; top: 404px; width: 4px; height: 386px; pointer-events: none;
  background: linear-gradient(180deg, rgba(47,224,184,0), rgba(125,255,208,.7) 10%, rgba(190,255,232,.85) 64%, rgba(47,224,184,.6));
  -webkit-mask-image: linear-gradient(180deg, #000 0, #000 12%, rgba(0,0,0,.1) 15%, rgba(0,0,0,.1) 48%, #000 52%, #000 100%);
          mask-image: linear-gradient(180deg, #000 0, #000 12%, rgba(0,0,0,.1) 15%, rgba(0,0,0,.1) 48%, #000 52%, #000 100%);
  filter: blur(1.5px); mix-blend-mode: screen; }
.fresta-chao { left: 596px; top: 783px; width: 248px; height: 14px; pointer-events: none; border-radius: 50%;
  background: radial-gradient(ellipse at 50% 50%, rgba(190,255,232,.95), rgba(47,224,184,.5) 45%, transparent 75%);
  filter: blur(2px); mix-blend-mode: screen; }
/* a trava: uma barra de ferro negro que corre pelos grampos e entra na bainha de pedra à esquerda */
.tranca { left: 632px; top: 598px; width: 160px; height: 30px; border-radius: 3px;
  background:
    linear-gradient(90deg, transparent 0 18px, #050707 18px 30px, transparent 30px calc(100% - 44px), #050707 calc(100% - 44px) calc(100% - 32px), transparent calc(100% - 32px)),
    radial-gradient(circle at 50% 50%, #a9c4bb 0 1.8px, #141a19 2.8px, transparent 3.4px) 21px 0 / 120px 100% repeat-x,
    linear-gradient(180deg, #4a5755, #2a3332 40%, #161c1b 75%, #0a0d0d);
  box-shadow: 0 7px 9px rgba(0,0,0,.7), inset 0 1px 0 rgba(125,255,208,.35), inset 0 -2px 0 rgba(0,0,0,.5); }
.tranca::after { content: ""; position: absolute; left: 56px; top: -24px; width: 16px; height: 28px; border-radius: 8px 8px 3px 3px;
  background: radial-gradient(circle at 40% 30%, #bfe8dc 0 2px, transparent 4px), linear-gradient(90deg, #0e1212, #4a5755 45%, #141a19);
  box-shadow: 0 2px 2px rgba(0,0,0,.6); }
.tranca::before { content: ""; position: absolute; right: -10px; top: -5px; width: 16px; height: 40px; border-radius: 3px;
  background: linear-gradient(90deg, #0b0e0e, #45524f 50%, #0b0e0e); box-shadow: 0 3px 3px rgba(0,0,0,.6); }
svg.bainha { left: 432px; top: 568px; width: 186px; height: 84px; overflow: visible; pointer-events: none; }
.grampo-frente { width: 22px; height: 50px; top: 590px; border-radius: 3px; pointer-events: none;
  background: radial-gradient(circle at 50% 6px, #9fb4ad 0 1.7px, transparent 2.5px), radial-gradient(circle at 50% 44px, #9fb4ad 0 1.7px, transparent 2.5px), linear-gradient(90deg, #0b0e0e, #3a4442 50%, #0b0e0e);
  box-shadow: 0 2px 3px rgba(0,0,0,.6); }
.grampo-frente.g1 { left: 646px; } .grampo-frente.g2 { left: 760px; }
/* as faíscas frias do ferro raspando no grampo */
.faiscas-trinco { left: 648px; top: 612px; width: 0; height: 0; pointer-events: none; }
.faiscas-trinco i { position: absolute; left: 0; top: 0; width: 3px; height: 3px; border-radius: 50%; background: #e8fff6;
  box-shadow: 0 0 5px 2px rgba(47,224,184,.9); opacity: 0; }

/* a luz que sai pela porta e deita nas lajes do adro */
.luz-neve { left: 420px; top: 760px; width: 600px; height: 200px; pointer-events: none; opacity: .32; border-radius: 50%;
  background: radial-gradient(ellipse 50% 50% at 50% 30%, rgba(125,255,208,.7), rgba(47,224,184,.24) 50%, transparent 78%);
  mix-blend-mode: screen; }
.poca { left: 360px; top: 806px; width: 720px; height: 360px; pointer-events: none; opacity: .45; transform-origin: 50% 0;
  clip-path: polygon(33% 0, 67% 0, 100% 100%, 0 100%);
  background: radial-gradient(ellipse 60% 85% at 50% 0, rgba(190,255,232,.9), rgba(47,224,184,.4) 45%, transparent 82%);
  mix-blend-mode: screen; transform: scaleY(.3); }
.raios { left: 270px; top: 200px; width: 900px; height: 800px; pointer-events: none; opacity: 0;
  background:
    radial-gradient(ellipse 30% 40% at 50% 50%, rgba(200,255,236,.45), rgba(47,224,184,.18) 55%, transparent 80%),
    repeating-conic-gradient(from 0deg at 50% 50%, rgba(125,255,208,.18) 0 4deg, transparent 4deg 11deg);
  -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 0, rgba(0,0,0,.6) 35%, transparent 70%);
          mask-image: radial-gradient(circle at 50% 50%, #000 0, rgba(0,0,0,.6) 35%, transparent 70%);
  mix-blend-mode: screen; }
/* a Névoa que se arrasta no adro e entra pela porta quando ela abre */
.nevoa-porta { left: 430px; top: 716px; width: 580px; height: 150px; pointer-events: none; transform-origin: 50% 30%; }
.nevoa-porta svg { width: 100%; height: 100%; overflow: visible; }

/* ============ AS LANTERNAS DE ALMA (camada de perto) ============ */
.lampiao { width: 140px; height: 330px; top: 575px; transform: scale(1.12); transform-origin: 50% 100%; }
.lampiao.b1 { left: 395px; } .lampiao.b2 { left: 905px; }
.lampiao svg { position: absolute; inset: 0; width: 140px; height: 330px; overflow: visible; }
.halo { position: absolute; left: 70px; top: 90px; width: 480px; height: 480px; margin: -240px 0 0 -240px; border-radius: 50%;
  background: radial-gradient(circle, rgba(125,255,208,.34), rgba(47,224,184,.12) 30%, rgba(47,224,184,.04) 52%, transparent 66%);
  animation: tremula 2.3s steps(9) infinite; }
.b2 .halo { animation-duration: 1.9s; animation-delay: -.7s; }
.chamas { position: absolute; left: 70px; top: 104px; width: 0; height: 0; }
.ch { position: absolute; bottom: -2px; transform-origin: 50% 100%; mix-blend-mode: screen; filter: blur(1px);
  animation: chama .8s ease-in-out infinite alternate; }
.ch::before { content: ""; position: absolute; left: 0; bottom: 0; width: 100%; aspect-ratio: 1; border-radius: 0 50% 50% 50%; transform: rotate(45deg); transform-origin: 50% 50%;
  background: radial-gradient(circle at 62% 62%, #f0fffa 0, #7dffd0 26%, #2fe0b8 55%, rgba(20,140,110,0) 84%); }
.ch.f1 { left: -10px; width: 20px; height: 20px; animation-duration: .9s; }
.ch.f2 { left: -5px; width: 10px; height: 10px; animation-duration: .62s; animation-delay: -.3s; }
.ch.f2::before { background: radial-gradient(circle at 62% 62%, #ffffff 0, #d8fff0 35%, #7dffd0 60%, rgba(47,224,184,0) 82%); }
@keyframes chama { 0% { transform: scale(1, 1.7) skewX(-5deg); } 35% { transform: scale(.88, 2.1) skewX(-10deg); } 70% { transform: scale(1.06, 1.6) skewX(-3deg); } 100% { transform: scale(.95, 1.95) skewX(-8deg); } }
/* a luz fria das lanternas e da rosácea sobre a fachada */
.luz-fachada { left: 0; top: 0; width: 1440px; height: 900px; pointer-events: none; mix-blend-mode: soft-light; opacity: .6;
  background:
    radial-gradient(ellipse 360px 320px at 465px 660px, rgba(47,224,184,.9), transparent 70%),
    radial-gradient(ellipse 360px 320px at 975px 660px, rgba(47,224,184,.9), transparent 70%),
    radial-gradient(ellipse 420px 220px at 720px 230px, rgba(125,255,208,.5), transparent 70%);
  animation: tremula 2.7s steps(7) infinite; }

/* ============ A PLACA: lápide de mármore negro pendurada por correntes no braço de ferro do contraforte ============ */
.placa-grupo { left: 1024px; top: 398px; width: 360px; transform-origin: 50% 0; animation: balanca 6.2s ease-in-out infinite; cursor: default; }
@keyframes balanca { 0%,100% { transform: rotate(-.9deg); } 50% { transform: rotate(1deg); } }
/* a corrente: elos de ferro (de frente e de lado, alternados) */
.corrente { position: absolute; top: -6px; width: 10px; height: 40px;
  background:
    linear-gradient(90deg, transparent 3.6px, #0a0d0d 3.6px 4px, #6f827d 4px 6px, #0a0d0d 6px 6.4px, transparent 6.4px) 0 7px / 10px 13px repeat-y,
    radial-gradient(ellipse 4.6px 6px at 50% 50%, transparent 0 2.2px, #050606 2.4px 2.9px, #8fa8a0 3px 3.9px, #050606 4px 4.5px, transparent 4.7px) 0 0 / 10px 13px repeat-y;
  filter: drop-shadow(1px 2px 1px rgba(0,0,0,.6)); }
.corrente.e { left: 35px; } .corrente.d { right: 35px; }
.entrada-placa { position: relative; margin-top: 32px; padding: 16px 20px 18px; border-radius: 4px; text-align: center;
  border: 2px solid #020303;
  background:
    radial-gradient(circle at 14px 14px, #c9fbe9 0 2px, #1c2a28 3.2px, transparent 4.4px),
    radial-gradient(circle at calc(100% - 14px) 14px, #c9fbe9 0 2px, #1c2a28 3.2px, transparent 4.4px),
    radial-gradient(circle at 14px calc(100% - 14px), #c9fbe9 0 2px, #1c2a28 3.2px, transparent 4.4px),

/* a etiqueta da versão: uma lasca de ardósia pendurada por duas correntinhas sob a lápide */
.etiqueta { position: relative; width: 360px; margin: 18px auto 0; padding: 7px 8px 8px; border-radius: 3px; text-align: center;
  border: 2px solid #020303; transform-origin: 50% -18px; animation: balanca2 4.6s ease-in-out infinite;

/* ============ SOBRE A CENA (tela, não mundo) ============ */
/* as almas: fagulhas verdes que sobem devagar */
.neve { position: absolute; left: -60%; top: -60%; width: 220%; height: 220%; pointer-events: none; will-change: transform; }
.neve.n1 { animation: sobe 16s linear infinite; opacity: .75; }
.neve.n2 { animation: sobe 10s linear infinite; opacity: .55; filter: blur(.9px); }
@keyframes sobe { from { transform: rotate(-9deg) translateY(0); } to { transform: rotate(-9deg) translateY(calc(var(--t) * -1)); } }
.nevoa { position: absolute; left: -20%; right: -20%; bottom: -4%; height: 42%; pointer-events: none;
  background:
    radial-gradient(ellipse 30% 40% at 20% 72%, rgba(40,20,60,.42), transparent 70%),
    radial-gradient(ellipse 34% 36% at 72% 80%, rgba(30,14,44,.45), transparent 70%),
    radial-gradient(ellipse 40% 26% at 50% 92%, rgba(47,224,184,.08), transparent 70%),
    linear-gradient(180deg, transparent, rgba(10,6,16,.35) 60%, rgba(4,3,8,.6));
  animation: nevoa 16s ease-in-out infinite alternate; }
@keyframes nevoa { from { transform: translateX(-4%); } to { transform: translateX(4%); } }
/* rolos da Névoa Negra que atravessam o adro */
.rajada { position: absolute; left: -60%; width: 90%; height: 240px; pointer-events: none; border-radius: 50%;
  background: radial-gradient(ellipse at 50% 50%, rgba(16,8,26,.55), rgba(47,224,184,.05) 55%, transparent 72%); filter: blur(14px);
  animation: rajada 19s linear infinite; }
.rajada.r2 { top: 66%; animation-duration: 24s; animation-delay: -10s; height: 300px; }
.rajada.r1 { top: 28%; }
@keyframes rajada { 0% { transform: translate(0, 0) rotate(-2deg); opacity: 0; } 20% { opacity: 1; } 80% { opacity: .8; } 100% { transform: translate(190%, -4vh) rotate(-2deg); opacity: 0; } }
.vinheta { position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse 80% 76% at 50% 54%, transparent 50%, rgba(1,2,3,.72) 100%); }
.grao { position: absolute; inset: 0; pointer-events: none; opacity: .26; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .6 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); }
.flash { position: absolute; inset: 0; pointer-events: none; opacity: 0;
  background: radial-gradient(ellipse 70% 70% at 50% 55%, #f2fffb, #a8f7df 45%, #1f8f78 100%); }
.dica { position: absolute; left: 0; right: 0; bottom: 16px; margin: 0; text-align: center; pointer-events: none;

@keyframes dica-chega { from { opacity: 0; } to { opacity: 1; } }
@keyframes dica-pulsa { 0%,100% { opacity: 1; } 50% { opacity: .62; } }
.btn-entrar { position: absolute; left: 50%; bottom: 50px; transform: translateX(-50%); padding: 8px 22px; cursor: pointer;

/* a loja (placeholder: na integração é o app) */
.loja { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  visibility: hidden; opacity: 0;

/* ============ A ABERTURA ============ */
body.abrindo .entrada { cursor: default; }
body.abrindo .tranca { animation: tranca .42s cubic-bezier(.5,0,.3,1) both; }
@keyframes tranca {
  0%   { transform: translateX(0); }
  14%  { transform: translateX(7px) translateY(-1px); }
  24%  { transform: translateX(4px); }
  82%  { transform: translateX(-192px); }
  91%  { transform: translateX(-181px); }
  100% { transform: translateX(-186px); }
}
body.abrindo .grampo-frente { animation: some .12s linear .26s both; }
body.abrindo .faiscas-trinco i { animation: faisca-trinco .5s cubic-bezier(.2,.7,.4,1) both; }
@keyframes faisca-trinco { 0% { opacity: 0; transform: translate(0, 0); } 8% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--fx), var(--fy)); } }

body.abrindo .insignia-acorda { animation: acorda .5s ease-out both; }
@keyframes acorda { 0% { opacity: 0; } 35% { opacity: 1; } 60% { opacity: 1; } 100% { opacity: 0; } }

body.abrindo .sino { animation: badala 1.6s cubic-bezier(.3,.6,.4,1) both; }
@keyframes badala { 0% { transform: rotate(-2deg); } 22% { transform: rotate(11deg); } 46% { transform: rotate(-8deg); } 68% { transform: rotate(5deg); } 86% { transform: rotate(-2deg); } 100% { transform: rotate(1deg); } }

@keyframes abre-esq { 0% { transform: rotateY(0); } 7% { transform: rotateY(-1.2deg); } 100% { transform: rotateY(82deg); } }

body.abrindo .folha .sombra { animation: escurece 1.25s ease-in .26s both; }
@keyframes escurece { to { opacity: .66; } }
body.abrindo .interior .acende { animation: acende 1.1s ease-out .3s both; }
@keyframes acende { to { opacity: 1; } }
body.abrindo .fresta-meio { animation: some .3s ease .32s both; }

body.abrindo .luz-neve { animation: luz-neve .6s ease-out .02s both; }
@keyframes luz-neve { to { opacity: 1; transform: scale(1.25, 1.1); } }
body.abrindo .poca { animation: poca 1.1s cubic-bezier(.3,.6,.3,1) .05s both; }
@keyframes poca { to { opacity: 1; transform: scaleY(1); } }
body.abrindo .raios { animation: raios 1.4s ease-out .4s both; }
@keyframes raios { 0% { opacity: 0; transform: scale(.6); } 100% { opacity: .95; transform: scale(1.15); } }
/* a Névoa é puxada para dentro da porta */
body.abrindo .nevoa-porta { animation: nevoa-entra 1.2s cubic-bezier(.5,0,.6,1) .3s both; }
@keyframes nevoa-entra { 0% { transform: none; opacity: 1; } 60% { opacity: .9; } 100% { transform: translateY(-120px) scale(.22, .5); opacity: 0; } }
body.abrindo .dica { animation: some .3s ease both; }
body.abrindo .placa-grupo, body.abrindo .etiqueta { animation-play-state: paused; }
body.abrindo .flash { animation: flash .45s ease-in 1.4s both; }
@keyframes flash { from { opacity: 0; } to { opacity: 1; } }
body.abrindo .loja { animation: loja .42s ease-out 1.68s both; }
@keyframes loja { 0% { visibility: visible; opacity: 0; transform: scale(1.04); } 100% { visibility: visible; opacity: 1; transform: none; } }
body.aberta .entrada { visibility: hidden; }
.neve-tela { position: absolute; inset: 0; pointer-events: none; transform-origin: 50% 60%; will-change: transform, opacity; }
.raios, .poca, .luz-neve, .flash, .interior .acende, .fresta-meio, .nevoa-porta { will-change: transform, opacity; }

/* menos movimento: nada se mexe sozinho; as portas só esmaecem, sem câmera */
@media (prefers-reduced-motion: reduce) {
  .neve, .nevoa, .rajada, svg.nuvens, .pulso, .sino, svg.bruma, .olho, .vaza, .halo, .luz-fachada, .ch, .placa-grupo, .etiqueta, .lanterna-halo, .janelas-halo, svg.cidade .janelas-vivas, .dica { animation: none !important; }

  .neve.n2 { display: none; }
  .dica { opacity: 1; }
  body.abrindo .dica { opacity: 0 !important; visibility: hidden; }
  body.abrindo .neve-tela, body.abrindo .raios, body.abrindo .flash, body.abrindo .poca, body.abrindo .luz-neve, body.abrindo .insignia-acorda, body.abrindo .faiscas-trinco i, body.abrindo .sino, body.abrindo .nevoa-porta { animation: none !important; }
  body.abrindo .fresta-meio, body.abrindo .fresta-chao { animation: none !important; opacity: 0; }
  body.abrindo .tranca, body.abrindo .grampo-frente, body.abrindo svg.bainha { animation: esmaece .4s ease both !important; }
  body.abrindo .folha.esq, body.abrindo .folha.dir { animation: esmaece .55s ease both !important; }
  body.abrindo .loja { animation: loja-calma .45s ease .5s both !important; }
}
@keyframes esmaece { to { opacity: 0; } }
@keyframes loja-calma { 0% { visibility: visible; opacity: 0; } 100% { visibility: visible; opacity: 1; } }

  /* ---------- a câmera (requestAnimationFrame) ---------- */
  // p = t^1,8; o relicário vai de 0,86 a 7,6 e sobe até centrar as portas; o primeiro plano vai a 30 e sai do quadro;
  // o céu e Helia só avançam 1,3×.
  var DUR = 1950, S0 = .86;
  var longe = $("longe"), mundo = $("mundo"), perto = $("perto"), neveTela = $("neveTela");
  function quadro(ms) {

    var reduz = calmo.matches;
    if (!reduz) {
      var t0 = performance.now();
      var passo = function (agora) {
        if (estado !== "abrindo" || window.__congelado) return;
        quadro(agora - t0);

      };
      laco = requestAnimationFrame(passo);
