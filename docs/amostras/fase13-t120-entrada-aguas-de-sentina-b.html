<title>Forja · Entrada de Águas de Sentina (B)</title>
<!-- F13-T120, opção B: "A loja nas Docas do Abate" — a entrada de Águas de Sentina refeita depois da recusa da T116
     (docs/direcao_regioes.md: "porto pirata"). Mesmo esqueleto de Noxus (T99): palco 1440×900, camadas da câmera
     (longe/mundo/perto, câmera por requestAnimationFrame), vão 600–840 × 404–790, folhas em CSS 3D, trava, interior
     com a lojista, clarão, painel da loja, placa com as classes da integração; a arte toda própria, em SVG/CSS:
     a casa de contrabandista feita de madeira de navio (o telhado é um casco emborcado, a popa de um galeão por cima
     da porta), o guindaste do abate com a carcaça da serpente do mar, a água de sangue junto às estacas, cartazes de
     procurado, rum, canhão, bandeiras negras com caveira própria, a baía com navios e a cidade na encosta, o céu de
     tempestade ao pôr do sol. Só a textura de papel do projeto, por caminho relativo. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --papel: #e5d3ad;
  --tinta: #2c1d12;
  --tinta-suave: #5a4630;
  --latao: #c99a48;
  --cera: #8d2c22;
  --carmim: #8e1f1a;
  --lampiao: #ffb35a;
  --lampiao-claro: #ffd99a;
  --mar: #0f2b30;
  --titulos: 'IM Fell English SC', 'IM Fell English', Georgia, serif;
  --texto: 'Alegreya', Georgia, serif;
  --gravado: 'Cinzel', Georgia, serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: #07080c; overflow: hidden; color: var(--tinta); font-family: var(--texto); }

/* ============ A CENA ============ */
.entrada { position: fixed; inset: 0; overflow: hidden; cursor: pointer; background: #0b0a12; }
/* o palco: 1440×900 de desenho, encaixado inteiro na tela (o resto da arte sangra para fora) */
.palco { position: absolute; left: 50%; top: 50%; width: 1440px; height: 900px; transform-origin: 50% 50%; }
/* três camadas de câmera (paralaxe): longe (céu, baía, cidade, navios), mundo (a loja, o guindaste),
   perto (estacas com lampião, canhão, barris). A câmera anda por JS (requestAnimationFrame). */
.camada { position: absolute; inset: 0; transform-origin: 720px 597px; transform: scale(.86); will-change: transform; }
.camada > * { position: absolute; }
.longe { pointer-events: none; }
.perto { pointer-events: none; }

/* o céu de tempestade ao pôr do sol (camada de longe) */
.ceu { left: -900px; top: -700px; width: 3240px; height: 2000px;
  background:
    radial-gradient(ellipse 1100px 420px at 860px 1230px, rgba(255,150,70,.55), transparent 70%),
    radial-gradient(ellipse 900px 300px at 2400px 1260px, rgba(200,70,110,.30), transparent 72%),
    linear-gradient(180deg, #0a0812 0, #120c1c 420px, #1e1128 640px, #34152f 820px, #5c1d3e 980px, #9a3346 1110px, #d65f3a 1220px, #f39a52 1285px, #ffc678 1300px); }
/* o sol baixo, à esquerda, entre as faixas de nuvem (a carcaça se recorta contra ele) */
.sol { left: -150px; top: 420px; width: 220px; height: 220px; border-radius: 50%;
  background: radial-gradient(circle, #fff6dc 0, #ffe0a0 14%, #ffb860 24%, #ff8a3c 31%, rgba(240,90,50,.5) 35%, rgba(200,60,60,0) 44%); }
.sol::before { content: ""; position: absolute; left: -110%; top: -90%; width: 320%; height: 280%; border-radius: 50%; mix-blend-mode: screen; pointer-events: none;
  background: radial-gradient(circle, rgba(255,170,90,.42) 0, rgba(240,110,70,.20) 18%, rgba(190,60,90,.08) 34%, rgba(160,40,80,0) 50%); }
.brilho-horizonte { left: -900px; top: 500px; width: 3240px; height: 200px; mix-blend-mode: screen; pointer-events: none;
  background:
    radial-gradient(ellipse 700px 60px at 860px 100px, rgba(255,180,100,.42), transparent 70%),
    radial-gradient(ellipse 900px 40px at 1700px 100px, rgba(255,120,110,.20), transparent 70%);
  animation: respira 8s ease-in-out infinite; }
svg.cidade { left: -900px; top: -700px; width: 3240px; height: 2000px; overflow: visible; }
/* o brilho do sol na água, cintilando */
.cintila { animation: cintila 2.6s steps(6) infinite; }
.cintila.c2 { animation-duration: 3.3s; animation-delay: -1.2s; }
@keyframes cintila { 0%,100% { opacity: .55; } 33% { opacity: 1; } 66% { opacity: .7; } }
/* o relâmpago dentro das nuvens (raro, curto, abafado) */
.relampago { left: -900px; top: -700px; width: 3240px; height: 1300px; pointer-events: none; opacity: 0; mix-blend-mode: screen;
  background: radial-gradient(ellipse 700px 380px at 1700px 650px, rgba(220,200,255,.55), rgba(160,120,220,.18) 45%, transparent 75%);
  animation: relampago 13s linear infinite; }
@keyframes relampago { 0%, 61% { opacity: 0; } 61.6% { opacity: .9; } 62.3% { opacity: .1; } 63% { opacity: .6; } 64.5%, 100% { opacity: 0; } }
/* o tiro de canhão do navio ao longe: clarão e fumaça */
.tiro { left: -2px; top: 582px; width: 0; height: 0; }
.tiro i { position: absolute; border-radius: 50%; }
.tiro .clarao { left: -18px; top: -14px; width: 36px; height: 28px; mix-blend-mode: screen;
  background: radial-gradient(circle, #fff4d0 0, #ffb050 35%, rgba(255,120,40,0) 70%); opacity: 0; animation: tiro-clarao 11s linear infinite; }
.tiro .fumo { left: -26px; top: -24px; width: 52px; height: 44px; filter: blur(5px);
  background: radial-gradient(circle, rgba(210,190,190,.75), rgba(160,140,150,.3) 55%, transparent 75%); opacity: 0; animation: tiro-fumo 11s ease-out infinite; }
@keyframes tiro-clarao { 0%, 30% { opacity: 0; } 30.4% { opacity: 1; } 31.5%, 100% { opacity: 0; } }
@keyframes tiro-fumo { 0%, 30% { opacity: 0; transform: translate(0,0) scale(.3); } 31% { opacity: .9; } 60% { opacity: .35; } 80%, 100% { opacity: 0; transform: translate(40px, -26px) scale(2.6); } }
/* as gaivotas: atravessam o céu batendo as asas */
.gaivota { width: 34px; height: 16px; overflow: visible; animation: voa 46s linear infinite; }
.gaivota .asas { transform-origin: 17px 8px; animation: bate .55s ease-in-out infinite alternate; }
@keyframes bate { from { transform: scaleY(1); } to { transform: scaleY(-.35); } }
@keyframes voa { 0% { transform: translate(0, 0); } 50% { transform: translate(900px, -40px); } 100% { transform: translate(1800px, 10px); } }
.gaivota.v2 { animation-duration: 58s; animation-delay: -21s; }
.gaivota.v2 .asas { animation-duration: .7s; }
.gaivota.v3 { animation-duration: 40s; animation-delay: -33s; }
.gaivota.v3 .asas { animation-duration: .48s; }

svg.fundo { left: -600px; top: -400px; width: 2640px; height: 1700px; overflow: visible; }
svg.frente { left: -600px; top: -400px; width: 2640px; height: 1700px; overflow: visible; }
/* a carcaça da serpente do mar no gancho do guindaste: balança devagar em torno da roldana */
svg.serpente { left: -120px; top: 20px; width: 400px; height: 860px; overflow: visible; pointer-events: none;
  transform-origin: 186px 26px; animation: carcaca 9s ease-in-out infinite; }
@keyframes carcaca { 0%,100% { transform: rotate(-.9deg); } 50% { transform: rotate(.8deg); } }
.gota { animation: pinga 2.4s cubic-bezier(.5,0,1,1) infinite; }
.gota.g2 { animation-delay: -1.1s; animation-duration: 3.1s; }
@keyframes pinga { 0%, 20% { transform: translateY(0); opacity: 0; } 24% { opacity: 1; } 92% { opacity: 1; } 100% { transform: translateY(32px); opacity: 0; } }
.onda { transform-box: fill-box; transform-origin: 50% 50%; animation: onda 2.4s ease-out infinite; }
.onda.o2 { animation-delay: -1.1s; animation-duration: 3.1s; }
@keyframes onda { 0%, 88% { transform: scale(.2); opacity: 0; } 92% { opacity: .9; } 100% { transform: scale(1.6); opacity: 0; } }
/* a bandeira negra no mastro do telhado */
svg.bandeira { left: 706px; top: -74px; width: 180px; height: 120px; overflow: visible; pointer-events: none;
  transform-origin: 0 50%; animation: bandeira 5.2s ease-in-out infinite; }
@keyframes bandeira { 0%,100% { transform: skewY(0deg) scaleX(1); } 30% { transform: skewY(2.4deg) scaleX(.95); } 62% { transform: skewY(-1.6deg) scaleX(1.01); } }
svg.braco { left: 1060px; top: 290px; width: 440px; height: 220px; overflow: visible; pointer-events: none; }
/* a luz das janelas de popa e da vigia */
.popa-brilho { left: 560px; top: 230px; width: 320px; height: 190px; pointer-events: none; mix-blend-mode: screen;
  background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(255,170,80,.36), rgba(255,120,40,.10) 60%, transparent 80%); animation: respira 4.4s ease-in-out infinite; }
.vigia-brilho { width: 90px; height: 90px; border-radius: 50%; pointer-events: none; mix-blend-mode: screen;
  background: radial-gradient(circle, rgba(255,180,90,.5), transparent 68%); animation: respira 3.6s ease-in-out infinite; }
.vigia-brilho.v1 { left: 675px; top: 151px; } .vigia-brilho.v2 { left: 967px; top: 547px; animation-delay: -1.5s; }
@keyframes respira { 0%,100% { opacity: .74; } 45% { opacity: 1; } 70% { opacity: .84; } }

/* ============ A PORTA ============ */
/* o vão: 240×386, de x 600 a 840, y 404 a 790 */
.vao { left: 600px; top: 404px; width: 240px; height: 386px; perspective: 820px; perspective-origin: 50% 46%; }
.interior { position: absolute; inset: 0; overflow: hidden; background: #4a2208; }
.interior svg { display: block; width: 100%; height: 100%; }
.interior .acende { position: absolute; inset: 0; opacity: 0;
  background: radial-gradient(ellipse 60% 45% at 80% 14%, rgba(255,240,200,.75), rgba(255,190,100,.32) 45%, rgba(255,140,50,0) 80%); mix-blend-mode: screen; }
.folha { position: absolute; top: 0; width: 120px; height: 386px; transform-style: preserve-3d; backface-visibility: hidden; will-change: transform; }
.folha.esq { left: 0; transform-origin: 0 50%; }
.folha.dir { right: 0; transform-origin: 100% 50%; }
/* as tábuas de costado alcatroadas: emendas, veio, pregos, o sal e a luz de baixo */
.chapas { position: absolute; inset: 0;
  background:
    linear-gradient(180deg, rgba(0,0,0,.5), transparent 18%, transparent 74%, rgba(255,150,60,.10) 92%, rgba(255,170,80,.22)),
    radial-gradient(circle at 50% 50%, #c9a874 0 1.2px, #3a2614 2px, transparent 2.8px) 13px 18px / 30px 62px,
    repeating-linear-gradient(90deg, transparent 0 27px, rgba(8,4,2,.9) 27px 29px, rgba(255,220,170,.09) 29px 30px),
    repeating-linear-gradient(90deg, rgba(255,230,190,.04) 0 1px, transparent 1px 6px),
    radial-gradient(ellipse 30px 90px at 24% 40%, rgba(140,160,150,.10), transparent 70%),
    radial-gradient(ellipse 40px 60px at 74% 76%, rgba(20,8,2,.35), transparent 70%),
    linear-gradient(90deg, #2e1c10, #4a3019 30%, #3e2814 64%, #2a190d); }
.folha.esq .chapas { box-shadow: inset 0 0 0 4px #160c05, inset 0 0 0 6px #5a3e22, inset -3px 0 0 6px #120904; }
.folha.dir .chapas { box-shadow: inset 0 0 0 4px #160c05, inset 0 0 0 6px #5a3e22, inset 3px 0 0 6px #120904; }
/* as ferragens: cintas de ferro de dobradiça terminando em ponta de flecha na direção do meio */
.cinta { position: absolute; height: 18px; width: 112px;
  background:
    radial-gradient(circle at 50% 50%, #b4a89a 0 1.7px, #2a2622 2.5px, transparent 3.1px) 10px 0 / 24px 100% repeat-x,
    linear-gradient(180deg, #4e4840 0, #2c2824 45%, #161412 100%);
  box-shadow: 0 3px 3px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,230,200,.14); }
.folha.esq .cinta { left: -6px; clip-path: polygon(0 0, 82% 0, 100% 50%, 82% 100%, 0 100%); }
.folha.dir .cinta { right: -6px; clip-path: polygon(18% 0, 100% 0, 100% 100%, 18% 100%, 0 50%); }
.cinta.c1 { top: 30px; } .cinta.c2 { top: 250px; } .cinta.c3 { top: 338px; }
/* os grampos da tranca (a parte da frente repete por cima da barra; ver .grampo-frente) */
.suporte { position: absolute; top: 188px; width: 22px; height: 50px; border-radius: 3px;
  background: radial-gradient(circle at 50% 6px, #b4a89a 0 1.7px, transparent 2.5px), radial-gradient(circle at 50% 44px, #b4a89a 0 1.7px, transparent 2.5px), linear-gradient(90deg, #1c1a18, #4a443e 50%, #1c1a18);
  box-shadow: 0 2px 3px rgba(0,0,0,.6); }
.folha.esq .suporte { left: 46px; } .folha.dir .suporte { right: 58px; }
/* argolas de latão presas a um espelho */
.argola { position: absolute; top: 262px; width: 34px; height: 36px; }
.folha.esq .argola { right: 14px; } .folha.dir .argola { left: 14px; }
.argola::before { content: ""; position: absolute; left: 9px; top: -6px; width: 16px; height: 16px; border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #f0d08a, #7a5520 70%); box-shadow: 0 1px 2px rgba(0,0,0,.8), 0 0 0 3px #2a1a0a; }
.argola::after { content: ""; position: absolute; left: 1px; top: 4px; width: 32px; height: 32px; border-radius: 50%;
  border: 5px solid #8a6228; border-top-color: #e6c27a; box-shadow: 0 3px 3px rgba(0,0,0,.6); }
/* meio brasão da serpente em cada folha: fechada, a porta mostra o brasão inteiro */
.meia { position: absolute; top: 52px; width: 70px; height: 150px; overflow: hidden; filter: drop-shadow(0 3px 2px rgba(0,0,0,.7)); }
.folha.esq .meia { right: 0; } .folha.dir .meia { left: 0; }
.folha .sombra { position: absolute; inset: 0; background: #050304; opacity: 0; }
/* espessura da folha (a borda que aparece quando gira) */
.folha .borda { position: absolute; top: 0; height: 100%; width: 18px; background: linear-gradient(90deg, #160c05, #4a3019, #120904); }
.folha.esq .borda { right: 0; transform-origin: 100% 50%; transform: rotateY(-90deg); }
.folha.dir .borda { left: 0; transform-origin: 0 50%; transform: rotateY(90deg); }
/* a luz pela fresta do meio (quase apagada onde o brasão atravessa: y 456–606) e debaixo da porta */
.fresta-meio { left: 718px; top: 404px; width: 4px; height: 386px; pointer-events: none;
  background: linear-gradient(180deg, rgba(255,160,70,0), rgba(255,190,110,.7) 12%, rgba(255,210,140,.85) 64%, rgba(255,160,70,.6));
  -webkit-mask-image: linear-gradient(180deg, #000 0, #000 12%, rgba(0,0,0,.1) 14.5%, rgba(0,0,0,.1) 52%, #000 55%, #000 100%);
          mask-image: linear-gradient(180deg, #000 0, #000 12%, rgba(0,0,0,.1) 14.5%, rgba(0,0,0,.1) 52%, #000 55%, #000 100%);
  filter: blur(1.5px); mix-blend-mode: screen; }
.fresta-chao { left: 596px; top: 783px; width: 248px; height: 14px; pointer-events: none; border-radius: 50%;
  background: radial-gradient(ellipse at 50% 50%, rgba(255,200,120,.95), rgba(255,130,50,.5) 45%, transparent 75%);
  filter: blur(2px); mix-blend-mode: screen; }
/* a tranca: um barrote de carvalho com cintas de ferro que corre pelos grampos e entra no encaixe à esquerda */
.tranca { left: 632px; top: 598px; width: 160px; height: 32px; border-radius: 3px;
  background:
    linear-gradient(90deg, transparent 0 18px, #2a2622 18px 30px, transparent 30px 124px, #2a2622 124px 136px, transparent 136px),
    radial-gradient(circle at 50% 50%, #c9b49a 0 1.6px, transparent 2.4px) 21px 4px / 106px 12px repeat-x,
    linear-gradient(90deg, transparent 0 calc(100% - 14px), #1a0f07 calc(100% - 14px)),
    repeating-linear-gradient(180deg, rgba(255,230,190,.06) 0 2px, transparent 2px 6px),
    linear-gradient(180deg, #7a5432, #5a3a20 40%, #3e2714 75%, #26170b);
  box-shadow: 0 7px 9px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,220,170,.28), inset 0 -2px 0 rgba(0,0,0,.5); }
/* o puxador de ferro da tranca, que fica de fora pela fenda do encaixe */
.tranca::after { content: ""; position: absolute; left: 56px; top: -24px; width: 16px; height: 28px; border-radius: 8px 8px 3px 3px;
  background: radial-gradient(circle at 40% 30%, #c9b8a4 0 2px, transparent 4px), linear-gradient(90deg, #26221e, #6a6058 45%, #2a2622);
  box-shadow: 0 2px 2px rgba(0,0,0,.6); }
.tranca::before { content: ""; position: absolute; right: -10px; top: -5px; width: 16px; height: 42px; border-radius: 3px;
  background: linear-gradient(90deg, #1c1a18, #57504a 50%, #1c1a18); box-shadow: 0 3px 3px rgba(0,0,0,.6); }
svg.bainha { left: 432px; top: 568px; width: 186px; height: 84px; overflow: visible; pointer-events: none; }
.grampo-frente { width: 22px; height: 50px; top: 592px; border-radius: 3px; pointer-events: none;
  background: radial-gradient(circle at 50% 6px, #b4a89a 0 1.7px, transparent 2.5px), radial-gradient(circle at 50% 44px, #b4a89a 0 1.7px, transparent 2.5px), linear-gradient(90deg, #1c1a18, #4a443e 50%, #1c1a18);
  box-shadow: 0 2px 3px rgba(0,0,0,.6); }
.grampo-frente.g1 { left: 646px; } .grampo-frente.g2 { left: 760px; }
/* as lascas e faíscas do ferro raspando no ferro */
.faiscas-trinco { left: 648px; top: 612px; width: 0; height: 0; pointer-events: none; }
.faiscas-trinco i { position: absolute; left: 0; top: 0; width: 3px; height: 3px; border-radius: 50%; background: #fff1c0;
  box-shadow: 0 0 5px 2px rgba(255,160,60,.9); opacity: 0; }

/* a luz que sai pela porta e deita nas tábuas do cais */
.luz-neve { left: 420px; top: 760px; width: 600px; height: 200px; pointer-events: none; opacity: .3; border-radius: 50%;
  background: radial-gradient(ellipse 50% 50% at 50% 30%, rgba(255,180,90,.7), rgba(255,120,40,.26) 50%, transparent 78%);
  mix-blend-mode: screen; }
.poca { left: 360px; top: 792px; width: 720px; height: 360px; pointer-events: none; opacity: .5; transform-origin: 50% 0;
  clip-path: polygon(33% 0, 67% 0, 100% 100%, 0 100%);
  background: radial-gradient(ellipse 60% 85% at 50% 0, rgba(255,200,120,.95), rgba(255,130,50,.42) 45%, transparent 82%);
  mix-blend-mode: screen; transform: scaleY(.3); }
.raios { left: 270px; top: 200px; width: 900px; height: 800px; pointer-events: none; opacity: 0;
  background:
    radial-gradient(ellipse 30% 40% at 50% 50%, rgba(255,215,150,.85), rgba(255,150,70,.25) 55%, transparent 80%),
    repeating-conic-gradient(from 0deg at 50% 50%, rgba(255,190,120,.18) 0 4deg, transparent 4deg 11deg);
  -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 0, rgba(0,0,0,.6) 35%, transparent 70%);
          mask-image: radial-gradient(circle at 50% 50%, #000 0, rgba(0,0,0,.6) 35%, transparent 70%);
  mix-blend-mode: screen; }

/* ============ AS ESTACAS COM LAMPIÃO (camada de perto) ============ */
.lampiao { width: 140px; height: 360px; top: 560px; transform-origin: 50% 100%; }
.lampiao.l1 { left: 430px; } .lampiao.l2 { left: 870px; }
.lampiao svg { position: absolute; inset: 0; width: 140px; height: 360px; overflow: visible; }
.lampiao.l2 svg { transform: scaleX(-1); }
.halo { position: absolute; top: 96px; width: 480px; height: 480px; margin: -240px 0 0 -240px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, rgba(255,190,100,.38), rgba(255,140,50,.13) 30%, rgba(255,110,30,.05) 50%, transparent 66%);
  animation: tremula 2.3s steps(9) infinite; }
.l1 .halo { left: 110px; } .l2 .halo { left: 30px; animation-duration: 1.9s; animation-delay: -.7s; }
@keyframes tremula { 0% { opacity: .82; } 13% { opacity: .95; } 27% { opacity: .78; } 41% { opacity: 1; } 55% { opacity: .86; } 70% { opacity: .97; } 84% { opacity: .8; } 100% { opacity: .9; } }
.chama { position: absolute; top: 88px; width: 12px; height: 20px; margin-left: -6px; border-radius: 50% 50% 45% 45% / 65% 65% 35% 35%; mix-blend-mode: screen;
  background: radial-gradient(ellipse at 50% 70%, #fffbe8 0, #ffe2a0 35%, #ffa040 70%, rgba(255,120,30,0) 100%);
  transform-origin: 50% 100%; animation: chama .7s ease-in-out infinite alternate; }
.l1 .chama { left: 110px; } .l2 .chama { left: 30px; animation-duration: .58s; }
@keyframes chama { 0% { transform: scale(1, 1) skewX(-4deg); } 50% { transform: scale(.86, 1.18) skewX(5deg); } 100% { transform: scale(1.05, .92) skewX(-2deg); } }

/* a luz dos lampiões e do poente na fachada */
.luz-fachada { left: 0; top: 0; width: 1440px; height: 900px; pointer-events: none; mix-blend-mode: soft-light;
  background:
    radial-gradient(ellipse 380px 320px at 540px 650px, rgba(255,170,80,.9), transparent 70%),
    radial-gradient(ellipse 380px 320px at 900px 650px, rgba(255,170,80,.9), transparent 70%);
  animation: tremula 2.7s steps(7) infinite; }

/* ============ A PLACA (tábua de leme pendurada por cabos no lais que sai da fachada) ============ */
.placa-grupo { left: 1060px; top: 372px; width: 350px; transform-origin: 50% 0; animation: balanca 5.4s ease-in-out infinite; cursor: default; }
@keyframes balanca { 0%,100% { transform: rotate(-1deg); } 50% { transform: rotate(1.1deg); } }
/* o cabo: corda torcida, alcatroada */
.corrente { position: absolute; top: -4px; width: 8px; height: 40px; border-radius: 3px;
  background:
    repeating-linear-gradient(62deg, #b08a52 0 2.6px, #6a4a26 2.6px 4.4px, #3a2612 4.4px 5.4px);
  box-shadow: 1px 2px 2px rgba(0,0,0,.55); }
.corrente.e { left: 36px; } .corrente.d { right: 36px; }
.entrada-placa { position: relative; margin-top: 34px; padding: 18px 20px 20px; border-radius: 4px; text-align: center;
  border: 2px solid #0c0703;
  background:
    radial-gradient(circle at 13px 13px, #f0d28c 0 2.6px, #6a4a1a 3.8px, transparent 4.8px),
    radial-gradient(circle at calc(100% - 13px) 13px, #f0d28c 0 2.6px, #6a4a1a 3.8px, transparent 4.8px),
    radial-gradient(circle at 13px calc(100% - 13px), #f0d28c 0 2.6px, #6a4a1a 3.8px, transparent 4.8px),
    radial-gradient(circle at calc(100% - 13px) calc(100% - 13px), #f0d28c 0 2.6px, #6a4a1a 3.8px, transparent 4.8px),
    radial-gradient(ellipse 70% 60% at 0% 90%, rgba(255,150,60,.18), transparent 70%),
    repeating-linear-gradient(180deg, transparent 0 36px, rgba(0,0,0,.55) 36px 38px, rgba(255,220,170,.07) 38px 39px),
    repeating-linear-gradient(90deg, rgba(255,230,190,.035) 0 1px, transparent 1px 5px),
    linear-gradient(180deg, #4a2f1a, #3a2414 48%, #2a190c);
  box-shadow: 0 20px 30px rgba(0,0,0,.72), inset 0 0 0 4px #1a0e06, inset 0 2px 0 4px rgba(255,220,170,.06); }
/* a moldura de corda em volta da tábua */
.entrada-placa::before { content: ""; position: absolute; inset: 7px; pointer-events: none; border: 5px solid transparent;
  border-image: repeating-linear-gradient(45deg, #c09a5a 0 3px, #7a5a30 3px 5px, #3a2612 5px 6px) 5; opacity: .9; }
/* o leme por trás da tábua: o aro e os punhos aparecem por cima */
.entrada-placa .placa-leme { position: absolute; left: 50%; top: -60px; width: 170px; height: 84px; margin-left: -85px; z-index: -1; overflow: visible; pointer-events: none;
  filter: drop-shadow(0 3px 2px rgba(0,0,0,.6)); }
.entrada-titulo { position: relative; margin: 4px 0 12px; font-family: var(--titulos); font-weight: 400; font-size: 44px; line-height: 1; letter-spacing: .03em;
  color: #f3e6cc; text-shadow: 0 2px 0 #000, 0 0 16px rgba(255,150,60,.32); }
.pergaminho { position: relative; padding: 14px 15px 13px; transform: rotate(-.8deg);
  background-color: var(--papel); background-image: url("../../assets/textures/shopitem_papertexture02_psd.png");
  background-size: 420px; background-blend-mode: multiply; color: var(--tinta);
  box-shadow: 0 3px 6px rgba(0,0,0,.6), inset 0 0 18px rgba(110,60,30,.28), inset 0 0 50px rgba(40,10,0,.08);
  clip-path: polygon(0 1%, 7% 0, 22% 1.2%, 41% .2%, 63% 1%, 84% 0, 100% 1.4%, 99.4% 30%, 100% 62%, 99.2% 99%, 78% 100%, 55% 98.8%, 31% 100%, 12% 99%, .6% 100%, 0 70%, .8% 38%); }
.pergaminho .cravo { position: absolute; top: 6px; width: 9px; height: 9px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #b0a9a5, #2a2527 70%); box-shadow: 0 1px 1px rgba(0,0,0,.6), 0 0 0 1.5px rgba(30,20,20,.35); }
.pergaminho .cravo.e { left: 7px; } .pergaminho .cravo.d { right: 7px; }
.entrada-hobby { margin: 0 0 10px; font-style: italic; font-size: 17px; line-height: 1.3; color: var(--tinta); }
.entrada-contato { margin: 0; padding-top: 9px; border-top: 1px dashed rgba(60,40,20,.38);
  font-family: var(--gravado); font-size: 13.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--tinta-suave); line-height: 1.75; }
.entrada-contato .ea-rot { display: block; font-size: 13.5px; font-weight: 600; letter-spacing: .2em; margin-bottom: 1px; }
.entrada-contato .ea-canal { display: block; white-space: nowrap; }
.entrada-contato .ea-id { font-family: var(--texto); font-size: 19px; font-weight: 700; letter-spacing: .02em; text-transform: none;
  color: var(--tinta); user-select: all; -webkit-user-select: all; cursor: text; margin-left: 4px;
  border-bottom: 1px dotted rgba(44,29,18,.35); }
.entrada-contato .ea-id:hover { border-bottom-color: var(--carmim); color: var(--carmim); }
/* a etiqueta da versão: uma tábua pintada de verde-mar, presa por dois cabinhos sob a placa */
.etiqueta { position: relative; width: 350px; margin: 18px auto 0; padding: 7px 8px 8px; border-radius: 2px; text-align: center;
  border: 2px solid #06100f; transform-origin: 50% -18px; animation: balanca2 4.1s ease-in-out infinite;
  background:
    radial-gradient(ellipse 30px 8px at 18% 20%, rgba(70,48,28,.8), transparent 70%),
    radial-gradient(ellipse 24px 6px at 82% 80%, rgba(70,48,28,.7), transparent 70%),
    repeating-linear-gradient(90deg, rgba(255,245,230,.03) 0 1px, transparent 1px 4px),
    linear-gradient(180deg, #24494a, #1b393a 60%, #132a2b);
  box-shadow: 0 8px 14px rgba(0,0,0,.6), inset 0 0 0 2px #0a1817, inset 0 1px 0 2px rgba(190,240,230,.1); }
.etiqueta::before, .etiqueta::after { content: ""; position: absolute; top: -20px; width: 6px; height: 20px; border-radius: 2px;
  background: repeating-linear-gradient(62deg, #b08a52 0 2.2px, #6a4a26 2.2px 3.8px, #3a2612 3.8px 4.6px); }
.etiqueta::before { left: 36px; } .etiqueta::after { right: 36px; }
@keyframes balanca2 { 0%,100% { transform: rotate(1.3deg); } 50% { transform: rotate(-1.5deg); } }
.entrada-nota .nw { white-space: nowrap; }
.entrada-nota { margin: 0; font-style: italic; font-size: 15.5px; color: #ecf1e4; line-height: 1.3; text-shadow: 0 1px 0 #041010; }

/* ============ SOBRE A CENA (tela, não mundo) ============ */
/* o borrifo do mar que o vento traz da baía (cai inclinado) e a espuma miúda */
.neve { position: absolute; left: -60%; top: -60%; width: 220%; height: 220%; pointer-events: none; will-change: transform; }
.neve.n1 { animation: cai 11s linear infinite; opacity: .55; }
.neve.n2 { animation: cai 6.5s linear infinite; opacity: .7; }
.neve.n3 { animation: cai 4.2s linear infinite; opacity: .6; filter: blur(.6px); }
@keyframes cai { from { transform: rotate(-58deg) translateY(calc(var(--t) * -1)); } to { transform: rotate(-58deg) translateY(0); } }
.nevoa { position: absolute; left: -20%; right: -20%; bottom: -4%; height: 40%; pointer-events: none;
  background:
    radial-gradient(ellipse 30% 40% at 18% 70%, rgba(150,170,175,.16), transparent 70%),
    radial-gradient(ellipse 34% 36% at 72% 82%, rgba(130,150,160,.14), transparent 70%),
    linear-gradient(180deg, transparent, rgba(30,40,48,.2) 60%, rgba(20,26,34,.34));
  animation: nevoa 16s ease-in-out infinite alternate; }
@keyframes nevoa { from { transform: translateX(-4%); } to { transform: translateX(4%); } }
/* rolos de borrifo que atravessam o cais */
.rajada { position: absolute; left: -60%; width: 90%; height: 220px; pointer-events: none; border-radius: 50%;
  background: radial-gradient(ellipse at 50% 50%, rgba(190,210,215,.13), transparent 70%); filter: blur(16px);
  animation: rajada 14s linear infinite; }
.rajada.r2 { top: 64%; animation-duration: 18s; animation-delay: -8s; height: 280px; }
.rajada.r1 { top: 40%; }
@keyframes rajada { 0% { transform: translate(0, 0) rotate(-3deg); opacity: 0; } 20% { opacity: 1; } 80% { opacity: .8; } 100% { transform: translate(190%, -4vh) rotate(-3deg); opacity: 0; } }
.vinheta { position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse 80% 76% at 50% 56%, transparent 52%, rgba(6,4,10,.62) 100%); }
.grao { position: absolute; inset: 0; pointer-events: none; opacity: .3; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .6 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); }
.flash { position: absolute; inset: 0; pointer-events: none; opacity: 0;
  background: radial-gradient(ellipse 70% 70% at 50% 55%, #fff6e0, #ffd08a 45%, #e08a3a 100%); }
.dica { position: absolute; left: 0; right: 0; bottom: 16px; margin: 0; text-align: center; pointer-events: none;
  font-family: var(--texto); font-style: italic; font-size: 14px; letter-spacing: .04em; color: rgba(238,226,206,.55);
  text-shadow: 0 1px 2px rgba(0,0,0,.7); animation: dica-chega 1.2s ease 1.4s both, dica-pulsa 4s ease-in-out 2.6s infinite; }
@keyframes dica-chega { from { opacity: 0; } to { opacity: 1; } }
@keyframes dica-pulsa { 0%,100% { opacity: 1; } 50% { opacity: .62; } }
/* o botão para leitor de tela e teclado: invisível até receber foco pelo teclado (Tab) */
.btn-entrar { position: absolute; left: 50%; bottom: 50px; transform: translateX(-50%); padding: 8px 22px; cursor: pointer;
  font-family: var(--titulos); font-size: 17px; letter-spacing: .08em; color: #f4e6d4; background: #1d3e3f;
  border: 1px solid #0a1a1a; border-radius: 2px; box-shadow: 0 3px 0 #0a1a1a, 0 6px 12px rgba(0,0,0,.5);
  opacity: 0; }
.btn-entrar:focus-visible { opacity: 1; outline: 2px solid var(--lampiao-claro); outline-offset: 3px; }

/* a loja (placeholder: na integração é o app) */
.loja { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  visibility: hidden; opacity: 0;
  background:
    radial-gradient(ellipse 900px 520px at 50% 40%, rgba(255,190,110,.14), transparent 70%),
    repeating-linear-gradient(180deg, transparent 0 10px, rgba(0,0,0,.09) 10px 11px),
    repeating-linear-gradient(180deg, transparent 0 118px, rgba(0,0,0,.45) 118px 120px),
    linear-gradient(180deg, #3b2617, #2a1a0f 60%, #21130a); }
.loja h2 { margin: 0; font-family: var(--titulos); font-weight: 400; font-size: 64px; color: #e8d3a2; text-shadow: 0 2px 0 #1a0d05; letter-spacing: .03em; }
.loja p { margin: 0; font-family: var(--texto); font-style: italic; font-size: 15px; color: #b89a66; }
.loja .atalho { position: absolute; right: 18px; bottom: 14px; font-family: var(--gravado); font-size: 11px; letter-spacing: .2em; color: #8a6e48; text-transform: uppercase; }

/* ============ A ABERTURA ============ */
body.abrindo .entrada { cursor: default; }
/* a tranca: um tranco para a direita (destrava), corre para a esquerda e bate no fundo do encaixe (0–0,42 s) */
body.abrindo .tranca { animation: tranca .42s cubic-bezier(.5,0,.3,1) both; }
@keyframes tranca {
  0%   { transform: translateX(0); }
  14%  { transform: translateX(7px) translateY(-1px); }
  24%  { transform: translateX(4px); }
  82%  { transform: translateX(-192px); }
  91%  { transform: translateX(-181px); }
  100% { transform: translateX(-186px); }
}
body.abrindo .grampo-frente { animation: some .12s linear .26s both; }
body.abrindo .faiscas-trinco i { animation: faisca-trinco .5s cubic-bezier(.2,.7,.4,1) both; }
@keyframes faisca-trinco { 0% { opacity: 0; transform: translate(0, 0); } 8% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--fx), var(--fy)); } }
/* o olho da serpente do brasão do telhado acende no clique */
body.abrindo .insignia-acorda { animation: acorda .6s ease-out both; }
@keyframes acorda { 0% { fill: #ffb040; r: 3.2; } 30% { fill: #fff2c0; r: 5.4; } 100% { fill: #ffc060; r: 3.8; } }
body.abrindo .folha.esq { animation: abre-esq 1.25s cubic-bezier(.55,.02,.2,1) .26s both; }
body.abrindo .folha.dir { animation: abre-dir 1.25s cubic-bezier(.55,.02,.2,1) .26s both; }
@keyframes abre-esq { 0% { transform: rotateY(0); } 7% { transform: rotateY(-1.2deg); } 100% { transform: rotateY(82deg); } }
@keyframes abre-dir { 0% { transform: rotateY(0); } 7% { transform: rotateY(1.2deg); } 100% { transform: rotateY(-82deg); } }
body.abrindo .folha .sombra { animation: escurece 1.25s ease-in .26s both; }
@keyframes escurece { to { opacity: .66; } }
body.abrindo .interior .acende { animation: acende 1.1s ease-out .3s both; }
@keyframes acende { to { opacity: 1; } }
body.abrindo .fresta-meio { animation: some .3s ease .32s both; }
@keyframes some { to { opacity: 0; } }
/* a luz quente se espalha pelo cais logo no começo */
body.abrindo .luz-neve { animation: luz-neve .6s ease-out .02s both; }
@keyframes luz-neve { to { opacity: 1; transform: scale(1.25, 1.1); } }
body.abrindo .poca { animation: poca 1.1s cubic-bezier(.3,.6,.3,1) .05s both; }
@keyframes poca { to { opacity: 1; transform: scaleY(1); } }
body.abrindo .raios { animation: raios 1.4s ease-out .4s both; }
@keyframes raios { 0% { opacity: 0; transform: scale(.6); } 100% { opacity: .95; transform: scale(1.15); } }
body.abrindo .dica { animation: some .3s ease both; }
body.abrindo .placa-grupo, body.abrindo .etiqueta { animation-play-state: paused; }
body.abrindo .flash { animation: flash .45s ease-in 1.4s both; }
@keyframes flash { from { opacity: 0; } to { opacity: 1; } }
body.abrindo .loja { animation: loja .42s ease-out 1.68s both; }
@keyframes loja { 0% { visibility: visible; opacity: 0; transform: scale(1.04); } 100% { visibility: visible; opacity: 1; transform: none; } }
body.aberta .entrada { visibility: hidden; }
.neve-tela { position: absolute; inset: 0; pointer-events: none; transform-origin: 50% 60%; will-change: transform, opacity;
  /* o borrifo rareia no alto (o céu fica limpo; ele aparece contra a fachada e o cais) */
  -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,.15) 0, rgba(0,0,0,.4) 22%, #000 50%);
          mask-image: linear-gradient(180deg, rgba(0,0,0,.15) 0, rgba(0,0,0,.4) 22%, #000 50%); }
/* pré-aquecimento: as luzes da abertura já nascem em camada própria */
.raios, .poca, .luz-neve, .flash, .interior .acende, .fresta-meio { will-change: transform, opacity; }

/* menos movimento: as portas só esmaecem, sem câmera */
@media (prefers-reduced-motion: reduce) {
  .neve, .nevoa, .rajada, .brilho-horizonte, .cintila, .relampago, .tiro i, .gaivota, .gaivota .asas, svg.serpente, .gota, .onda, svg.bandeira,
  .popa-brilho, .vigia-brilho, .halo, .chama, .luz-fachada, .placa-grupo, .etiqueta, .dica { animation: none !important; }
  .gota, .onda, .tiro, .relampago { display: none; }
  .neve.n3 { display: none; }
  .dica { opacity: 1; }
  body.abrindo .dica { opacity: 0 !important; visibility: hidden; }
  body.abrindo .neve-tela, body.abrindo .raios, body.abrindo .flash, body.abrindo .poca, body.abrindo .luz-neve, body.abrindo .insignia-acorda, body.abrindo .faiscas-trinco i { animation: none !important; }
  body.abrindo .fresta-meio, body.abrindo .fresta-chao { animation: none !important; opacity: 0; }
  body.abrindo .tranca, body.abrindo .grampo-frente, body.abrindo svg.bainha { animation: esmaece .4s ease both !important; }
  body.abrindo .folha.esq, body.abrindo .folha.dir { animation: esmaece .55s ease both !important; }
  body.abrindo .loja { animation: loja-calma .45s ease .5s both !important; }
}
@keyframes esmaece { to { opacity: 0; } }
@keyframes loja-calma { 0% { visibility: visible; opacity: 0; } 100% { visibility: visible; opacity: 1; } }
</style>

<body>

<div id="entrada" class="entrada" role="dialog" aria-modal="true" aria-label="Entrada da loja — a casa do contrabandista nas Docas do Abate, em Águas de Sentina">
  <div class="palco" id="palco">

    <!-- ===== LONGE: o céu de tempestade, o sol baixo, a baía, os navios de bandeira negra e a cidade na encosta ===== -->
    <div class="camada longe" id="longe" aria-hidden="true">
      <div class="ceu"></div>
      <div class="sol"></div>
      <svg class="cidade" viewBox="-900 -700 3240 2000">
        <defs>
          <linearGradient id="gMar" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#c4704e"/><stop offset=".025" stop-color="#7a3a48"/><stop offset=".09" stop-color="#2c2a3c"/>
            <stop offset=".22" stop-color="#14303a"/><stop offset=".6" stop-color="#0b222a"/><stop offset="1" stop-color="#06151a"/>

          </linearGradient>
          <linearGradient id="gColina" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#6a2c4c"/><stop offset=".3" stop-color="#4a2242"/><stop offset=".7" stop-color="#301832"/><stop offset="1" stop-color="#1e1024"/>
          </linearGradient>
          <filter id="borraoL"><feGaussianBlur stdDeviation="8"/></filter>
          <filter id="borraoN"><feGaussianBlur stdDeviation="2.4"/></filter>

        </defs>
        <!-- as faixas de nuvem de tempestade, com a borda de baixo acesa pelo poente -->

        <g id="brilho-sol" fill="#ffc888"></g>

        <g id="navios"></g>

      <div class="brilho-horizonte"></div>

      <svg class="gaivota v1" style="left:-420px;top:150px" viewBox="0 0 34 16"><g class="asas"><path d="M1 8 Q9 0 17 8 Q25 0 33 8" fill="none" stroke="#1a1018" stroke-width="2.4" stroke-linecap="round"/></g></svg>
      <svg class="gaivota v2" style="left:-300px;top:40px" viewBox="0 0 34 16"><g class="asas"><path d="M1 8 Q9 0 17 8 Q25 0 33 8" fill="none" stroke="#1a1018" stroke-width="2.2" stroke-linecap="round"/></g></svg>
      <svg class="gaivota v3" style="left:-600px;top:260px" viewBox="0 0 34 16"><g class="asas"><path d="M1 8 Q9 0 17 8 Q25 0 33 8" fill="none" stroke="#2a1820" stroke-width="2" stroke-linecap="round"/></g></svg>
    </div>

    <!-- ===== MUNDO: o cais, o guindaste do abate e a casa do contrabandista ===== -->
    <div class="camada mundo" id="mundo">
      <svg class="fundo" viewBox="-600 -400 2640 1700" aria-hidden="true">
        <defs>
          <linearGradient id="gTabua" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#5e3f26"/><stop offset=".25" stop-color="#4c321d"/><stop offset=".8" stop-color="#3a2615"/><stop offset="1" stop-color="#2c1c0f"/>
          </linearGradient>

          </linearGradient>
          <!-- o costado: tábuas trincadas (uma sobrepõe a de baixo), juntas desencontradas, pregos -->

            <rect x="0" y="27" width="240" height="1.2" fill="#a07a50" opacity=".35"/>
            <rect x="0" y="0" width="2.4" height="26" fill="#0e0703"/><rect x="132" y="26" width="2.4" height="26" fill="#0e0703"/>
            <g fill="#2a1a0e" opacity=".5"><rect x="20" y="9" width="90" height=".9"/><rect x="150" y="15" width="70" height=".9"/><rect x="40" y="36" width="60" height=".9"/><rect x="170" y="40" width="50" height=".9"/></g>
            <g fill="#b8a080"><circle cx="7" cy="12" r="1.3"/><circle cx="127" cy="38" r="1.3"/><circle cx="140" cy="38" r="1.3"/><circle cx="234" cy="12" r="1.3"/></g>
          </pattern>

<script>
(function () {
  "use strict";

  function rnd() { semente = (semente * 1664525 + 1013904223) >>> 0; return semente / 4294967296; }
  function el(tag, at, pai) { var e = document.createElementNS(NS, tag); for (var k in at) e.setAttribute(k, at[k]); if (pai) pai.appendChild(e); return e; }
  function $(id) { return document.getElementById(id); }
  function f1(n) { return n.toFixed(1); }
  function oval(cx, cy, rx, ry) { return "M" + f1(cx - rx) + " " + f1(cy) + "a" + f1(rx) + " " + f1(ry) + " 0 1 0 " + f1(2 * rx) + " 0a" + f1(rx) + " " + f1(ry) + " 0 1 0 " + f1(-2 * rx) + " 0Z"; }

  /* ---------- o que na integração vem do app (CATALOG.meta.patch e ATUALIZACAO) ---------- */
  var ATUALIZACAO = "13.120", CATALOG = { meta: { patch: "16.22.1" } };
  document.querySelectorAll("[data-patch]").forEach(function (e) { e.textContent = CATALOG.meta.patch || ""; });
  document.querySelectorAll("[data-atualizacao]").forEach(function (e) { e.textContent = ATUALIZACAO; });

  /* ---------- o som (na integração é o módulo Som do app; aqui, um substituto mudo) ---------- */
  var Som = window.Som || { destravar: function () {}, play: function () {}, parar: function () {} };

  /* ---------- um corpo de serpente: contorno cheio a partir de uma linha central e da largura ---------- */
  function corpo(pts, larg) {
    var esq = [], dir = [];
    for (var i = 0; i < pts.length; i++) {
      var a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
      var tx = b[0] - a[0], ty = b[1] - a[1], l = Math.hypot(tx, ty) || 1, nx = -ty / l, ny = tx / l, w = larg(i / (pts.length - 1));
      esq.push(f1(pts[i][0] + nx * w) + " " + f1(pts[i][1] + ny * w));
      dir.unshift(f1(pts[i][0] - nx * w) + " " + f1(pts[i][1] - ny * w));
    }
    return "M" + esq.join("L") + "L" + dir.join("L") + "Z";
  }

  /* ---------- o céu: as faixas de nuvem de tempestade ---------- */
  (function () {
    var g = $("nuvens");
    // o teto da tempestade: um manto escuro contínuo no alto
    el("rect", { x: -900, y: -700, width: 3240, height: 380, fill: "#0a0810" }, g);
    [ // base da faixa, altura dos rolos, espaço entre eles, cor escura, força da borda acesa
      [-330, 150, [120, 260], "#150e1c", 0],
      [-170, 120, [140, 300], "#1c1226", 0],
      [-10, 100, [160, 340], "#110a17", .14],
      [150, 80, [200, 420], "#1a0e20", .85],
      [320, 56, [260, 520], "#2c1230", .95],
      [480, 14, [140, 300], "#4a1c36", 1]
    ].forEach(function (b, bi) {
      var d = "", x = -900 + rnd() * 120;
      while (x < 2400) {
        var base = b[0] + (rnd() - .5) * b[1] * .7;
        if (bi === 5) d += oval(x, base + rnd() * 50, 90 + rnd() * 220, 5 + rnd() * 7);   // fiapos compridos no horizonte
        else {
          // um rolo de nuvem: bolhas de tamanhos diferentes, de fundo quase reto
          var W = b[1] * (2.2 + rnd() * 2.4), n = 6 + Math.floor(rnd() * 7);
          for (var k = 0; k < n; k++) {
            var r = b[1] * (.22 + rnd() * .42), cx = x + (rnd() - .5) * W, cy = base - r * (.25 + rnd() * .7) - (1 - Math.abs(cx - x) / W) * b[1] * .35;
            d += oval(cx, cy, r * (1.1 + rnd() * .5), r);

      }

      if (bi < 2) escura.setAttribute("filter", "url(#borraoN)");
    });
  })();

  /* ---------- a encosta da cidade, à direita: casas de cascos emborcados, popas e passarelas ---------- */

  (function () {
    var d = "M960 602";
    for (var x = 960; x <= 2340; x += 20) d += "L" + x + " " + f1(colinaY(x));
    d += "L2340 602Z";
    $("colina").setAttribute("d", d);
    var casas = [], dJ = ["", "", ""];
    for (var i = 0; i < 150; i++) {
      var cx = 1010 + rnd() * 1330, topo = colinaY(cx) + 10;
      if (topo > 590) continue;

    }
    casas.sort(function (a, b) { return a[1] - b[1]; });
    var g = $("casas");
    casas.forEach(function (c) {
      var w = 26 + rnd() * 34, h = 18 + rnd() * 26, x0 = c[0] - w / 2, base = c[1], tipo = rnd(), p;
      if (tipo < .4) // casco emborcado por telhado
        p = "M" + f1(x0) + " " + f1(base) + "V" + f1(base - h) + "Q" + f1(c[0]) + " " + f1(base - h - w * .55) + " " + f1(x0 + w) + " " + f1(base - h) + "V" + f1(base) + "Z";
      else if (tipo < .75) // água-furtada torta
        p = "M" + f1(x0) + " " + f1(base) + "V" + f1(base - h) + "L" + f1(c[0] + (rnd() - .5) * 8) + " " + f1(base - h - w * .4) + "L" + f1(x0 + w) + " " + f1(base - h + 3) + "V" + f1(base) + "Z";
      else // popa de navio encalhada: alta, com a borda da popa
        p = "M" + f1(x0) + " " + f1(base) + "L" + f1(x0 + 3) + " " + f1(base - h - 10) + "H" + f1(x0 + w - 3) + "L" + f1(x0 + w) + " " + f1(base) + "Z";
      el("path", { d: p, fill: "#1a0e1e", stroke: "#5a2a48", "stroke-width": 1, "stroke-opacity": .55 }, g);
      // palafitas
      el("path", { d: "M" + f1(x0 + 4) + " " + f1(base) + "v12M" + f1(x0 + w - 4) + " " + f1(base) + "v12", stroke: "#140a18", "stroke-width": 2 }, g);
      var nj = Math.floor(w / 12);
      for (var j = 0; j < nj; j++) {
        if (rnd() < .4) continue;

        dJ[o < .4 ? 0 : o < .75 ? 1 : 2] += "M" + f1(jx) + " " + f1(jy) + "h4.4v6h-4.4Z";
      }
      if (rnd() < .18) { // mastro velho de bandeira entre as casas
        el("path", { d: "M" + f1(c[0]) + " " + f1(base - h) + "v-" + f1(30 + rnd() * 30), stroke: "#140a18", "stroke-width": 2 }, g);
      }
    });
    // as passarelas de tábua entre as casas
    var dp = "";
    for (var k = 0; k < 14; k++) { var px = 1040 + rnd() * 1200, py = colinaY(px) + 20 + rnd() * 120; if (py < 590) dp += "M" + f1(px) + " " + f1(py) + "q" + f1(30 + rnd() * 30) + " 8 " + f1(60 + rnd() * 50) + " " + f1((rnd() - .5) * 20); }
    el("path", { d: dp, fill: "none", stroke: "#140a18", "stroke-width": 2.4 }, g);
    [.55, .78, 1].forEach(function (o, i) { el("path", { d: dJ[i], opacity: o }, $("janelas-cidade")); });
  })();

  /* ---------- a baía: marolas e o brilho do sol na água ---------- */
  (function () {
    var d = "";

  /* ---------- os navios de bandeira negra ---------- */
  function navio(g, x, base, s, grande) {

    mundo.style.transform = "translate(0px," + (-110 * p).toFixed(2) + "px) scale(" + (S0 * Math.pow(7.6 / S0, p)).toFixed(4) + ")";
    perto.style.transform = "translate(0px," + (-60 * p).toFixed(2) + "px) scale(" + (S0 * Math.pow(30 / S0, p)).toFixed(4) + ")";
    perto.style.visibility = t > .62 ? "hidden" : "";
    longe.style.transform = "translate(0px," + (-36 * p).toFixed(2) + "px) scale(" + (S0 * Math.pow(1.3, p)).toFixed(4) + ")";
    neveTela.style.transform = "scale(" + (1 + 2.2 * q).toFixed(3) + ")";
    neveTela.style.opacity = (1 - q).toFixed(3);
  }
  function repouso() {
    [mundo, perto, longe].forEach(function (c) { c.style.transform = "scale(" + S0 + ")"; });
    perto.style.visibility = "";
    neveTela.style.transform = ""; neveTela.style.opacity = "";
  }
  repouso();

  /* ---------- abrir e reiniciar ---------- */
  var estado = "fechada", timer = 0, laco = 0;
  var entrada = $("entrada"), loja = $("loja"), botao = $("entrar");
  var calmo = matchMedia("(prefers-reduced-motion: reduce)");
  function abrir() {
    if (estado !== "fechada") return;
    estado = "abrindo";
    // o som nasce no clique
    Som.destravar(); Som.play("catalog:open");
    document.body.classList.add("abrindo");
    var reduz = calmo.matches;
    if (!reduz) {
      var t0 = performance.now();
      var passo = function (agora) {
        if (estado !== "abrindo" || window.__congelado) return;
        quadro(agora - t0);
        if (agora - t0 < DUR) laco = requestAnimationFrame(passo);
      };
      laco = requestAnimationFrame(passo);
    }
    timer = setTimeout(function () {
      estado = "aberta"; document.body.classList.add("aberta");
      entrada.setAttribute("aria-hidden", "true");
      loja.focus({ preventScroll: true });
    }, reduz ? 1000 : 2150);
  }
  function reiniciar() {
    clearTimeout(timer); cancelAnimationFrame(laco); window.__congelado = false;
    if (Som.parar) Som.parar();
    document.body.classList.remove("abrindo", "aberta");
    entrada.removeAttribute("aria-hidden");
    repouso();
    void document.body.offsetWidth;
    estado = "fechada";
    botao.focus({ preventScroll: true });
  }
  // o clique abre em qualquer lugar da entrada (menos nos IDs, que selecionam)
  entrada.addEventListener("click", function (e) {
    if (e.target.closest(".ea-id")) return;
    abrir();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "r" || e.key === "R") { if (!e.ctrlKey && !e.metaKey && !e.altKey) reiniciar(); return; }
    if ((e.key === "Enter" || e.key === " ") && estado === "fechada") {
      if (e.target.closest && e.target.closest(".ea-id")) return;
      e.preventDefault(); abrir();
    }
  });

  // para o QA: congela a abertura no instante ms (câmera e animações CSS juntas, em quadros comparáveis)
  var DA_ABERTURA = /^(tranca|acorda|abre-esq|abre-dir|escurece|acende|some|luz-neve|poca|raios|flash|loja|esmaece|loja-calma|faisca-trinco)$/;
  window.__congela = function (ms, clima) {
    window.__congelado = true; cancelAnimationFrame(laco); clearTimeout(timer);
    if (document.body.classList.contains("abrindo") && !calmo.matches) quadro(ms);
    document.getAnimations().forEach(function (a) {
      a.pause();
      a.currentTime = DA_ABERTURA.test(a.animationName || "") ? ms : (clima == null ? 2600 : clima);
    });
  };
  window.abrir = abrir;
  window.__abrir = abrir; window.__reiniciar = reiniciar; window.__DUR = DUR; window.__quadro = quadro;
  window.__pronto = true;
})();
</script>
