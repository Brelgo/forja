<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forja · Entrada de Noxus</title>
<!-- F13-T99: "O arsenal da praça" — a entrada de Noxus no molde do Freljord (T96, conceito 3).
     Mesmo esqueleto (palco, camadas da câmera, vão 600–840 × 404–790, folhas em CSS 3D, trava,
     interior com o lojista, clarão, painel da loja, placa com as classes da integração);
     a arte toda trocada e própria, em SVG/CSS. Só a textura de papel do projeto, por caminho relativo. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --papel: #e5d3ad;
  --tinta: #2c1d12;
  --tinta-suave: #5a4630;
  --latao: #b6873a;
  --cera: #8d2c22;
  --carmim: #9b1c18;
  --brasa: #ff6a1e;
  --brasa-clara: #ffc27a;
  --titulos: 'IM Fell English SC', 'IM Fell English', Georgia, serif;
  --texto: 'Alegreya', Georgia, serif;
  --gravado: 'Cinzel', Georgia, serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: #070505; overflow: hidden; color: var(--tinta); font-family: var(--texto); }

/* ============ A CENA ============ */
.entrada { position: fixed; inset: 0; overflow: hidden; cursor: pointer; background: #0a0607; }
/* o palco: 1440×900 de desenho, encaixado inteiro na tela (o resto da arte sangra para fora) */
.palco { position: absolute; left: 50%; top: 50%; width: 1440px; height: 900px; transform-origin: 50% 50%; }
/* três camadas de câmera (paralaxe): longe (céu, cidade), mundo (o arsenal), perto (braseiros, frades).
   A câmera anda por JS (requestAnimationFrame), não por animação CSS. */
.camada { position: absolute; inset: 0; transform-origin: 720px 597px; transform: scale(.86); will-change: transform; }
.camada > * { position: absolute; }
.longe { pointer-events: none; }
.perto { pointer-events: none; }

/* céu de fuligem e brasa (camada de longe) */
.ceu { left: -900px; top: -700px; width: 3240px; height: 2000px;
  background:
    radial-gradient(ellipse 900px 260px at 1620px 1330px, rgba(255,96,30,.42), transparent 70%),
    radial-gradient(ellipse 700px 220px at 300px 1360px, rgba(255,80,24,.34), transparent 70%),
    radial-gradient(circle 120px at 1160px 860px, rgba(190,40,24,.32), transparent 70%),
    linear-gradient(180deg, #050304 0, #0b0607 420px, #170a09 760px, #2b100c 1020px, #4a170d 1210px, #6a2310 1330px, #7a2c12 1420px, #4a1a0e 1600px); }
/* o sol vermelho atrás da fumaça: miolo branco-quente, borda carmim viva, halo somado ao céu (screen);
   um fiapo de fumaça inclinado passa na frente (e os bolos de .fumaca sobem por cima dele) */
.sol { left: 150px; top: -130px; width: 300px; height: 300px; border-radius: 50%;
  background: radial-gradient(circle, #fff1cf 0, #ffd08a 10%, #ff9a48 18%, #ff5a22 25%, #e0301a 29%, rgba(190,30,18,.55) 31%, rgba(150,24,14,0) 36%); }
.sol::before { content: ""; position: absolute; left: -60%; top: -60%; width: 220%; height: 220%; border-radius: 50%; mix-blend-mode: screen; pointer-events: none;
  background: radial-gradient(circle, rgba(255,110,50,.5) 0, rgba(240,70,30,.26) 14%, rgba(200,44,22,.12) 26%, rgba(160,30,16,0) 46%); }
.sol::after { content: ""; position: absolute; left: 4%; top: 46%; width: 96%; height: 30%; transform: rotate(-9deg); pointer-events: none;
  background:
    radial-gradient(ellipse 48% 22% at 46% 40%, rgba(14,7,7,.82), rgba(14,7,7,0) 100%),
    radial-gradient(ellipse 30% 16% at 68% 70%, rgba(14,7,7,.6), rgba(14,7,7,0) 100%);
  filter: blur(4px); }
/* a fumaça que sobe da cidade: bolos escuros que sobem e se desfazem */
.fumaca { left: -900px; top: -700px; width: 3240px; height: 2000px; }
.fumaca i { position: absolute; display: block; border-radius: 50%; filter: blur(22px);
  background: radial-gradient(ellipse at 50% 55%, rgba(18,10,10,.85), rgba(22,12,12,.5) 45%, transparent 72%);
  animation: fumo 26s linear infinite; }
@keyframes fumo { 0% { transform: translate(0, 0) scale(.7); opacity: 0; } 12% { opacity: .95; } 70% { opacity: .75; }
  100% { transform: translate(var(--vx, 260px), -720px) scale(2.2); opacity: 0; } }
/* faixas de brasa no horizonte, respirando */
.brasa-ceu { left: -900px; top: 420px; width: 3240px; height: 420px; mix-blend-mode: screen; pointer-events: none;
  background:
    radial-gradient(ellipse 600px 90px at 18% 72%, rgba(255,110,40,.30), transparent 70%),
    radial-gradient(ellipse 520px 80px at 70% 66%, rgba(255,90,30,.30), transparent 70%),
    radial-gradient(ellipse 380px 70px at 92% 76%, rgba(255,120,50,.22), transparent 70%);
  animation: respira 7s ease-in-out infinite; }
svg.cidade { left: -900px; top: -700px; width: 3240px; height: 2000px; overflow: visible; }

svg.fundo { left: -600px; top: -400px; width: 2640px; height: 1700px; overflow: visible; }
svg.frente { left: -600px; top: -400px; width: 2640px; height: 1700px; overflow: visible; }
svg.poste { left: 940px; top: 200px; width: 720px; height: 660px; overflow: visible; }
/* os estandartes carmesins rasgados: cada um é elemento próprio e ondula no compositor */
svg.estandarte { width: 84px; height: 470px; overflow: visible; transform-origin: 50% 0; pointer-events: none;
  animation: pano 6.5s ease-in-out infinite; }
svg.estandarte.e1 { left: 418px; top: 136px; }
svg.estandarte.e2 { left: 938px; top: 136px; animation-duration: 7.3s; animation-delay: -2.4s; }
@keyframes pano { 0%,100% { transform: skewX(0deg) scaleX(1); } 30% { transform: skewX(1.6deg) scaleX(.975); } 62% { transform: skewX(-1.1deg) scaleX(1.01); } }
/* a brasa na fenda do elmo-letreiro sobre o portão (contida: não é o elemento mais claro da cena) */
svg.insignia-viva { left: 620px; top: 80px; width: 200px; height: 200px; overflow: visible; pointer-events: none; opacity: .45; animation: brasa-viva 5s ease-in-out infinite; }
@keyframes brasa-viva { 0%,100% { opacity: .34; } 50% { opacity: .6; } }
/* a boca da chaminé da forja, na ala da direita */
.chamine-brilho { left: 1196px; top: -44px; width: 136px; height: 120px; border-radius: 50%; pointer-events: none; mix-blend-mode: screen;
  background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(255,120,44,.5), rgba(220,60,20,.16) 55%, transparent 75%); animation: respira 3.2s ease-in-out infinite; }
.fumo-chamine { left: 1264px; top: 10px; width: 0; height: 0; pointer-events: none; }
.fumo-chamine i { position: absolute; left: -40px; top: -40px; width: 80px; height: 80px; border-radius: 50%; filter: blur(10px); opacity: 0;
  background: radial-gradient(circle, rgba(26,16,16,.8), rgba(26,16,16,0) 70%); animation: fumo-ch 7s linear infinite; }
.fumo-chamine i:nth-child(2) { animation-delay: -2.4s; } .fumo-chamine i:nth-child(3) { animation-delay: -4.7s; }
@keyframes fumo-ch { 0% { transform: translate(0, 0) scale(.5); opacity: 0; } 15% { opacity: .9; } 100% { transform: translate(90px, -260px) scale(2.4); opacity: 0; } }
.seteira-halo { width: 120px; height: 190px; border-radius: 50%; pointer-events: none; mix-blend-mode: screen;
  background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(255,110,40,.42), transparent 70%); animation: respira 3.8s ease-in-out infinite; }
.seteira-halo.s1 { left: 542px; top: 112px; } .seteira-halo.s2 { left: 778px; top: 112px; animation-delay: -1.7s; }
.vitrine-brilho { left: 160px; top: 420px; width: 250px; height: 330px; pointer-events: none; mix-blend-mode: screen;
  background: radial-gradient(ellipse 60% 55% at 50% 60%, rgba(255,120,50,.30), rgba(200,50,20,.10) 60%, transparent 85%); animation: respira 4.6s ease-in-out infinite; }
@keyframes respira { 0%,100% { opacity: .74; } 45% { opacity: 1; } 70% { opacity: .84; } }
@keyframes runas { 0%,100% { opacity: .5; } 50% { opacity: 1; } }

/* ============ A PORTA ============ */
/* o vão: 240×386, de x 600 a 840, y 404 a 790 */
.vao { left: 600px; top: 404px; width: 240px; height: 386px; perspective: 820px; perspective-origin: 50% 46%; }
.interior { position: absolute; inset: 0; overflow: hidden; background: #5a1606; }
.interior svg { display: block; width: 100%; height: 100%; }
.interior .acende { position: absolute; inset: 0; opacity: 0;
  background: radial-gradient(ellipse 70% 55% at 50% 30%, #ffe9c0, rgba(255,170,90,.6) 45%, rgba(255,110,40,0) 80%); mix-blend-mode: screen; }
.folha { position: absolute; top: 0; width: 120px; height: 386px; transform-style: preserve-3d; backface-visibility: hidden; will-change: transform; }
.folha.esq { left: 0; transform-origin: 0 50%; }
.folha.dir { right: 0; transform-origin: 100% 50%; }
/* as chapas de ferro rebitado: cravos em grade, emendas das chapas, riscos de uso e o calor de baixo */
.chapas { position: absolute; inset: 0;
  background:
    linear-gradient(180deg, rgba(0,0,0,.45), transparent 20%, transparent 72%, rgba(255,110,40,.10) 92%, rgba(255,130,60,.22)),
    radial-gradient(circle at 50% 50%, #a39d99 0 1.3px, #4a4548 2.2px, #0d0c0d 3.1px, transparent 3.7px) 6px 10px / 22px 24px,
    repeating-linear-gradient(180deg, transparent 0 94px, rgba(0,0,0,.65) 94px 96px, rgba(255,235,220,.08) 96px 97px, transparent 97px 128px),
    repeating-linear-gradient(103deg, rgba(255,240,230,.022) 0 1px, transparent 1px 7px),
    radial-gradient(ellipse 40px 70px at 30% 60%, rgba(90,30,20,.22), transparent 70%),
    linear-gradient(90deg, #18171a, #302d31 32%, #29262a 70%, #141315); }
.folha.esq .chapas { box-shadow: inset 0 0 0 5px #0f0e10, inset 0 0 0 7px #3a363b, inset -3px 0 0 7px #0b0a0b; }
.folha.dir .chapas { box-shadow: inset 0 0 0 5px #0f0e10, inset 0 0 0 7px #3a363b, inset 3px 0 0 7px #0b0a0b; }
/* as dobradiças compridas que terminam em ponta de lança na direção do meio */
.cinta { position: absolute; height: 20px; width: 112px;
  background:
    radial-gradient(circle at 50% 50%, #a39d99 0 1.8px, #2a2729 2.6px, transparent 3.2px) 10px 0 / 22px 100% repeat-x,
    linear-gradient(180deg, #555056 0, #2f2c30 40%, #161517 100%);
  box-shadow: 0 3px 3px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.14); }
.folha.esq .cinta { left: -6px; clip-path: polygon(0 0, 80% 0, 100% 50%, 80% 100%, 0 100%); }
.folha.dir .cinta { right: -6px; clip-path: polygon(20% 0, 100% 0, 100% 100%, 20% 100%, 0 50%); }
.cinta.c1 { top: 34px; } .cinta.c2 { top: 248px; } .cinta.c3 { top: 334px; }
/* os grampos do ferrolho (a parte da frente repete por cima da barra; ver .grampo-frente) */
.suporte { position: absolute; top: 188px; width: 22px; height: 50px; border-radius: 3px;
  background: radial-gradient(circle at 50% 6px, #a39d99 0 1.7px, transparent 2.5px), radial-gradient(circle at 50% 44px, #a39d99 0 1.7px, transparent 2.5px), linear-gradient(90deg, #1b1a1c, #4a454a 50%, #1b1a1c);
  box-shadow: 0 2px 3px rgba(0,0,0,.6); }
.folha.esq .suporte { left: 46px; } .folha.dir .suporte { right: 58px; }
/* argolas presas a um botão de cravos */
.argola { position: absolute; top: 262px; width: 34px; height: 36px; }
.folha.esq .argola { right: 14px; } .folha.dir .argola { left: 14px; }
.argola::before { content: ""; position: absolute; left: 9px; top: -6px; width: 16px; height: 16px; border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #8f8889, #2a2628 70%); box-shadow: 0 1px 2px rgba(0,0,0,.8), 0 0 0 3px #161416; }
.argola::after { content: ""; position: absolute; left: 1px; top: 4px; width: 32px; height: 32px; border-radius: 50%;
  border: 5px solid #2a272a; border-top-color: #6a6468; box-shadow: 0 3px 3px rgba(0,0,0,.6); }
/* meia insígnia em esmalte carmim em cada folha: fechada, a porta mostra o brasão inteiro */
.meia { position: absolute; top: 64px; width: 64px; height: 136px; overflow: hidden; filter: drop-shadow(0 3px 2px rgba(0,0,0,.7)); }
.folha.esq .meia { right: 0; } .folha.dir .meia { left: 0; }
.folha .sombra { position: absolute; inset: 0; background: #050304; opacity: 0; }
/* espessura da folha (a borda que aparece quando gira) */
.folha .borda { position: absolute; top: 0; height: 100%; width: 18px; background: linear-gradient(90deg, #0e0d0f, #3a363b, #0b0a0c); }
.folha.esq .borda { right: 0; transform-origin: 100% 50%; transform: rotateY(-90deg); }
.folha.dir .borda { left: 0; transform-origin: 0 50%; transform: rotateY(90deg); }
/* a luz pela fresta do meio e debaixo da porta */
/* a luz pela fresta: fina, e quase apagada onde a insígnia esmaltada atravessa (y 468–604) */
.fresta-meio { left: 718px; top: 404px; width: 4px; height: 386px; pointer-events: none;
  background: linear-gradient(180deg, rgba(255,140,60,0), rgba(255,170,90,.7) 12%, rgba(255,200,130,.85) 64%, rgba(255,140,60,.6));
  -webkit-mask-image: linear-gradient(180deg, #000 0, #000 13%, rgba(0,0,0,.1) 16.5%, rgba(0,0,0,.1) 52%, #000 57%, #000 100%);
          mask-image: linear-gradient(180deg, #000 0, #000 13%, rgba(0,0,0,.1) 16.5%, rgba(0,0,0,.1) 52%, #000 57%, #000 100%);
  filter: blur(1.5px); mix-blend-mode: screen; }
.fresta-chao { left: 596px; top: 783px; width: 248px; height: 14px; pointer-events: none; border-radius: 50%;
  background: radial-gradient(ellipse at 50% 50%, rgba(255,190,120,.95), rgba(255,110,40,.5) 45%, transparent 75%);
  filter: blur(2px); mix-blend-mode: screen; }
/* o ferrolho: uma barra pesada que corre pelos grampos e entra na bainha de ferro à esquerda */
.tranca { left: 632px; top: 598px; width: 160px; height: 32px; border-radius: 3px;
  background:
    radial-gradient(circle at 50% 50%, #b3aca8 0 1.8px, #2a2729 2.8px, transparent 3.4px) 8px 0 / 46px 100% repeat-x,
    linear-gradient(90deg, transparent 0 calc(100% - 14px), #141315 calc(100% - 14px)),
    repeating-linear-gradient(180deg, rgba(255,240,230,.07) 0 2px, transparent 2px 5px),
    linear-gradient(180deg, #6c666c, #45414a 40%, #2a272c 75%, #19171a);
  box-shadow: 0 7px 9px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.28), inset 0 -2px 0 rgba(0,0,0,.5); }
/* o punho do ferrolho, que fica de fora pela fenda da bainha */
.tranca::after { content: ""; position: absolute; left: 56px; top: -24px; width: 16px; height: 28px; border-radius: 8px 8px 3px 3px;
  background: radial-gradient(circle at 40% 30%, #c4bcb6 0 2px, transparent 4px), linear-gradient(90deg, #26232a, #6c666c 45%, #2a272c);
  box-shadow: 0 2px 2px rgba(0,0,0,.6); }
.tranca::before { content: ""; position: absolute; right: -10px; top: -5px; width: 16px; height: 42px; border-radius: 3px;
  background: linear-gradient(90deg, #1b1a1c, #57525a 50%, #1b1a1c); box-shadow: 0 3px 3px rgba(0,0,0,.6); }
svg.bainha { left: 432px; top: 568px; width: 186px; height: 84px; overflow: visible; pointer-events: none; }
.grampo-frente { width: 22px; height: 50px; top: 592px; border-radius: 3px; pointer-events: none;
  background: radial-gradient(circle at 50% 6px, #a39d99 0 1.7px, transparent 2.5px), radial-gradient(circle at 50% 44px, #a39d99 0 1.7px, transparent 2.5px), linear-gradient(90deg, #1b1a1c, #4a454a 50%, #1b1a1c);
  box-shadow: 0 2px 3px rgba(0,0,0,.6); }
.grampo-frente.g1 { left: 646px; } .grampo-frente.g2 { left: 760px; }
/* as faíscas do ferro raspando no ferro */
.faiscas-trinco { left: 648px; top: 612px; width: 0; height: 0; pointer-events: none; }
.faiscas-trinco i { position: absolute; left: 0; top: 0; width: 3px; height: 3px; border-radius: 50%; background: #fff1c0;
  box-shadow: 0 0 5px 2px rgba(255,140,40,.9); opacity: 0; }

/* a luz que sai pela porta e deita na pedra */
.luz-neve { left: 420px; top: 760px; width: 600px; height: 200px; pointer-events: none; opacity: .3; border-radius: 50%;
  background: radial-gradient(ellipse 50% 50% at 50% 30%, rgba(255,150,80,.7), rgba(255,90,30,.26) 50%, transparent 78%);
  mix-blend-mode: screen; }
.poca { left: 360px; top: 792px; width: 720px; height: 360px; pointer-events: none; opacity: .5; transform-origin: 50% 0;
  clip-path: polygon(33% 0, 67% 0, 100% 100%, 0 100%);
  background: radial-gradient(ellipse 60% 85% at 50% 0, rgba(255,180,110,.95), rgba(255,100,40,.42) 45%, transparent 82%);
  mix-blend-mode: screen; transform: scaleY(.3); }
.raios { left: 270px; top: 200px; width: 900px; height: 800px; pointer-events: none; opacity: 0;
  background:
    radial-gradient(ellipse 30% 40% at 50% 50%, rgba(255,200,140,.85), rgba(255,120,60,.25) 55%, transparent 80%),
    repeating-conic-gradient(from 0deg at 50% 50%, rgba(255,170,110,.18) 0 4deg, transparent 4deg 11deg);
  -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 0, rgba(0,0,0,.6) 35%, transparent 70%);
          mask-image: radial-gradient(circle at 50% 50%, #000 0, rgba(0,0,0,.6) 35%, transparent 70%);
  mix-blend-mode: screen; }

/* ============ OS BRASEIROS (camada de perto) ============ */
.braseiro { width: 140px; height: 330px; top: 575px; transform: scale(1.12); transform-origin: 50% 100%; }
.braseiro.b1 { left: 395px; } .braseiro.b2 { left: 905px; }
.braseiro svg { position: absolute; inset: 0; width: 140px; height: 330px; overflow: visible; }
.halo { position: absolute; left: 70px; top: 165px; width: 540px; height: 540px; margin: -270px 0 0 -270px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,130,50,.36), rgba(255,80,20,.13) 32%, rgba(255,60,10,.05) 52%, transparent 66%);
  animation: tremula 2.3s steps(9) infinite; }
.b2 .halo { animation-duration: 1.9s; animation-delay: -.7s; }
@keyframes tremula { 0% { opacity: .82; } 13% { opacity: .95; } 27% { opacity: .78; } 41% { opacity: 1; } 55% { opacity: .86; } 70% { opacity: .97; } 84% { opacity: .8; } 100% { opacity: .9; } }
.chamas { position: absolute; left: 70px; top: 176px; width: 0; height: 0; }
.ch { position: absolute; bottom: -4px; transform-origin: 50% 100%; mix-blend-mode: screen; filter: blur(1.4px);
  animation: chama .8s ease-in-out infinite alternate; }
.ch::before { content: ""; position: absolute; left: 0; bottom: 0; width: 100%; aspect-ratio: 1; border-radius: 0 50% 50% 50%; transform: rotate(45deg); transform-origin: 50% 50%;
  background: radial-gradient(circle at 62% 62%, #fff0c8 0, #ffc060 22%, #ff6a1a 50%, #c0280a 72%, rgba(140,20,5,0) 84%); }
.ch.f1 { left: -32px; width: 64px; height: 64px; animation-duration: .9s; }
.ch.f2 { left: -18px; width: 36px; height: 36px; animation-duration: .62s; animation-delay: -.3s; }
.ch.f2::before { background: radial-gradient(circle at 62% 62%, #fffbe8 0, #ffe6a0 30%, #ffae4a 55%, rgba(255,110,30,0) 80%); }
.ch.f3 { left: -46px; width: 36px; height: 36px; animation-duration: .75s; animation-delay: -.5s; }
.ch.f4 { left: 8px; width: 34px; height: 34px; animation-duration: .68s; animation-delay: -.15s; }
.ch.f5 { left: -12px; width: 26px; height: 26px; bottom: 34px; animation: lingua 1.1s ease-in infinite; opacity: .8; }
@keyframes chama { 0% { transform: scale(1, 1.6) skewX(-7deg); } 35% { transform: scale(.9, 1.9) skewX(-13deg); } 70% { transform: scale(1.06, 1.5) skewX(-4deg); } 100% { transform: scale(.95, 1.8) skewX(-10deg); } }
@keyframes lingua { 0% { transform: translate(0, 0) scale(.9, 1.4); opacity: .85; } 100% { transform: translate(16px, -46px) scale(.25, .7); opacity: 0; } }
.faisca { position: absolute; left: 70px; top: 166px; width: 3px; height: 3px; border-radius: 50%; background: #ffd890;
  box-shadow: 0 0 4px 1px rgba(255,120,40,.9); opacity: 0; animation: sobe 2.2s linear infinite; }
@keyframes sobe { 0% { transform: translate(0, 0); opacity: 0; } 10% { opacity: 1; } 50% { transform: translate(calc(var(--dx) * .45), -110px); } 100% { transform: translate(var(--dx), -250px); opacity: 0; } }

/* luz dos braseiros na fachada */
.luz-fachada { left: 0; top: 0; width: 1440px; height: 900px; pointer-events: none; mix-blend-mode: soft-light;
  background:
    radial-gradient(ellipse 400px 340px at 465px 700px, rgba(255,120,50,.9), transparent 70%),
    radial-gradient(ellipse 400px 340px at 975px 700px, rgba(255,120,50,.9), transparent 70%);
  animation: tremula 2.7s steps(7) infinite; }

/* ============ A PLACA (chapa de ferro presa por correntes ao poste de lanças) ============ */
.placa-grupo { left: 1024px; top: 384px; width: 360px; transform-origin: 50% 0; animation: balanca 6.5s ease-in-out infinite; cursor: default; }
@keyframes balanca { 0%,100% { transform: rotate(-.7deg); } 50% { transform: rotate(.8deg); } }
/* a corrente: elos de frente (anéis) e de perfil (a barra que passa por dentro do anel) */
.corrente { position: absolute; top: -4px; width: 12px; height: 38px;
  background:
    radial-gradient(ellipse 50% 50% at 50% 50%, transparent 0 46%, #9a9496 54%, #4a4549 74%, #1a181a 88%, transparent 94%) 0 0 / 12px 14px repeat-y,

.entrada-placa { position: relative; margin-top: 32px; padding: 16px 18px 18px; border-radius: 3px; text-align: center;

    radial-gradient(circle at 13px 13px, #b5aeaa 0 2.2px, #2a272a 3.4px, transparent 4.4px),

    radial-gradient(ellipse 70% 60% at 0% 90%, rgba(255,110,40,.20), transparent 70%),
    radial-gradient(ellipse 50% 40% at 80% 10%, rgba(255,255,255,.05), transparent 70%),
    repeating-linear-gradient(90deg, rgba(255,245,240,.03) 0 1px, transparent 1px 3px, rgba(0,0,0,.08) 3px 4px),

  box-shadow: 0 20px 30px rgba(0,0,0,.72), inset 0 0 0 4px #141215, inset 0 0 0 6px #7a1915, inset 0 0 0 7px #2a0807, inset 0 2px 0 7px rgba(255,255,255,.06); }
/* a crista de pontas de ferro no alto da chapa */
.entrada-placa .placa-pontas { position: absolute; left: 10px; right: 10px; top: -15px; height: 16px; width: calc(100% - 20px); pointer-events: none; overflow: visible;
  filter: drop-shadow(0 2px 1px rgba(0,0,0,.6)); }
.entrada-titulo { margin: 4px 0 12px; font-family: var(--titulos); font-weight: 400; font-size: 44px; line-height: 1; letter-spacing: .03em;
  color: #efe3cf; text-shadow: 0 2px 0 #000, 0 0 16px rgba(255,90,30,.32); }
.pergaminho { position: relative; padding: 14px 15px 13px; transform: rotate(.7deg);
  background-color: var(--papel); background-image: url("../../assets/textures/shopitem_papertexture02_psd.png");
  background-size: 420px; background-blend-mode: multiply; color: var(--tinta);
  box-shadow: 0 3px 6px rgba(0,0,0,.6), inset 0 0 18px rgba(110,60,30,.28), inset 0 0 50px rgba(40,10,0,.08);
  clip-path: polygon(0 1%, 7% 0, 22% 1.2%, 41% .2%, 63% 1%, 84% 0, 100% 1.4%, 99.4% 30%, 100% 62%, 99.2% 99%, 78% 100%, 55% 98.8%, 31% 100%, 12% 99%, .6% 100%, 0 70%, .8% 38%); }
.pergaminho .cravo { position: absolute; top: 6px; width: 9px; height: 9px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #b0a9a5, #2a2527 70%); box-shadow: 0 1px 1px rgba(0,0,0,.6), 0 0 0 1.5px rgba(30,20,20,.35); }

.entrada-hobby { margin: 0 0 10px; font-style: italic; font-size: 17px; line-height: 1.3; color: var(--tinta); }

.entrada-contato .ea-rot { display: block; font-size: 13.5px; font-weight: 600; letter-spacing: .2em; margin-bottom: 1px; }
.entrada-contato .ea-canal { display: block; white-space: nowrap; }
.entrada-contato .ea-id { font-family: var(--texto); font-size: 19px; font-weight: 700; letter-spacing: .02em; text-transform: none;
  color: var(--tinta); user-select: all; -webkit-user-select: all; cursor: text; margin-left: 4px;
  border-bottom: 1px dotted rgba(44,29,18,.35); }
.entrada-contato .ea-id:hover { border-bottom-color: var(--carmim); color: var(--carmim); }
/* a etiqueta da versão, presa por duas correntinhas sob a chapa */
.etiqueta { position: relative; width: 340px; margin: 18px auto 0; padding: 7px 14px 8px; border-radius: 2px; text-align: center;
  border: 2px solid #070607; transform-origin: 50% -18px; animation: balanca2 4.4s ease-in-out infinite;
  background:
    repeating-linear-gradient(90deg, rgba(255,245,240,.03) 0 1px, transparent 1px 3px),
    linear-gradient(180deg, #5e1512, #46100e 60%, #340b0a);
  box-shadow: 0 8px 14px rgba(0,0,0,.6), inset 0 0 0 2px #1c0605, inset 0 1px 0 2px rgba(255,190,170,.12); }
.etiqueta::before, .etiqueta::after { content: ""; position: absolute; top: -20px; width: 10px; height: 20px;
  background:
    radial-gradient(ellipse 50% 50% at 50% 50%, transparent 0 44%, #8a8486 54%, #3a363a 76%, transparent 92%) 0 0 / 10px 10px repeat-y,
    linear-gradient(90deg, transparent 4px, #6a656c 4px 6px, transparent 6px) 0 5px / 10px 10px repeat-y; }
.etiqueta::before { left: 34px; } .etiqueta::after { right: 34px; }
@keyframes balanca2 { 0%,100% { transform: rotate(1.2deg); } 50% { transform: rotate(-1.4deg); } }
.entrada-nota .nw { white-space: nowrap; }
.entrada-nota { margin: 0; font-style: italic; font-size: 16px; color: #f1e2cc; line-height: 1.3; text-shadow: 0 1px 0 #120302; }

/* ============ SOBRE A CENA (tela, não mundo) ============ */
/* a chuva de cinzas (cai inclinada) e as brasas que sobem (ladrilhos que se repetem no eixo do vento) */
.neve { position: absolute; left: -60%; top: -60%; width: 220%; height: 220%; pointer-events: none; will-change: transform; }
.neve.n1 { animation: cai 16s linear infinite; opacity: .7; }
.neve.n2 { animation: cai 8.5s linear infinite; opacity: .85; }
.neve.n3 { animation: ascende 9s linear infinite; mix-blend-mode: screen; }
.neve.n4 { animation: ascende 4.6s linear infinite; mix-blend-mode: screen; filter: blur(1px); }
@keyframes cai { from { transform: rotate(-14deg) translateY(calc(var(--t) * -1)); } to { transform: rotate(-14deg) translateY(0); } }
@keyframes ascende { from { transform: rotate(10deg) translateY(0); } to { transform: rotate(10deg) translateY(calc(var(--t) * -1)); } }
.nevoa { position: absolute; left: -20%; right: -20%; bottom: -4%; height: 44%; pointer-events: none;
  background:
    radial-gradient(ellipse 30% 40% at 20% 70%, rgba(120,40,24,.20), transparent 70%),
    radial-gradient(ellipse 34% 36% at 70% 80%, rgba(110,36,22,.18), transparent 70%),
    linear-gradient(180deg, transparent, rgba(40,16,12,.22) 60%, rgba(30,12,10,.36));
  animation: nevoa 16s ease-in-out infinite alternate; }
@keyframes nevoa { from { transform: translateX(-4%); } to { transform: translateX(4%); } }
/* rolos de fumaça baixa que atravessam a praça */
.rajada { position: absolute; left: -60%; width: 90%; height: 240px; pointer-events: none; border-radius: 50%;
  background: radial-gradient(ellipse at 50% 50%, rgba(30,18,16,.42), transparent 70%); filter: blur(16px);
  animation: rajada 15s linear infinite; }
.rajada.r2 { top: 60%; animation-duration: 19s; animation-delay: -8s; height: 300px; }
.rajada.r1 { top: 14%; }
@keyframes rajada { 0% { transform: translate(0, 0) rotate(4deg); opacity: 0; } 20% { opacity: 1; } 80% { opacity: .8; } 100% { transform: translate(190%, 8vh) rotate(4deg); opacity: 0; } }
.vinheta { position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse 80% 76% at 50% 56%, transparent 50%, rgba(6,2,2,.66) 100%); }
.grao { position: absolute; inset: 0; pointer-events: none; opacity: .3; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .6 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); }
.flash { position: absolute; inset: 0; pointer-events: none; opacity: 0;
  background: radial-gradient(ellipse 70% 70% at 50% 55%, #fff2dc, #ffc48a 45%, #e0703a 100%); }
.dica { position: absolute; left: 0; right: 0; bottom: 16px; margin: 0; text-align: center; pointer-events: none;
  font-family: var(--texto); font-style: italic; font-size: 14px; letter-spacing: .04em; color: rgba(238,222,206,.5);
  text-shadow: 0 1px 2px rgba(0,0,0,.7); animation: dica-chega 1.2s ease 1.4s both, dica-pulsa 4s ease-in-out 2.6s infinite; }
@keyframes dica-chega { from { opacity: 0; } to { opacity: 1; } }
@keyframes dica-pulsa { 0%,100% { opacity: 1; } 50% { opacity: .62; } }
/* o botão para leitor de tela e teclado: invisível até receber foco pelo teclado (Tab) */
.btn-entrar { position: absolute; left: 50%; bottom: 50px; transform: translateX(-50%); padding: 8px 22px; cursor: pointer;
  font-family: var(--titulos); font-size: 17px; letter-spacing: .08em; color: #f4e6d4; background: var(--carmim);
  border: 1px solid #4a0c09; border-radius: 2px; box-shadow: 0 3px 0 #3a0907, 0 6px 12px rgba(0,0,0,.5);
  opacity: 0; }
.btn-entrar:focus-visible { opacity: 1; outline: 2px solid var(--brasa-clara); outline-offset: 3px; }

/* a loja (placeholder: na integração é o app) */
.loja { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  visibility: hidden; opacity: 0;
  background:
    radial-gradient(ellipse 900px 520px at 50% 40%, rgba(255,190,110,.14), transparent 70%),
    repeating-linear-gradient(180deg, transparent 0 10px, rgba(0,0,0,.09) 10px 11px),
    repeating-linear-gradient(180deg, transparent 0 118px, rgba(0,0,0,.45) 118px 120px),
    linear-gradient(180deg, #3b2617, #2a1a0f 60%, #21130a); }
.loja h2 { margin: 0; font-family: var(--titulos); font-weight: 400; font-size: 64px; color: #e8d3a2; text-shadow: 0 2px 0 #1a0d05; letter-spacing: .03em; }
.loja p { margin: 0; font-family: var(--texto); font-style: italic; font-size: 15px; color: #b89a66; }
.loja .atalho { position: absolute; right: 18px; bottom: 14px; font-family: var(--gravado); font-size: 11px; letter-spacing: .2em; color: #8a6e48; text-transform: uppercase; }

/* ============ A ABERTURA ============ */
body.abrindo .entrada { cursor: default; }
/* o ferrolho: um tranco para a direita (destrava), corre para a esquerda e bate no fundo da bainha (0–0,42 s) */
body.abrindo .tranca { animation: tranca .42s cubic-bezier(.5,0,.3,1) both; }
@keyframes tranca {
  0%   { transform: translateX(0); }
  14%  { transform: translateX(7px) translateY(-1px); }
  24%  { transform: translateX(4px); }
  82%  { transform: translateX(-192px); }
  91%  { transform: translateX(-181px); }
  100% { transform: translateX(-186px); }
}
body.abrindo .grampo-frente { animation: some .12s linear .26s both; }
body.abrindo .faiscas-trinco i { animation: faisca-trinco .5s cubic-bezier(.2,.7,.4,1) both; }
@keyframes faisca-trinco { 0% { opacity: 0; transform: translate(0, 0); } 8% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--fx), var(--fy)); } }
/* a insígnia em brasa responde ao clique */
body.abrindo .insignia-acorda { animation: acorda .6s ease-out both; }
@keyframes acorda { 0% { stroke: #ff5a24; stroke-width: 2.2; opacity: .7; } 30% { stroke: #ffe2b0; stroke-width: 4.6; opacity: 1; } 100% { stroke: #ff6a2a; stroke-width: 2.6; opacity: .9; } }
body.abrindo .folha.esq { animation: abre-esq 1.25s cubic-bezier(.55,.02,.2,1) .26s both; }
body.abrindo .folha.dir { animation: abre-dir 1.25s cubic-bezier(.55,.02,.2,1) .26s both; }
@keyframes abre-esq { 0% { transform: rotateY(0); } 7% { transform: rotateY(-1.2deg); } 100% { transform: rotateY(82deg); } }
@keyframes abre-dir { 0% { transform: rotateY(0); } 7% { transform: rotateY(1.2deg); } 100% { transform: rotateY(-82deg); } }
body.abrindo .folha .sombra { animation: escurece 1.25s ease-in .26s both; }
@keyframes escurece { to { opacity: .66; } }
body.abrindo .interior .acende { animation: acende 1.1s ease-out .3s both; }
@keyframes acende { to { opacity: 1; } }
body.abrindo .fresta-meio { animation: some .3s ease .32s both; }
@keyframes some { to { opacity: 0; } }
/* a luz quente se espalha pela praça logo no começo */
body.abrindo .luz-neve { animation: luz-neve .6s ease-out .02s both; }
@keyframes luz-neve { to { opacity: 1; transform: scale(1.25, 1.1); } }
body.abrindo .poca { animation: poca 1.1s cubic-bezier(.3,.6,.3,1) .05s both; }
@keyframes poca { to { opacity: 1; transform: scaleY(1); } }
body.abrindo .raios { animation: raios 1.4s ease-out .4s both; }
@keyframes raios { 0% { opacity: 0; transform: scale(.6); } 100% { opacity: .95; transform: scale(1.15); } }
body.abrindo .dica { animation: some .3s ease both; }
body.abrindo .placa-grupo, body.abrindo .etiqueta { animation-play-state: paused; }
body.abrindo .flash { animation: flash .45s ease-in 1.4s both; }
@keyframes flash { from { opacity: 0; } to { opacity: 1; } }
body.abrindo .loja { animation: loja .42s ease-out 1.68s both; }
@keyframes loja { 0% { visibility: visible; opacity: 0; transform: scale(1.04); } 100% { visibility: visible; opacity: 1; transform: none; } }
body.aberta .entrada { visibility: hidden; }
.neve-tela { position: absolute; inset: 0; pointer-events: none; transform-origin: 50% 60%; will-change: transform, opacity;
  /* a cinza rareia no alto (o céu escuro fica limpo; ela aparece contra a brasa e a fachada) */
  -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,.18) 0, rgba(0,0,0,.45) 20%, #000 46%);
          mask-image: linear-gradient(180deg, rgba(0,0,0,.18) 0, rgba(0,0,0,.45) 20%, #000 46%); }
/* pré-aquecimento: as luzes da abertura já nascem em camada própria */
.raios, .poca, .luz-neve, .flash, .interior .acende, .fresta-meio { will-change: transform, opacity; }

/* menos movimento: as portas só esmaecem, sem câmera */
@media (prefers-reduced-motion: reduce) {
  .neve, .nevoa, .rajada, .fumaca i, .brasa-ceu, .halo, .luz-fachada, .ch, .faisca, .placa-grupo, .etiqueta, .seteira-halo, .vitrine-brilho, svg.estandarte, svg.insignia-viva, .chamine-brilho, .dica { animation: none !important; }
  .fumo-chamine { display: none; }
  .faisca { display: none; }
  .neve.n3, .neve.n4 { display: none; }
  .dica { opacity: 1; }
  body.abrindo .dica { opacity: 0 !important; visibility: hidden; }
  body.abrindo .neve-tela, body.abrindo .raios, body.abrindo .flash, body.abrindo .poca, body.abrindo .luz-neve, body.abrindo .insignia-acorda, body.abrindo .faiscas-trinco i { animation: none !important; }
  body.abrindo .fresta-meio, body.abrindo .fresta-chao { animation: none !important; opacity: 0; }
  body.abrindo .tranca, body.abrindo .grampo-frente, body.abrindo svg.bainha { animation: esmaece .4s ease both !important; }
  body.abrindo .folha.esq, body.abrindo .folha.dir { animation: esmaece .55s ease both !important; }
  body.abrindo .loja { animation: loja-calma .45s ease .5s both !important; }
}
@keyframes esmaece { to { opacity: 0; } }
@keyframes loja-calma { 0% { visibility: visible; opacity: 0; } 100% { visibility: visible; opacity: 1; } }
</style>

<body>

<div id="entrada" class="entrada" role="dialog" aria-modal="true" aria-label="Entrada da loja — arsenal da praça de Noxus">
  <div class="palco" id="palco">

    <!-- ===== LONGE: céu de fuligem, sol vermelho, a cidade de torres e a fumaça ===== -->
    <div class="camada longe" id="longe" aria-hidden="true">
      <div class="ceu"></div>
      <div class="sol"></div>
      <div class="brasa-ceu"></div>
      <svg class="cidade" viewBox="-900 -700 3240 2000">
        <defs>
          <linearGradient id="gTorreLonge" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#2a1210"/><stop offset="1" stop-color="#3e1a12"/>

            <stop offset="0" stop-color="#120a0a"/><stop offset=".8" stop-color="#1a0d0b"/><stop offset="1" stop-color="#2a120c"/>

        </defs>
        <g id="torres-longe" fill="url(#gTorreLonge)" opacity=".9"></g>

            <g fill="#5a545e" opacity=".35"><rect x="2" y="2" width="76" height="1"/><rect x="82" y="2" width="76" height="1"/><rect x="0" y="38" width="38" height="1"/><rect x="42" y="38" width="76" height="1"/><rect x="122" y="38" width="38" height="1"/></g>
          </pattern>
          <pattern id="pedrasG" patternUnits="userSpaceOnUse" x="20" y="0" width="200" height="90">
            <rect width="200" height="90" fill="#0b0a0c"/>
            <rect x="2" y="2" width="96" height="42" rx="2" fill="url(#gBloco)"/>
            <rect x="102" y="2" width="96" height="42" rx="2" fill="url(#gBloco)"/>
            <rect x="-48" y="47" width="96" height="41" rx="2" fill="url(#gBloco)"/>
            <rect x="52" y="47" width="96" height="41" rx="2" fill="url(#gBloco)"/>
            <rect x="152" y="47" width="96" height="41" rx="2" fill="url(#gBloco)"/>
            <g fill="#6a6370" opacity=".35"><rect x="3" y="3" width="94" height="1.2"/><rect x="103" y="3" width="94" height="1.2"/><rect x="0" y="48" width="47" height="1.2"/><rect x="53" y="48" width="94" height="1.2"/><rect x="153" y="48" width="47" height="1.2"/></g>
          </pattern>
          <filter id="grao" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency="0.05 0.08" numOctaves="3" seed="7" result="n"/>

      el("path", { d: "M" + (x - 30) + " " + base + " L" + (x - 24) + " " + (base - h) + " L" + (x + 24) + " " + (base - h) + " L" + (x + 30) + " " + base + "Z", fill: "url(#gFrade)", stroke: "#060506", "stroke-width": 2 }, g);
      el("rect", { x: x - 28, y: base - h - 12, width: 56, height: 14, rx: 2, fill: "#2e2930", stroke: "#060506", "stroke-width": 2 }, g);
      el("path", { d: "M" + (x - 10) + " " + (base - h - 12) + " L" + x + " " + (base - h - 64) + " L" + (x + 10) + " " + (base - h - 12) + "Z", fill: "url(#gPontaF)", stroke: "#060506", "stroke-width": 2 }, g);
      el("path", { d: "M" + (x - 26) + " " + (base - h * .4) + " H" + (x + 26), stroke: "#3e3a40", "stroke-width": 6 }, g);
      return [x, base - h * .7];
    }
    var dI = "", dP = "", dH = "";
    function corrente(a, b, cai) {
      var n = 18;
      for (var i = 0; i <= n; i++) {
        var t = i / n, x = a[0] + (b[0] - a[0]) * t, y = a[1] + (b[1] - a[1]) * t + Math.sin(t * Math.PI) * cai;
        if (i % 2) dI += oval(x, y, 9, 4);
        else { dP += oval(x, y, 8, 6); dH += "M" + f1(x - 6) + " " + f1(y - 4) + "q6 -3 12 0"; }
      }
    }
    var a = frade(-80, 985, 110), b = frade(290, 1000, 120), c = frade(1150, 1000, 120), d = frade(1520, 985, 110);
    corrente([-460, a[1] + 10], a, 30); corrente(a, b, 46); corrente(c, d, 46); corrente(d, [1900, d[1] + 10], 30);
    el("path", { d: dI, fill: "none", stroke: "#3a353c", "stroke-width": 4.5 }, g);
    el("path", { d: dP, fill: "none", stroke: "#4e4851", "stroke-width": 4 }, g);
    el("path", { d: dH, fill: "none", stroke: "#9a9296", "stroke-width": 1.2, opacity: .6 }, g);
  })();

  // os braseiros: cesta de chapas com coroa de lâminas, haste com anéis e pés de garra
  document.querySelectorAll(".braseiro").forEach(function (b, bi) {
    var laminas = "";
    for (var li = 0; li < 7; li++) {
      var x = 16 + li * 18, alto = (li === 3 ? 44 : li % 2 ? 26 : 34), inc = (x - 70) * .16;
      laminas += "M" + f1(x - 5) + " 180 L" + f1(x + inc) + " " + f1(180 - alto) + " L" + f1(x + 5) + " 180Z ";
    }
    b.innerHTML =
      '<div class="halo"></div>' +
      '<svg viewBox="0 0 140 330">' +
      '<defs><linearGradient id="gFerroB' + bi + '" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#121014"/><stop offset=".45" stop-color="#4a444c"/><stop offset=".7" stop-color="#2a262c"/><stop offset="1" stop-color="#0d0b0e"/></linearGradient>' +
      '<linearGradient id="gLaminaB' + bi + '" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2a262c"/><stop offset=".5" stop-color="#c8c0c0"/><stop offset="1" stop-color="#2a262c"/></linearGradient>' +
      '<radialGradient id="gCarvao' + bi + '" cx=".5" cy=".3" r=".75"><stop offset="0" stop-color="#ffe8a8"/><stop offset=".3" stop-color="#ff9a3a"/><stop offset=".62" stop-color="#d23a12"/><stop offset="1" stop-color="#3a0804"/></radialGradient>' +
      '<radialGradient id="gChaoQ' + bi + '" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff8a40" stop-opacity=".5"/><stop offset="1" stop-color="#ff6020" stop-opacity="0"/></radialGradient></defs>' +
      '<ellipse cx="70" cy="326" rx="124" ry="22" fill="url(#gChaoQ' + bi + ')"/>' +
      '<g stroke="#121014" stroke-width="7" stroke-linecap="round" fill="none"><path d="M70 290 Q42 300 22 322 M70 290 Q98 300 118 322 M70 296 L70 326"/></g>' +
      '<g fill="#3a363e"><path d="M22 322 l-12 4 l16 2Z M118 322 l12 4 l-16 2Z M70 326 l-6 4 h12Z"/></g>' +
      '<rect x="63" y="230" width="14" height="66" fill="url(#gFerroB' + bi + ')"/>' +
      '<g fill="#5a545c"><rect x="60" y="244" width="20" height="5"/><rect x="60" y="266" width="20" height="5"/><rect x="58" y="284" width="24" height="7"/></g>' +
      '<path d="' + laminas + '" fill="url(#gLaminaB' + bi + ')" stroke="#0a090b" stroke-width="1.5"/>' +
      '<path d="M8 180 L132 180 L114 222 L70 236 L26 222Z" fill="url(#gFerroB' + bi + ')" stroke="#08070a" stroke-width="2"/>' +
      '<path d="M8 180 L132 180 L128 190 L12 190Z" fill="#5a545c"/>' +
      '<path d="M26 222 L36 190 M48 230 L54 190 M70 236 V190 M92 230 L86 190 M114 222 L104 190" stroke="#0a090b" stroke-width="2" opacity=".8"/>' +
      '<g fill="#a39d99"><circle cx="30" cy="200" r="2"/><circle cx="52" cy="206" r="2"/><circle cx="70" cy="208" r="2"/><circle cx="88" cy="206" r="2"/><circle cx="110" cy="200" r="2"/></g>' +
      '<path d="M26 222 Q50 238 70 236 Q90 238 114 222" fill="none" stroke="#ff7a30" stroke-width="1.4" opacity=".5"/>' +
      '<ellipse cx="70" cy="180" rx="58" ry="7" fill="url(#gCarvao' + bi + ')"/>' +
      '<g fill="#2a0804" opacity=".75"><circle cx="40" cy="179" r="5"/><circle cx="58" cy="176" r="4"/><circle cx="86" cy="177" r="5"/><circle cx="104" cy="180" r="4"/></g>' +
      '<path d="M8 180 Q-6 196 0 214 M132 180 Q146 196 140 214" fill="none" stroke="#1d1a20" stroke-width="3" stroke-dasharray="5 3"/>' +
      '</svg>' +
      '<div class="chamas"><i class="ch f3"></i><i class="ch f1"></i><i class="ch f4"></i><i class="ch f2"></i><i class="ch f5"></i></div>';
    for (var f = 0; f < 8; f++) {
      var s = document.createElement("i");
      s.className = "faisca";
      s.style.setProperty("--dx", (20 + rnd() * 100).toFixed(0) + "px");
      s.style.left = (50 + rnd() * 40).toFixed(0) + "px";
      s.style.animationDuration = (1.6 + rnd() * 1.4).toFixed(2) + "s";
      s.style.animationDelay = (-rnd() * 3).toFixed(2) + "s";
      b.appendChild(s);
    }
  });

  // as faíscas do ferrolho (saem do grampo da esquerda quando a barra corre)
  (function () {
    var c = $("faiscasTrinco");
    for (var i = 0; i < 14; i++) {
      var s = document.createElement("i"), ang = -Math.PI * (.15 + rnd() * .75), v = 40 + rnd() * 90;
      s.style.setProperty("--fx", (Math.cos(ang) * v - 30).toFixed(0) + "px");
      s.style.setProperty("--fy", (Math.sin(ang) * v + 40 + rnd() * 30).toFixed(0) + "px");
      s.style.animationDelay = (.06 + rnd() * .22).toFixed(2) + "s";
      s.style.animationDuration = (.35 + rnd() * .35).toFixed(2) + "s";
      c.appendChild(s);
    }
  })();

  // cinzas que caem (n1, n2: flocos de cinza irregulares e escuros, desenhados num ladrilho SVG)
  // e brasas que sobem (n3, n4: pontos quentes)
  function flocos(t, n, rmin, rmax, cor, borda) {
    var s = "<svg xmlns='http://www.w3.org/2000/svg' width='" + t + "' height='" + t + "'>";
    for (var i = 0; i < n; i++) {
      var cx = 8 + rnd() * (t - 16), cy = 8 + rnd() * (t - 16), r = rmin + rnd() * (rmax - rmin), k = 4 + Math.floor(rnd() * 3), a0 = rnd() * 6.283, pts = [];
      for (var j = 0; j < k; j++) {
        var a = a0 + j * 6.283 / k + (rnd() - .5) * .9, rr = r * (.4 + rnd() * .8);
        pts.push(f1(cx + Math.cos(a) * rr) + "," + f1(cy + Math.sin(a) * rr * .75));
      }
      s += "<polygon points='" + pts.join(" ") + "' fill='" + cor + "' fill-opacity='" + (.6 + rnd() * .38).toFixed(2) + "' stroke='" + borda + "' stroke-width='.7'/>";
    }
    return 'url("data:image/svg+xml,' + encodeURIComponent(s + "</svg>") + '")';
  }
  [["n1", 240, 26, 1.6, 3.4, "#2b2526", "rgba(170,120,96,.45)"], ["n2", 320, 11, 2.8, 5.4, "#352d2d", "rgba(190,130,100,.5)"]].forEach(function (c) {
    var camada = document.querySelector(".neve." + c[0]);
    camada.style.backgroundImage = flocos(c[1], c[2], c[3], c[4], c[5], c[6]);
    camada.style.backgroundSize = c[1] + "px " + c[1] + "px";
    camada.style.setProperty("--t", c[1] + "px");
  });
  [["n3", 320, 6, 1.4, "255,150,70"], ["n4", 440, 4, 2.2, "255,190,110"]].forEach(function (c) {
    var camada = document.querySelector(".neve." + c[0]), t = c[1], fundos = [];
    for (var i = 0; i < c[2]; i++) {
      var r = c[3] * (.6 + rnd() * .8), x = (rnd() * t).toFixed(0), y = (rnd() * t).toFixed(0);
      fundos.push("radial-gradient(" + (r * 2.4).toFixed(2) + "px " + (r * 2.4).toFixed(2) + "px at " + x + "px " + y + "px, rgba(255,240,200,1), rgba(" + c[4] + ",.85) 30%, rgba(" + c[4] + ",.18) 60%, rgba(" + c[4] + ",0))");
    }
    camada.style.backgroundImage = fundos.join(",");
    camada.style.backgroundSize = t + "px " + t + "px";
    camada.style.setProperty("--t", t + "px");
  });

  /* ---------- encaixe na tela ---------- */
  var palco = $("palco");
  function encaixa() {
    var s = Math.min(innerWidth / 1440, innerHeight / 900);
    palco.style.transform = "translate(-50%, -50%) scale(" + s + ")";
  }
  encaixa(); addEventListener("resize", encaixa);

  /* ---------- a câmera (requestAnimationFrame) ---------- */
  // Progressão geométrica sobre a escala, acelerando: p = t^1,8; a fachada vai de 0,86 a 7,6 e
  // sobe até centrar a porta; o primeiro plano (braseiros, frades) vai a 30 e sai do quadro;
  // o céu só avança 1,3×.
  var DUR = 1950, S0 = .86;
  var longe = $("longe"), mundo = $("mundo"), perto = $("perto"), neveTela = $("neveTela");
  function quadro(ms) {
    var t = Math.min(1, Math.max(0, ms / DUR)), p = Math.pow(t, 1.8), q = Math.pow(t, 2.2);
    mundo.style.transform = "translate(0px," + (-110 * p).toFixed(2) + "px) scale(" + (S0 * Math.pow(7.6 / S0, p)).toFixed(4) + ")";
    perto.style.transform = "translate(0px," + (-60 * p).toFixed(2) + "px) scale(" + (S0 * Math.pow(30 / S0, p)).toFixed(4) + ")";
    perto.style.visibility = t > .62 ? "hidden" : "";
    longe.style.transform = "translate(0px," + (-36 * p).toFixed(2) + "px) scale(" + (S0 * Math.pow(1.3, p)).toFixed(4) + ")";
    neveTela.style.transform = "scale(" + (1 + 2.2 * q).toFixed(3) + ")";
    neveTela.style.opacity = (1 - q).toFixed(3);
  }
  function repouso() {
    [mundo, perto, longe].forEach(function (c) { c.style.transform = "scale(" + S0 + ")"; });
    perto.style.visibility = "";
    neveTela.style.transform = ""; neveTela.style.opacity = "";
  }
  repouso();

  /* ---------- abrir e reiniciar ---------- */
  var estado = "fechada", timer = 0, laco = 0;
  var entrada = $("entrada"), loja = $("loja"), botao = $("entrar");
  var calmo = matchMedia("(prefers-reduced-motion: reduce)");
  function abrir() {
    if (estado !== "fechada") return;
    estado = "abrindo";
    // o som nasce no clique
    Som.destravar(); Som.play("catalog:open");
    document.body.classList.add("abrindo");
    var reduz = calmo.matches;
    if (!reduz) {
      var t0 = performance.now();
      var passo = function (agora) {
        if (estado !== "abrindo" || window.__congelado) return;
        quadro(agora - t0);
        if (agora - t0 < DUR) laco = requestAnimationFrame(passo);
      };
      laco = requestAnimationFrame(passo);
    }
    timer = setTimeout(function () {
      estado = "aberta"; document.body.classList.add("aberta");
      entrada.setAttribute("aria-hidden", "true");
      loja.focus({ preventScroll: true });
    }, reduz ? 1000 : 2150);
  }
  function reiniciar() {
    clearTimeout(timer); cancelAnimationFrame(laco); window.__congelado = false;
    if (Som.parar) Som.parar();
    document.body.classList.remove("abrindo", "aberta");
    entrada.removeAttribute("aria-hidden");
    repouso();
    void document.body.offsetWidth;
    estado = "fechada";
    botao.focus({ preventScroll: true });
  }
  // o clique abre em qualquer lugar da entrada (menos nos IDs, que selecionam)
  entrada.addEventListener("click", function (e) {
    if (e.target.closest(".ea-id")) return;
    abrir();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "r" || e.key === "R") { if (!e.ctrlKey && !e.metaKey && !e.altKey) reiniciar(); return; }
    if ((e.key === "Enter" || e.key === " ") && estado === "fechada") {
      if (e.target.closest && e.target.closest(".ea-id")) return;
      e.preventDefault(); abrir();
    }
  });

  // para o QA: congela a abertura no instante ms (câmera e animações CSS juntas, em quadros comparáveis)
  var DA_ABERTURA = /^(tranca|acorda|abre-esq|abre-dir|escurece|acende|some|luz-neve|poca|raios|flash|loja|esmaece|loja-calma|faisca-trinco)$/;
  window.__congela = function (ms, clima) {
    window.__congelado = true; cancelAnimationFrame(laco); clearTimeout(timer);
    if (document.body.classList.contains("abrindo") && !calmo.matches) quadro(ms);
    document.getAnimations().forEach(function (a) {
      a.pause();
      a.currentTime = DA_ABERTURA.test(a.animationName || "") ? ms : (clima == null ? 2600 : clima);
    });
  };
  window.__abrir = abrir; window.__reiniciar = reiniciar; window.__DUR = DUR; window.__quadro = quadro;
  window.__pronto = true;
})();
</script>
