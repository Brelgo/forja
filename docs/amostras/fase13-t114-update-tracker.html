<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forja · Update Tracker</title>

     foi alterado para o usuário saber exatamente o que mudou, aí pode nomear o nome do bot para Update Tracker"):
     a amostra, duas opções lado a lado com os mesmos dados. Os dados vêm do histórico do data/catalog.js no git
     (o mesmo caminho do data/gerar_mudancas.py), gerados por script para esta página: o antes e o depois de cada
     campo que mudou, patch a patch. O nome e o ícone do item vêm do catalog.js. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --papel: #e5d3ad; --papel-escuro: #cdb689; --papel-borda: #a88f60; --tinta: #2c1d12; --tinta-suave: #5a4630;
  --madeira: #2a1a10; --madeira-escura: #1c120b; --latao: #b6873a; --latao-claro: #d5b35a; --latao-escuro: #8a5f18;
  --cera: #8d2c22; --cera-borda: #5c150d; --cera-texto: #f4e6c4; --titulo: #e8d3a2; --legenda: #b89a66;
  --sobe: #2f5d1e; --desce: #8d2c22;
  --titulos: 'IM Fell English SC', 'IM Fell English', Georgia, serif;
  --texto: 'Alegreya', Georgia, serif;
  --gravado: 'Cinzel', Georgia, serif;
  --tex-01: url("../../assets/textures/shopitem_papertexture01_psd.png");
  --tex-02: url("../../assets/textures/shopitem_papertexture02_psd.png");
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; color: var(--titulo); font-family: var(--texto);
  background: radial-gradient(ellipse at 50% -10%, #4a2e1a, var(--madeira-escura) 70%); }
header { padding: 16px 32px 4px; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
h1 { margin: 0; font: 400 28px var(--titulos); color: var(--titulo); }
h1 small { font: 600 11px var(--gravado); letter-spacing: .2em; color: var(--latao-claro); margin-left: 8px; }
.dica { margin: 0; color: var(--legenda); font: italic 14px var(--texto); }
.patches { margin-left: auto; display: flex; gap: 6px; }
.patches button { font: 600 11px var(--gravado); letter-spacing: .12em; padding: 6px 12px; border-radius: 3px; cursor: pointer;
  color: var(--titulo); background: linear-gradient(#3a2616, #24170d); border: 1px solid var(--latao-escuro); }
.patches button[aria-pressed="true"] { background: linear-gradient(var(--latao-claro), var(--latao)); color: var(--madeira-escura); border-color: var(--latao-claro); }
main { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding: 10px 32px 32px; }
.opcao > h2 { margin: 0 0 8px; font: 600 13px var(--gravado); letter-spacing: .16em; text-transform: uppercase; color: #ff9a4a; }
.opcao > h2 span { font: italic 13px var(--texto); letter-spacing: 0; text-transform: none; color: var(--legenda); margin-left: 8px; }

/* ---- A: o livro-razão do lojista ---- */
.livro { position: relative; padding: 22px 26px 26px; color: var(--tinta); border-radius: 4px;
  background: var(--tex-01) center / cover, var(--papel); background-blend-mode: multiply; border: 1px solid var(--papel-borda);
  box-shadow: inset 0 0 60px rgba(90,60,20,.35), 0 14px 30px rgba(0,0,0,.55); max-height: calc(100vh - 150px); overflow: auto; }
.livro-cab { display: flex; align-items: baseline; gap: 10px; border-bottom: 2px solid rgba(44,29,18,.55); padding-bottom: 6px; margin-bottom: 4px; }
.livro-cab b { font: 400 22px var(--titulos); }
.livro-cab span { font: italic 13px var(--texto); color: var(--tinta-suave); }
.livro-cab em { margin-left: auto; font: 600 10.5px var(--gravado); letter-spacing: .14em; color: var(--cera); }
.linha { display: grid; grid-template-columns: 40px 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px dashed rgba(44,29,18,.35); }
.linha img { width: 40px; height: 40px; border: 1px solid #000; border-radius: 3px; box-shadow: 0 1px 2px rgba(0,0,0,.4); }
.linha .nome { font: 700 16px var(--texto); }
.linha .nome small { font: 600 9.5px var(--gravado); letter-spacing: .12em; color: var(--tinta-suave); margin-left: 6px; text-transform: uppercase; }
.lanc { margin-top: 5px; display: grid; grid-template-columns: 128px 1fr; gap: 2px 10px; font-size: 14px; line-height: 1.4; }
.lanc dt { font: 600 10px var(--gravado); letter-spacing: .1em; text-transform: uppercase; color: var(--tinta-suave); padding-top: 3px; }
.lanc dd { margin: 0; }
.antes { color: #7a6448; text-decoration: line-through; text-decoration-color: rgba(141,44,34,.7); }
.seta { margin: 0 6px; color: var(--tinta-suave); }
.depois { font-weight: 700; }
.sobe { color: var(--sobe); } .desce { color: var(--desce); }
ins { text-decoration: none; background: rgba(47,93,30,.16); color: var(--sobe); font-weight: 700; padding: 0 2px; border-radius: 2px; }
del { color: #8a6a4a; text-decoration: line-through; text-decoration-color: rgba(141,44,34,.75); }
.so-texto { display: inline-block; margin-left: 6px; font: italic 11.5px var(--texto); color: var(--tinta-suave); }
.removidos { margin-top: 10px; font: italic 13px var(--texto); color: var(--cera); }

/* ---- B: o quadro de avisos ---- */
.quadro { padding: 18px; border-radius: 6px; max-height: calc(100vh - 150px); overflow: auto;
  background: repeating-linear-gradient(90deg, #3b2616 0 3px, #33200f 3px 9px), #33200f;
  border: 10px solid #24160c; box-shadow: inset 0 0 40px rgba(0,0,0,.7), 0 14px 30px rgba(0,0,0,.55); }
.quadro-cab { display: flex; align-items: center; gap: 12px; margin: -4px 0 14px; }
.quadro-cab .placa { padding: 6px 16px; font: 400 20px var(--titulos); color: var(--madeira-escura); border-radius: 3px;
  background: linear-gradient(var(--latao-claro), var(--latao)); border: 1px solid var(--latao-escuro); box-shadow: 0 3px 6px rgba(0,0,0,.5); }
.quadro-cab span { font: italic 13px var(--texto); color: var(--legenda); }
.avisos { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
.aviso { position: relative; padding: 18px 14px 12px; color: var(--tinta); cursor: pointer;
  background: var(--tex-02) center / cover, var(--papel); background-blend-mode: multiply; border: 1px solid var(--papel-borda); border-radius: 2px;
  box-shadow: 0 8px 14px rgba(0,0,0,.5); transform: rotate(var(--giro, 0deg)); transition: transform .2s, box-shadow .2s; }
.aviso:hover, .aviso.aberto { transform: rotate(0) translateY(-3px) scale(1.02); box-shadow: 0 14px 22px rgba(0,0,0,.6); z-index: 2; }
.aviso::before { content: ""; position: absolute; top: -7px; left: 50%; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #e8d07a, var(--latao-escuro)); box-shadow: 0 2px 3px rgba(0,0,0,.6); }
.aviso-topo { display: flex; gap: 10px; align-items: center; }
.aviso-topo img { width: 36px; height: 36px; border: 1px solid #000; border-radius: 3px; }
.aviso-topo b { font: 700 15px/1.15 var(--texto); }
.selos { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.selo { font: 600 9.5px var(--gravado); letter-spacing: .08em; text-transform: uppercase; padding: 3px 7px; border-radius: 10px;
  color: var(--cera-texto); background: var(--cera); border: 1px solid var(--cera-borda); }
.selo.num { background: #3e5a2a; border-color: #263a18; }
.resumo { margin-top: 8px; font-size: 13.5px; }
.detalhe { display: none; margin-top: 8px; padding-top: 8px; border-top: 1px dashed rgba(44,29,18,.4); font-size: 13px; line-height: 1.4; }
.aviso.aberto .detalhe { display: block; }
.detalhe p { margin: 0 0 6px; }
.detalhe p b { font: 600 9.5px var(--gravado); letter-spacing: .1em; text-transform: uppercase; color: var(--tinta-suave); display: block; }
.abre { margin-top: 6px; font: italic 12px var(--texto); color: var(--tinta-suave); }
</style>
</head>

const byId = {};

const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const limpa = (s) => String(s).replace(/\\n/g, " ");
const ROTULO = { "preço": "Preço", "custo de combinação": "Combinação", "atributos": "Atributos", "habilidades": "Habilidades",
  "receita": "Receita", "modos": "Modos", "Reembolso": "Reembolso", "Passiva do Ornn": "Passiva do Ornn" };

// a diferença palavra a palavra (a maior sequência comum): o que saiu riscado, o que entrou realçado
function difPalavras(a, b) {
  const x = limpa(a).split(/(\s+)/), y = limpa(b).split(/(\s+)/), n = x.length, m = y.length;
  const L = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = x[i] === y[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  let i = 0, j = 0, h = "";
  while (i < n && j < m) {
    if (x[i] === y[j]) { h += esc(x[i]); i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]) { h += /\S/.test(x[i]) ? "<del>" + esc(x[i]) + "</del>" : esc(x[i]); i++; }
    else { h += /\S/.test(y[j]) ? "<ins>" + esc(y[j]) + "</ins>" : esc(y[j]); j++; }
  }
  while (i < n) { h += /\S/.test(x[i]) ? "<del>" + esc(x[i]) + "</del>" : esc(x[i]); i++; }
  while (j < m) { h += /\S/.test(y[j]) ? "<ins>" + esc(y[j]) + "</ins>" : esc(y[j]); j++; }
  return h;
}
const numero = (s) => { const m = /-?\d+(?:[.,]\d+)?/.exec(String(s)); return m ? Number(m[0].replace(",", ".")) : null; };
// só a redação mudou (os números do texto são os mesmos)
const soTexto = (a, b) => JSON.stringify((limpa(a).match(/\d+(?:[.,]\d+)?/g) || [])) === JSON.stringify((limpa(b).match(/\d+(?:[.,]\d+)?/g) || []));

function antesDepois(c) {
  const a = c.antes || [], b = c.depois || [];
  if (c.campo === "preço" || c.campo === "custo de combinação") {
    const va = numero(a[0]), vb = numero(b[0]);
    const cls = va != null && vb != null ? (vb > va ? "desce" : vb < va ? "sobe" : "") : "";   // mais caro é pior para quem compra
    return '<span class="antes">' + esc(a[0] || "—") + ' g</span><span class="seta">→</span><span class="depois ' + cls + '">' + esc(b[0] || "—") + " g</span>";
  }
  // linha a linha: a que ficou igual some; a que mudou mostra a diferença
  const linhas = [], k = Math.max(a.length, b.length);
  for (let i = 0; i < k; i++) {
    if (a[i] === b[i]) continue;
    if (a[i] != null && b[i] != null) linhas.push(difPalavras(a[i], b[i]) + (c.campo === "habilidades" && soTexto(a[i], b[i]) ? '<span class="so-texto">(só a redação)</span>' : ""));
    else if (a[i] != null) linhas.push("<del>" + esc(limpa(a[i])) + "</del>");
    else linhas.push("<ins>" + esc(limpa(b[i])) + "</ins>");
  }
  return linhas.join("<br>");
}
function resumo(c) {
  if (c.campo === "preço" || c.campo === "custo de combinação") {
    const va = numero((c.antes || [])[0]), vb = numero((c.depois || [])[0]);
    return ROTULO[c.campo] + " " + (vb > va ? "+" : "") + (vb - va) + " g";
  }
  if (c.campo === "atributos") {
    const p = [], k = Math.max((c.antes || []).length, (c.depois || []).length);
    for (let i = 0; i < k; i++) if ((c.antes || [])[i] !== (c.depois || [])[i]) p.push(((c.antes || [])[i] || "—") + " → " + ((c.depois || [])[i] || "—"));
    return p.join("; ");

  return ROTULO[c.campo] + " mudou";
}

          + '<div class="abre">clique para ver o antes e o depois</div></div>';
      }).join("") + "</div>";
}
