<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forja · Entrada do Freljord (conceito 3)</title>
<!-- F13-T96, conceito 3: "O posto de troca na nevasca" (refino). Amostra autossuficiente:
     arte em SVG/CSS própria, sem imagem da internet; só texturas do projeto por caminho relativo. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --papel: #e5d3ad;
  --tinta: #2c1d12;
  --tinta-suave: #5a4630;
  --latao: #b6873a;
  --cera: #8d2c22;
  --brasa: #ff7a1e;
  --brasa-clara: #ffd27a;
  --titulos: 'IM Fell English SC', 'IM Fell English', Georgia, serif;
  --texto: 'Alegreya', Georgia, serif;
  --gravado: 'Cinzel', Georgia, serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: #070b12; overflow: hidden; color: var(--tinta); font-family: var(--texto); }

/* ============ A CENA ============ */
.entrada { position: fixed; inset: 0; overflow: hidden; cursor: pointer; background: #08101a; }
/* o palco: 1440×900 de desenho, encaixado inteiro na tela (o resto da arte sangra para fora) */
.palco { position: absolute; left: 50%; top: 50%; width: 1440px; height: 900px; transform-origin: 50% 50%; }
/* três camadas de câmera (paralaxe): longe (céu, serras), mundo (o posto), perto (braseiros, montes).
   A câmera anda por JS (requestAnimationFrame), não por animação CSS: assim a camada já
   rasterizada só é ampliada, sem rasterizar de novo na escala final no instante do clique. */
.camada { position: absolute; inset: 0; transform-origin: 720px 597px; transform: scale(.86); will-change: transform; }
.camada > * { position: absolute; }
.longe { pointer-events: none; }
.perto { pointer-events: none; }

/* céu e aurora (camada de longe) */
.ceu { left: -900px; top: -700px; width: 3240px; height: 2000px;
  background:
    radial-gradient(ellipse 260px 200px at 2180px 640px, rgba(196,214,236,.20), transparent 70%),
    linear-gradient(180deg, #03070d 0, #060c16 480px, #0b1828 780px, #142538 1080px, #22384e 1300px, #34495f 1460px, #3d5167 1600px); }
.aurora { left: -420px; top: -330px; width: 2300px; height: 620px; mix-blend-mode: screen; filter: blur(13px); }
.aurora i { position: absolute; display: block; border-radius: 50%; transform-origin: 50% 50%;
  -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 30%, #000 58%, transparent 100%);
          mask-image: linear-gradient(180deg, transparent 0, #000 30%, #000 58%, transparent 100%); }
.aurora .a1 { left: 0; top: 190px; width: 1150px; height: 230px; transform: rotate(-9deg);
  background: repeating-linear-gradient(90deg, rgba(120,255,200,0) 0 7px, rgba(150,255,215,.26) 7px 11px),
              linear-gradient(90deg, transparent, rgba(60,232,170,.85) 30%, rgba(80,214,240,.6) 72%, transparent);
  animation: aurora-a 13s ease-in-out infinite alternate; }
.aurora .a2 { left: 1020px; top: 150px; width: 1200px; height: 250px; transform: rotate(7deg);
  background: repeating-linear-gradient(90deg, rgba(160,255,230,0) 0 9px, rgba(190,235,255,.22) 9px 12px),
              linear-gradient(90deg, transparent, rgba(80,224,210,.65) 30%, rgba(146,104,255,.7) 72%, transparent);
  animation: aurora-b 17s ease-in-out infinite alternate; }
/* a faixa violeta, por cima do verde */
.aurora .a3 { left: 360px; top: 70px; width: 1300px; height: 190px; transform: rotate(-3deg);
  background: repeating-linear-gradient(90deg, rgba(200,160,255,0) 0 6px, rgba(214,180,255,.22) 6px 9px),
              linear-gradient(90deg, transparent, rgba(150,90,255,.62) 35%, rgba(196,110,240,.55) 60%, rgba(90,200,255,.3) 85%, transparent);
  animation: aurora-a 21s ease-in-out infinite alternate-reverse; }
.aurora .a4 { left: -200px; top: 330px; width: 900px; height: 150px; transform: rotate(-14deg);
  background: linear-gradient(90deg, transparent, rgba(70,255,180,.32) 45%, rgba(130,100,255,.25) 80%, transparent);
  animation: aurora-b 19s ease-in-out infinite alternate; }
@keyframes aurora-a { 0% { transform: rotate(-8deg) translateX(-60px) scaleY(.85); opacity: .6; } 100% { transform: rotate(-4deg) translateX(80px) scaleY(1.15); opacity: 1; } }
@keyframes aurora-b { 0% { transform: rotate(7deg) translateX(40px) scaleY(1.1); opacity: .95; } 100% { transform: rotate(3deg) translateX(-90px) scaleY(.8); opacity: .55; } }
svg.serras { left: -900px; top: -700px; width: 3240px; height: 2000px; overflow: visible; }

svg.fundo { left: -600px; top: -400px; width: 2640px; height: 1700px; overflow: visible; }
svg.frente { left: -600px; top: -400px; width: 2640px; height: 1700px; overflow: visible; }
/* respiração das janelas e das runas (dentro do SVG) */
/* (cada uma é um elemento próprio: a animação de opacidade fica no compositor, sem repintar a fachada) */
svg.runas-vivas { left: 580px; top: 150px; width: 280px; height: 260px; overflow: visible; pointer-events: none; animation: runas 6s ease-in-out infinite; }
svg.runas-marco { left: -40px; top: 760px; width: 120px; height: 140px; overflow: visible; pointer-events: none; animation: runas 6s ease-in-out infinite; }
.janela-halo { left: 130px; top: 385px; width: 380px; height: 260px; border-radius: 50%; pointer-events: none; mix-blend-mode: screen;
  background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(255,157,69,.32), transparent 70%); animation: respira 4.6s ease-in-out infinite; }
.janela-brilho { left: 252px; top: 458px; width: 136px; height: 112px; pointer-events: none; mix-blend-mode: screen;
  background: radial-gradient(ellipse 60% 60% at 50% 58%, rgba(255,226,160,.55), rgba(255,170,80,.18) 60%, transparent 90%); animation: respira 4.6s ease-in-out infinite; }
@keyframes respira { 0%,100% { opacity: .78; } 45% { opacity: 1; } 70% { opacity: .86; } }
@keyframes runas { 0%,100% { opacity: .45; } 50% { opacity: .95; } }

/* ============ A PORTA ============ */
/* o vão: 240×386, de x 600 a 840, y 404 a 790 */
.vao { left: 600px; top: 404px; width: 240px; height: 386px; perspective: 820px; perspective-origin: 50% 46%; }
.interior { position: absolute; inset: 0; overflow: hidden; background: #6b3412; }
.interior svg { display: block; width: 100%; height: 100%; }
.interior .acende { position: absolute; inset: 0; opacity: 0;
  background: radial-gradient(ellipse 70% 55% at 50% 30%, #fff1c8, rgba(255,200,110,.6) 45%, rgba(255,140,50,.0) 80%); mix-blend-mode: screen; }
.folha { position: absolute; top: 0; width: 120px; height: 386px; transform-style: preserve-3d; backface-visibility: hidden; will-change: transform; }
.folha.esq { left: 0; transform-origin: 0 50%; }
.folha.dir { right: 0; transform-origin: 100% 50%; }
/* as tábuas: quatro por folha, com fresta de 2px que deixa a luz de dentro passar */
.tabuas { position: absolute; inset: 0;
  background:
    linear-gradient(180deg, rgba(10,18,30,.35), transparent 25%, transparent 70%, rgba(200,220,240,.18) 94%, rgba(230,240,250,.5)),
    radial-gradient(ellipse 30px 60px at 22% 64%, rgba(20,10,4,.35), transparent 70%),
    radial-gradient(ellipse 20px 40px at 78% 22%, rgba(255,220,170,.08), transparent 70%),
    linear-gradient(90deg, rgba(0,0,0,.32), transparent 22%, transparent 78%, rgba(0,0,0,.36)) 0 0 / 30px 100%,
    repeating-linear-gradient(90deg, rgba(255,226,180,.05) 0 1px, transparent 1px 4px, rgba(0,0,0,.1) 4px 5px, transparent 5px 9px),
    repeating-linear-gradient(180deg, transparent 0 37px, rgba(0,0,0,.18) 37px 38px, transparent 38px 91px),
    linear-gradient(180deg, #4d3524, #3b281a 55%, #2c1d13);
  -webkit-mask-image: repeating-linear-gradient(90deg, #000 0 28px, transparent 28px 30px);
          mask-image: repeating-linear-gradient(90deg, #000 0 28px, transparent 28px 30px); }
.folha.dir .tabuas { -webkit-mask-image: repeating-linear-gradient(270deg, #000 0 28px, transparent 28px 30px);
                             mask-image: repeating-linear-gradient(270deg, #000 0 28px, transparent 28px 30px); }
/* cintas de ferro que viram dobradiça na borda de fora */
.cinta { position: absolute; height: 17px; width: 112px;
  background:
    radial-gradient(circle at 50% 50%, #8b8580 0 1.6px, #2a2725 2.4px, transparent 3px) 9px 0 / 22px 100% repeat-x,
    linear-gradient(180deg, #4a4643 0, #2e2b29 40%, #1a1817 100%);
  box-shadow: 0 2px 2px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.12); }
.folha.esq .cinta { left: -6px; clip-path: polygon(0 0, 88% 0, 100% 50%, 88% 100%, 0 100%); }
.folha.dir .cinta { right: -6px; clip-path: polygon(12% 0, 100% 0, 100% 100%, 12% 100%, 0 50%); }
.cinta.c1 { top: 40px; } .cinta.c2 { top: 168px; } .cinta.c3 { top: 318px; }
/* suportes da tranca e argolas */
.suporte { position: absolute; top: 190px; width: 24px; height: 40px; border-radius: 3px;
  background: radial-gradient(circle at 50% 5px, #8b8580 0 1.6px, transparent 2.4px), radial-gradient(circle at 50% 35px, #8b8580 0 1.6px, transparent 2.4px), linear-gradient(90deg, #1b1918, #3d3936 50%, #1b1918);
  box-shadow: 0 2px 3px rgba(0,0,0,.6); }
.folha.esq .suporte { left: 78px; } .folha.dir .suporte { right: 78px; }
.argola { position: absolute; top: 254px; width: 30px; height: 30px; }
.folha.esq .argola { right: 12px; } .folha.dir .argola { left: 12px; }
.argola::before { content: ""; position: absolute; left: 9px; top: -4px; width: 12px; height: 12px; border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #8a837d, #2a2624 70%); box-shadow: 0 1px 2px rgba(0,0,0,.7); }
.argola::after { content: ""; position: absolute; left: 1px; top: 2px; width: 28px; height: 28px; border-radius: 50%;
  border: 4px solid #2f2b29; border-top-color: #5b5550; box-shadow: 0 2px 2px rgba(0,0,0,.6); }
/* uma pele de lobo pregada na folha da direita (só nela: a porta não é espelho) */
.pele-porta { position: absolute; left: 18px; top: 62px; width: 84px; height: 104px; overflow: visible;
  filter: drop-shadow(0 3px 2px rgba(0,0,0,.6)); }
.folha .sombra { position: absolute; inset: 0; background: #0a0604; opacity: 0; }
/* espessura da folha (a borda que aparece quando gira) */
.folha .borda { position: absolute; top: 0; height: 100%; width: 16px; background: linear-gradient(90deg, #24170e, #3b281a, #1b120b); }
.folha.esq .borda { right: 0; transform-origin: 100% 50%; transform: rotateY(-90deg); }
.folha.dir .borda { left: 0; transform-origin: 0 50%; transform: rotateY(90deg); }
/* a luz pela fresta do meio e debaixo da porta */
.fresta-meio { left: 717px; top: 404px; width: 6px; height: 386px; pointer-events: none;
  background: linear-gradient(180deg, rgba(255,190,100,.0), rgba(255,200,110,.85) 20%, rgba(255,210,130,.95) 60%, rgba(255,180,90,.7));
  filter: blur(2px); mix-blend-mode: screen; }
.fresta-chao { left: 596px; top: 783px; width: 248px; height: 14px; pointer-events: none; border-radius: 50%;
  background: radial-gradient(ellipse at 50% 50%, rgba(255,214,140,.95), rgba(255,150,60,.5) 45%, transparent 75%);
  filter: blur(2px); mix-blend-mode: screen; }
/* a tranca: sai dos suportes, gira e fica encostada na parede, fora do vão */
.tranca { left: 572px; top: 600px; width: 298px; height: 26px; transform-origin: 149px 13px; border-radius: 4px;
  background:
    linear-gradient(90deg, #262220 0 30px, transparent 30px calc(100% - 30px), #262220 calc(100% - 30px)),
    repeating-linear-gradient(180deg, rgba(255,230,190,.06) 0 2px, transparent 2px 5px),
    linear-gradient(180deg, #7a5638, #5a3e27 45%, #3a2717);
  box-shadow: 0 6px 8px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,225,180,.25), inset 0 -2px 0 rgba(0,0,0,.4); }
.tranca::before { content: ""; position: absolute; left: 6px; top: 3px; width: 20px; height: 20px; border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #a49a90, #3a3431 60%, #1a1716); box-shadow: 0 1px 2px #000; }
.tranca::after { content: ""; position: absolute; left: 0; right: 0; top: -9px; height: 9px; border-radius: 6px 6px 2px 2px;
  background: radial-gradient(ellipse 10px 6px at 16% 100%, #fff, transparent 70%), radial-gradient(ellipse 34px 7px at 55% 100%, #f2f7fb, #d0dde8 60%, transparent 72%), radial-gradient(ellipse 22px 6px at 86% 100%, #f2f7fb, transparent 70%); }

/* a luz que sai pela porta e deita na neve */
.luz-neve { left: 420px; top: 760px; width: 600px; height: 200px; pointer-events: none; opacity: .35; border-radius: 50%;
  background: radial-gradient(ellipse 50% 50% at 50% 30%, rgba(255,196,110,.75), rgba(255,140,50,.28) 50%, transparent 78%);
  mix-blend-mode: screen; }
.poca { left: 360px; top: 792px; width: 720px; height: 360px; pointer-events: none; opacity: .62; transform-origin: 50% 0;
  clip-path: polygon(33% 0, 67% 0, 100% 100%, 0 100%);
  background: radial-gradient(ellipse 60% 85% at 50% 0, rgba(255,214,130,.95), rgba(255,160,70,.45) 45%, transparent 82%);
  mix-blend-mode: screen; transform: scaleY(.3); }
.raios { left: 270px; top: 200px; width: 900px; height: 800px; pointer-events: none; opacity: 0;
  background:
    radial-gradient(ellipse 30% 40% at 50% 50%, rgba(255,226,160,.85), rgba(255,170,80,.25) 55%, transparent 80%),
    repeating-conic-gradient(from 0deg at 50% 50%, rgba(255,210,140,.18) 0 4deg, transparent 4deg 11deg);
  -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 0, rgba(0,0,0,.6) 35%, transparent 70%);
          mask-image: radial-gradient(circle at 50% 50%, #000 0, rgba(0,0,0,.6) 35%, transparent 70%);
  mix-blend-mode: screen; }

/* ============ OS BRASEIROS (camada de perto) ============ */
.braseiro { width: 140px; height: 330px; top: 575px; transform: scale(1.12); transform-origin: 50% 100%; }
.braseiro.b1 { left: 395px; } .braseiro.b2 { left: 905px; }
.braseiro svg { position: absolute; inset: 0; width: 140px; height: 330px; overflow: visible; }
.halo { position: absolute; left: 70px; top: 165px; width: 520px; height: 520px; margin: -260px 0 0 -260px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,160,70,.34), rgba(255,110,30,.12) 32%, rgba(255,90,20,.04) 52%, transparent 66%);
  animation: tremula 2.3s steps(9) infinite; }
.b2 .halo { animation-duration: 1.9s; animation-delay: -.7s; }
@keyframes tremula { 0% { opacity: .82; } 13% { opacity: .95; } 27% { opacity: .78; } 41% { opacity: 1; } 55% { opacity: .86; } 70% { opacity: .97; } 84% { opacity: .8; } 100% { opacity: .9; } }
.chamas { position: absolute; left: 70px; top: 180px; width: 0; height: 0; }
.ch { position: absolute; bottom: -4px; transform-origin: 50% 100%; mix-blend-mode: screen; filter: blur(1.4px);
  animation: chama .8s ease-in-out infinite alternate; }
.ch::before { content: ""; position: absolute; left: 0; bottom: 0; width: 100%; aspect-ratio: 1; border-radius: 0 50% 50% 50%; transform: rotate(45deg); transform-origin: 50% 50%;
  background: radial-gradient(circle at 62% 62%, #fff6d2 0, #ffd27a 22%, #ff8a24 50%, #d0400f 72%, rgba(160,30,5,0) 84%); }
.ch.f1 { left: -30px; width: 60px; height: 60px; animation-duration: .9s; }
.ch.f2 { left: -18px; width: 36px; height: 36px; animation-duration: .62s; animation-delay: -.3s; }
.ch.f2::before { background: radial-gradient(circle at 62% 62%, #fffbe8 0, #fff0b0 30%, #ffc85a 55%, rgba(255,140,40,0) 80%); }
.ch.f3 { left: -42px; width: 34px; height: 34px; animation-duration: .75s; animation-delay: -.5s; }
.ch.f4 { left: 6px; width: 32px; height: 32px; animation-duration: .68s; animation-delay: -.15s; }
.ch.f5 { left: -12px; width: 26px; height: 26px; bottom: 34px; animation: lingua 1.1s ease-in infinite; opacity: .8; }
@keyframes chama { 0% { transform: scale(1, 1.55) skewX(-7deg); } 35% { transform: scale(.9, 1.85) skewX(-13deg); } 70% { transform: scale(1.06, 1.45) skewX(-4deg); } 100% { transform: scale(.95, 1.75) skewX(-10deg); } }
@keyframes lingua { 0% { transform: translate(0, 0) scale(.9, 1.4); opacity: .85; } 100% { transform: translate(16px, -46px) scale(.25, .7); opacity: 0; } }
.faisca { position: absolute; left: 70px; top: 170px; width: 3px; height: 3px; border-radius: 50%; background: #ffe1a0;
  box-shadow: 0 0 4px 1px rgba(255,150,50,.9); opacity: 0; animation: sobe 2.2s linear infinite; }
@keyframes sobe { 0% { transform: translate(0, 0); opacity: 0; } 10% { opacity: 1; } 50% { transform: translate(calc(var(--dx) * .45), -110px); } 100% { transform: translate(var(--dx), -250px); opacity: 0; } }

/* luz dos braseiros na fachada */
.luz-fachada { left: 0; top: 0; width: 1440px; height: 900px; pointer-events: none; mix-blend-mode: soft-light;
  background:
    radial-gradient(ellipse 380px 330px at 465px 700px, rgba(255,150,60,.85), transparent 70%),
    radial-gradient(ellipse 380px 330px at 975px 700px, rgba(255,150,60,.85), transparent 70%);
  animation: tremula 2.7s steps(7) infinite; }

/* ============ A PLACA (pendurada do braço de um poste cravado na neve) ============ */
.placa-grupo { left: 1024px; top: 384px; width: 360px; transform-origin: 50% 0; animation: balanca 5.5s ease-in-out infinite; cursor: default; }
@keyframes balanca { 0%,100% { transform: rotate(-.9deg); } 50% { transform: rotate(1.1deg); } }
.corda { position: absolute; top: 0; width: 5px; height: 30px; border-radius: 2px;
  background: repeating-linear-gradient(155deg, #b39669 0 3px, #6e5634 3px 6px); box-shadow: 1px 1px 1px rgba(0,0,0,.5); }
.corda.e { left: 40px; } .corda.d { right: 40px; }
.corda::after { content: ""; position: absolute; left: -4px; bottom: -6px; width: 13px; height: 10px; border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #a68a5e, #5a4428 70%); }
.placa { position: relative; margin-top: 28px; padding: 14px 16px 16px; border-radius: 5px; text-align: center;
  border: 2px solid #241509;
  background:
    radial-gradient(ellipse 70% 60% at 0% 80%, rgba(255,140,50,.16), transparent 70%),
    repeating-linear-gradient(180deg, transparent 0 84px, rgba(0,0,0,.5) 84px 86px, transparent 86px),
    repeating-linear-gradient(177deg, rgba(255,230,190,.06) 0 2px, transparent 2px 6px, rgba(0,0,0,.08) 6px 7px, transparent 7px 13px),
    linear-gradient(180deg, #7b5636, #5e4029 50%, #4a3120);
  box-shadow: 0 18px 28px rgba(0,0,0,.65), inset 0 0 0 3px rgba(0,0,0,.22), inset 0 2px 0 rgba(255,220,170,.18); }
.placa::before, .placa::after { content: ""; position: absolute; top: -2px; width: 26px; height: 26px;
  border-top: 6px solid #2b2724; box-shadow: 0 -1px 0 rgba(255,255,255,.08); }
.placa::before { left: -2px; border-left: 6px solid #2b2724; border-radius: 5px 0 0 0; }
.placa::after { right: -2px; border-right: 6px solid #2b2724; border-radius: 0 5px 0 0; }
.placa .neve-topo { position: absolute; left: -6px; right: -6px; top: -13px; height: 20px; pointer-events: none;
  background:
    radial-gradient(ellipse 50px 12px at 12% 100%, #f4f8fb 60%, transparent 62%),
    radial-gradient(ellipse 80px 14px at 40% 100%, #eef4f9 60%, transparent 62%),
    radial-gradient(ellipse 60px 11px at 72% 100%, #f4f8fb 60%, transparent 62%),
    radial-gradient(ellipse 40px 9px at 93% 100%, #e9f0f6 60%, transparent 62%);
  filter: drop-shadow(0 2px 1px rgba(40,60,90,.45)); }
.placa-titulo { margin: 4px 0 11px; font-family: var(--titulos); font-weight: 400; font-size: 44px; line-height: 1; letter-spacing: .03em;
  color: #eedcb2; text-shadow: 0 2px 0 #1e110a, 0 0 14px rgba(0,0,0,.45); }
.pergaminho { position: relative; padding: 14px 15px 13px; transform: rotate(-.8deg);
  background-color: var(--papel); background-image: url("../../assets/textures/shopitem_papertexture02_psd.png");
  background-size: 420px; background-blend-mode: multiply; color: var(--tinta);
  box-shadow: 0 3px 6px rgba(0,0,0,.5), inset 0 0 18px rgba(120,80,30,.25);
  clip-path: polygon(0 1%, 7% 0, 22% 1.2%, 41% .2%, 63% 1%, 84% 0, 100% 1.4%, 99.4% 30%, 100% 62%, 99.2% 99%, 78% 100%, 55% 98.8%, 31% 100%, 12% 99%, .6% 100%, 0 70%, .8% 38%); }
.pergaminho .prego { position: absolute; top: 6px; width: 7px; height: 7px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #9a928a, #2a2522 70%); box-shadow: 0 1px 1px rgba(0,0,0,.6); }
.pergaminho .prego.e { left: 7px; } .pergaminho .prego.d { right: 7px; }
.hobby { margin: 0 0 10px; font-style: italic; font-size: 17px; line-height: 1.3; color: var(--tinta); }
.contato { margin: 0; padding-top: 9px; border-top: 1px dashed rgba(60,40,20,.38);
  font-family: var(--gravado); font-size: 13.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--tinta-suave); line-height: 1.75; }
.contato .ea-rot { display: block; font-size: 13.5px; font-weight: 600; letter-spacing: .2em; margin-bottom: 1px; }
.contato .ea-canal { display: block; white-space: nowrap; }
.contato .ea-id { font-family: var(--texto); font-size: 19px; font-weight: 700; letter-spacing: .02em; text-transform: none;
  color: var(--tinta); user-select: all; -webkit-user-select: all; cursor: text; margin-left: 4px;
  border-bottom: 1px dotted rgba(44,29,18,.35); }
.contato .ea-id:hover { border-bottom-color: var(--cera); color: var(--cera); }
/* a etiqueta da versão, pendurada sob a placa (balança um pouco fora do tempo da placa) */
.etiqueta { position: relative; width: 300px; margin: 16px auto 0; padding: 7px 14px 8px; border-radius: 4px; text-align: center;
  border: 2px solid #241509; transform-origin: 50% -16px; animation: balanca2 3.9s ease-in-out infinite;
  background:
    repeating-linear-gradient(177deg, rgba(255,230,190,.06) 0 2px, transparent 2px 6px, rgba(0,0,0,.08) 6px 7px, transparent 7px 13px),
    linear-gradient(180deg, #6e4c30, #553a25 60%, #44301f);
  box-shadow: 0 8px 14px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,220,170,.16); }
.etiqueta::before, .etiqueta::after { content: ""; position: absolute; top: -18px; width: 7px; height: 18px; border-radius: 3px;
  border: 2px solid #2b2724; border-top-color: #5b5550; }
.etiqueta::before { left: 34px; } .etiqueta::after { right: 34px; }
@keyframes balanca2 { 0%,100% { transform: rotate(1.4deg); } 50% { transform: rotate(-1.6deg); } }
.nota .nw { white-space: nowrap; }
.nota { margin: 0; font-style: italic; font-size: 16px; color: #ecd9ae; line-height: 1.3; text-shadow: 0 1px 0 #1e110a; }

/* ============ SOBRE A CENA (tela, não mundo) ============ */
/* a nevasca: flocos alongados na direção do vento (a camada é girada e cai no próprio eixo) */
/* will-change nas camadas da neve: a câmera escala a nevasca e, sem ele, o Chrome rasteriza
   de novo os ladrilhos a cada quadro (era o que engasgava a abertura) */
.neve { position: absolute; left: -60%; top: -60%; width: 220%; height: 220%; pointer-events: none; will-change: transform; }
.neve.n1 { animation: cai 7s linear infinite; opacity: .5; }
.neve.n2 { animation: cai 2.9s linear infinite; opacity: .75; }
.neve.n3 { animation: cai 1.25s linear infinite; filter: blur(1.3px); opacity: .9; }
@keyframes cai { from { transform: rotate(-24deg) translateY(calc(var(--t) * -1)); } to { transform: rotate(-24deg) translateY(0); } }
.nevoa { position: absolute; left: -20%; right: -20%; bottom: -4%; height: 42%; pointer-events: none;
  background:
    radial-gradient(ellipse 30% 40% at 20% 70%, rgba(200,216,232,.16), transparent 70%),
    radial-gradient(ellipse 34% 36% at 70% 80%, rgba(200,216,232,.14), transparent 70%),
    linear-gradient(180deg, transparent, rgba(190,208,226,.12) 60%, rgba(190,208,226,.2));
  animation: nevoa 14s ease-in-out infinite alternate; }
@keyframes nevoa { from { transform: translateX(-4%); } to { transform: translateX(4%); } }
.rajada { position: absolute; left: -60%; width: 90%; height: 220px; pointer-events: none; border-radius: 50%;
  background: radial-gradient(ellipse at 50% 50%, rgba(214,228,244,.22), transparent 70%); filter: blur(12px);
  animation: rajada 7s linear infinite; }
.rajada.r2 { top: 55%; animation-duration: 9s; animation-delay: -4s; height: 300px; }
.rajada.r1 { top: 18%; }
@keyframes rajada { 0% { transform: translate(0, 0) rotate(18deg); opacity: 0; } 20% { opacity: 1; } 80% { opacity: .8; } 100% { transform: translate(190%, 40vh) rotate(18deg); opacity: 0; } }
.vinheta { position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse 80% 76% at 50% 56%, transparent 52%, rgba(2,5,10,.6) 100%); }
.grao { position: absolute; inset: 0; pointer-events: none; opacity: .3; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .6 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); }
.flash { position: absolute; inset: 0; pointer-events: none; opacity: 0;
  background: radial-gradient(ellipse 70% 70% at 50% 55%, #fff6dc, #ffdb94 45%, #f0a052 100%); }
.dica { position: absolute; left: 0; right: 0; bottom: 16px; margin: 0; text-align: center; pointer-events: none;
  font-family: var(--texto); font-style: italic; font-size: 14px; letter-spacing: .04em; color: rgba(226,234,242,.5);
  text-shadow: 0 1px 2px rgba(0,0,0,.6); animation: dica-chega 1.2s ease 1.4s both, dica-pulsa 4s ease-in-out 2.6s infinite; }
@keyframes dica-chega { from { opacity: 0; } to { opacity: 1; } }
@keyframes dica-pulsa { 0%,100% { opacity: 1; } 50% { opacity: .62; } }
/* o botão para leitor de tela e teclado: invisível até receber foco pelo teclado (Tab) */
.btn-entrar { position: absolute; left: 50%; bottom: 50px; transform: translateX(-50%); padding: 8px 22px; cursor: pointer;
  font-family: var(--titulos); font-size: 17px; letter-spacing: .08em; color: #f4e6c4; background: var(--cera);
  border: 1px solid #5c150d; border-radius: 2px; box-shadow: 0 3px 0 #4a1109, 0 6px 12px rgba(0,0,0,.5);
  opacity: 0; }
.btn-entrar:focus-visible { opacity: 1; outline: 2px solid var(--brasa-clara); outline-offset: 3px; }

/* a loja (placeholder: na integração é o app) */
.loja { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  visibility: hidden; opacity: 0;
  background:
    radial-gradient(ellipse 900px 520px at 50% 40%, rgba(255,190,110,.14), transparent 70%),
    repeating-linear-gradient(180deg, transparent 0 10px, rgba(0,0,0,.09) 10px 11px),
    repeating-linear-gradient(180deg, transparent 0 118px, rgba(0,0,0,.45) 118px 120px),
    linear-gradient(180deg, #3b2617, #2a1a0f 60%, #21130a); }
.loja h2 { margin: 0; font-family: var(--titulos); font-weight: 400; font-size: 64px; color: #e8d3a2; text-shadow: 0 2px 0 #1a0d05; letter-spacing: .03em; }
.loja p { margin: 0; font-family: var(--texto); font-style: italic; font-size: 15px; color: #b89a66; }
.loja .atalho { position: absolute; right: 18px; bottom: 14px; font-family: var(--gravado); font-size: 11px; letter-spacing: .2em; color: #8a6e48; text-transform: uppercase; }

/* ============ A ABERTURA ============ */
body.abrindo .entrada { cursor: default; }
/* a tranca: sai dos suportes, gira e encosta na parede à esquerda do batente (0–0,4 s) */
body.abrindo .tranca { animation: tranca .4s cubic-bezier(.45,0,.35,1) both; }
@keyframes tranca {
  0%   { transform: translate(0, 0) rotate(0); }
  16%  { transform: translate(0, -15px) rotate(-1deg); }
  52%  { transform: translate(-118px, -34px) rotate(-44deg); }
  82%  { transform: translate(-186px, 30px) rotate(-86deg); }
  92%  { transform: translate(-186px, 24px) rotate(-82deg); }
  100% { transform: translate(-186px, 27px) rotate(-84deg); }
}
/* as runas respondem ao clique */
body.abrindo .runas-acorda { animation: acorda .55s ease-out both; }
@keyframes acorda { 0% { stroke: #9fe6ff; stroke-width: 1.6; opacity: .6; } 30% { stroke: #ffffff; stroke-width: 3.4; opacity: 1; } 100% { stroke: #9fe6ff; stroke-width: 1.6; opacity: .75; } }
body.abrindo .folha.esq { animation: abre-esq 1.25s cubic-bezier(.5,.02,.2,1) .24s both; }
body.abrindo .folha.dir { animation: abre-dir 1.25s cubic-bezier(.5,.02,.2,1) .24s both; }
@keyframes abre-esq { 0% { transform: rotateY(0); } 6% { transform: rotateY(-1.5deg); } 100% { transform: rotateY(82deg); } }
@keyframes abre-dir { 0% { transform: rotateY(0); } 6% { transform: rotateY(1.5deg); } 100% { transform: rotateY(-82deg); } }
body.abrindo .folha .sombra { animation: escurece 1.25s ease-in .24s both; }
@keyframes escurece { to { opacity: .62; } }
body.abrindo .interior .acende { animation: acende 1.1s ease-out .28s both; }
@keyframes acende { to { opacity: 1; } }
body.abrindo .fresta-meio { animation: some .3s ease .3s both; }
@keyframes some { to { opacity: 0; } }
/* a luz quente se espalha pela neve logo no começo, antes de a câmera sair do chão */
body.abrindo .luz-neve { animation: luz-neve .6s ease-out .02s both; }
@keyframes luz-neve { to { opacity: 1; transform: scale(1.25, 1.1); } }
body.abrindo .poca { animation: poca 1.1s cubic-bezier(.3,.6,.3,1) .05s both; }
@keyframes poca { to { opacity: 1; transform: scaleY(1); } }
body.abrindo .raios { animation: raios 1.4s ease-out .38s both; }
@keyframes raios { 0% { opacity: 0; transform: scale(.6); } 100% { opacity: .95; transform: scale(1.15); } }
body.abrindo .dica { animation: some .3s ease both; }
body.abrindo .placa-grupo, body.abrindo .etiqueta { animation-play-state: paused; }
body.abrindo .flash { animation: flash .45s ease-in 1.4s both; }
@keyframes flash { from { opacity: 0; } to { opacity: 1; } }
body.abrindo .loja { animation: loja .42s ease-out 1.68s both; }
@keyframes loja { 0% { visibility: visible; opacity: 0; transform: scale(1.04); } 100% { visibility: visible; opacity: 1; transform: none; } }
body.aberta .entrada { visibility: hidden; }
.neve-tela { position: absolute; inset: 0; pointer-events: none; transform-origin: 50% 60%; will-change: transform, opacity; }
/* pré-aquecimento: as luzes da abertura já nascem em camada própria, rasterizadas no carregamento,
   e o clique só muda a opacidade e a escala delas */
.raios, .poca, .luz-neve, .flash, .interior .acende, .fresta-meio { will-change: transform, opacity; }

/* menos movimento: as portas só esmaecem, sem câmera */
@media (prefers-reduced-motion: reduce) {
  .neve, .nevoa, .rajada, .aurora i, .halo, .luz-fachada, .ch, .faisca, .placa-grupo, .etiqueta, .janela-halo, .janela-brilho, svg.runas-vivas, svg.runas-marco, .dica { animation: none !important; }
  .faisca { display: none; }
  .dica { opacity: 1; }
  body.abrindo .dica { opacity: 0 !important; visibility: hidden; }
  body.abrindo .neve-tela, body.abrindo .raios, body.abrindo .flash, body.abrindo .poca, body.abrindo .luz-neve, body.abrindo .runas-acorda { animation: none !important; }
  body.abrindo .fresta-meio, body.abrindo .fresta-chao { animation: none !important; opacity: 0; }
  body.abrindo .tranca { animation: esmaece .4s ease both !important; }
  body.abrindo .folha.esq, body.abrindo .folha.dir { animation: esmaece .55s ease both !important; }
  body.abrindo .loja { animation: loja-calma .45s ease .5s both !important; }
}
@keyframes esmaece { to { opacity: 0; } }
@keyframes loja-calma { 0% { visibility: visible; opacity: 0; } 100% { visibility: visible; opacity: 1; } }

      var y = 344;
      for (var i = 0; i < postes.length - 1; i++) if (x >= postes[i] && x <= postes[i + 1]) {
        var t = (x - postes[i]) / (postes[i + 1] - postes[i]); y = 344 + Math.sin(t * Math.PI) * (postes[i + 1] - postes[i]) * .022;
      }
      return y;
    }
    var pts = [];
    for (var x = X0; x <= X1; x += 4) pts.push([x, baixo(x) + 8 * Math.sin(Math.PI * (((x - X0) % 48) / 48))]);
    var top = "M" + X0 + " 296 L" + X1 + " 296 L" + (X1 + 6) + " 330 ", bot = "";
    for (var k = pts.length - 1; k >= 0; k--) bot += "L" + pts[k][0] + " " + pts[k][1].toFixed(1) + " ";
    var dToldo = top + bot + "L" + (X0 - 6) + " 334Z";
    $("toldo-couro").setAttribute("d", dToldo);
    $("toldo-clip").setAttribute("d", dToldo);
    // painéis: couro liso, pele de lobo, couro claro, pele de urso, pele de lince com manchas
    var cortes = [172, 286, 404, 512, 640, 806, 930, 1046, 1150, 1268];
    var tipos = ["couro", "lobo", "claro", "urso", "claro", "lobo", "couro", "lince", "urso"];
    var gpel = $("toldo-peles"), fr = "", cs = "";
    for (var p = 0; p < tipos.length; p++) {
      var a = cortes[p], b = cortes[p + 1], tipo = tipos[p];
      if (p > 0) cs += "M" + a + " 300 L" + a + " " + (baixo(a) - 2).toFixed(1) + " ";
      if (tipo === "couro" || tipo === "claro") {
        if (tipo === "claro") el("rect", { x: a, y: 290, width: b - a, height: 80, fill: "url(#gCouroClaro)", "clip-path": "url(#cToldo)" }, gpel);
        // dentes de couro na franja
        for (var fx = a + 12; fx < b - 6; fx += 24) { var l = 12 + rnd() * 10, fy = baixo(fx) + 8 * Math.sin(Math.PI * (((fx - X0) % 48) / 48)); fr += "M" + (fx - 1.5) + " " + (fy - 3).toFixed(1) + " h3 l-0.5 " + l.toFixed(1) + " h-2Z "; }
        continue;
      }
      // a pele: sobra abaixo da linha do toldo, com a borda irregular, e o pelo cai em fios
      var d = "M" + a + " 297 L" + b + " 297 ";
      for (var xx = b; xx >= a - 0.01; xx -= 6) {
        var lobo = Math.sin((xx - a) / (b - a) * Math.PI);
        d += "L" + xx.toFixed(1) + " " + (baixo(xx) + 6 + lobo * 16 + (rnd() < .3 ? rnd() * 12 : rnd() * 4)).toFixed(1) + " ";
      }
      var cor = tipo === "lobo" ? "url(#gLobo)" : tipo === "urso" ? "url(#gUrso)" : "url(#gLince)";
      el("path", { d: d + "Z", fill: cor, filter: "url(#pelo)" }, gpel);
      // dorso mais escuro no meio do painel
      el("path", { d: "M" + ((a + b) / 2 - 8) + " 297 Q" + ((a + b) / 2) + " 330 " + ((a + b) / 2 - 4) + " " + (baixo((a + b) / 2) + 14).toFixed(1) + " Q" + ((a + b) / 2 + 10) + " 330 " + ((a + b) / 2 + 10) + " 297Z",
        fill: "#1b130c", opacity: tipo === "urso" ? .35 : .25, filter: "url(#pelo)" }, gpel);
      if (tipo === "lince") for (var s = 0; s < 14; s++) {
        el("ellipse", { cx: (a + 10 + rnd() * (b - a - 20)).toFixed(1), cy: (304 + rnd() * 44).toFixed(1), rx: (2.5 + rnd() * 3).toFixed(1), ry: (2 + rnd() * 2).toFixed(1), fill: "#3a2614", opacity: .6 }, gpel);
      }
      if (tipo === "lobo") for (var s2 = 0; s2 < 5; s2++) {
        el("ellipse", { cx: (a + 14 + rnd() * (b - a - 28)).toFixed(1), cy: (310 + rnd() * 36).toFixed(1), rx: (8 + rnd() * 10).toFixed(1), ry: (5 + rnd() * 5).toFixed(1), fill: "#d8d2c6", opacity: .18, filter: "url(#borrao3)" }, gpel);
      }
    }
    cs += "M" + X0 + " 320 L" + X1 + " 320";
    $("toldo-costura").setAttribute("d", cs);
    $("toldo-franja").setAttribute("d", fr);
    // a carga de neve por cima: montes de tamanhos diferentes e abas que caem na frente
    var nv = "M" + (X0 - 16) + " 312 ", xa = X0 - 16;
    while (xa < X1 + 16) {
      var passo = 22 + rnd() * 40, alto = 248 + rnd() * 20 - (rnd() < .25 ? 12 : 0);
      nv += "Q" + (xa + passo / 2).toFixed(1) + " " + alto.toFixed(1) + " " + Math.min(X1 + 16, xa + passo).toFixed(1) + " " + (266 + rnd() * 12).toFixed(1) + " ";
      xa += passo;
    }
    nv += "L" + (X1 + 18) + " 314 ";
    // a frente da neve: abas que pendem sobre o couro
    var xb = X1 + 18;
    while (xb > X0 - 16) {
      var pb = 26 + rnd() * 50, aba = rnd() < .45 ? 8 + rnd() * 12 : 2 + rnd() * 3;
      nv += "Q" + (xb - pb / 2).toFixed(1) + " " + (310 + aba).toFixed(1) + " " + Math.max(X0 - 16, xb - pb).toFixed(1) + " " + (308 + rnd() * 4).toFixed(1) + " ";
      xb -= pb;
    }
    $("toldo-neve").setAttribute("d", nv + "Z");
    $("toldo-neve-sombra").setAttribute("d", nv + "Z");
    $("toldo-neve-sombra").setAttribute("transform", "translate(0 6)");
    var pg = $("pingentes-toldo");
    pts.forEach(function (p) {
      if ((p[0] - X0) % 48 === 24 && rnd() < .7) {
        var l = 5 + rnd() * rnd() * 30;
        el("path", { d: "M" + p[0] + " " + (p[1] + 4) + " l2 " + l + " l2 " + (-l) + "Z" }, pg);
      }
    });
  })();

  // os braseiros: cesta de ferro com garras, haste cravada na neve, chamas e faíscas
  document.querySelectorAll(".braseiro").forEach(function (b, bi) {
    var tiras = "";
    for (var ti = -5; ti <= 5; ti++) {
      var xt = 70 + ti * 10.6, xb = 70 + ti * 3.2;
      tiras += "M" + xt.toFixed(1) + " 178 Q" + (70 + ti * 9.2).toFixed(1) + " 214 " + xb.toFixed(1) + " 232 ";
    }
    b.innerHTML =
      '<div class="halo"></div>' +
      '<svg viewBox="0 0 140 330">' +
      '<defs><linearGradient id="gFerro' + bi + '" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#141211"/><stop offset=".45" stop-color="#4a4441"/><stop offset=".7" stop-color="#2a2624"/><stop offset="1" stop-color="#0e0c0b"/></linearGradient>' +
      '<radialGradient id="gCarvao' + bi + '" cx=".5" cy=".3" r=".75"><stop offset="0" stop-color="#fff0b0"/><stop offset=".3" stop-color="#ffb347"/><stop offset=".62" stop-color="#e2501a"/><stop offset="1" stop-color="#4a1004"/></radialGradient>' +
      '<radialGradient id="gChaoQ' + bi + '" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffb060" stop-opacity=".55"/><stop offset="1" stop-color="#ff8030" stop-opacity="0"/></radialGradient></defs>' +
      '<ellipse cx="70" cy="326" rx="120" ry="22" fill="url(#gChaoQ' + bi + ')"/>' +
      '<g stroke="#161312" stroke-width="6" stroke-linecap="round" fill="none"><path d="M70 296 Q46 304 26 324 M70 296 Q94 304 114 324 M70 300 L70 328"/></g>' +
      '<rect x="64" y="228" width="12" height="74" fill="url(#gFerro' + bi + ')"/>' +
      '<g fill="#5b5450"><rect x="62" y="246" width="16" height="4"/><rect x="62" y="270" width="16" height="4"/><rect x="62" y="292" width="16" height="5"/></g>' +
      '<path d="M64 240 l-16 -14 M76 240 l16 -14" stroke="#1a1716" stroke-width="5" stroke-linecap="round"/>' +
      '<path d="M14 178 Q20 222 70 234 Q120 222 126 178Z" fill="url(#gCarvao' + bi + ')"/>' +
      '<path d="M14 178 Q20 222 70 234 Q120 222 126 178Z" fill="#2a0a02" opacity=".35"/>' +
      '<path d="' + tiras + '" stroke="#171413" stroke-width="5.5" fill="none" stroke-linecap="round"/>' +
      '<path d="' + tiras + '" stroke="#6b625c" stroke-width="1.4" fill="none" opacity=".55" transform="translate(-1.5 0)"/>' +
      '<ellipse cx="70" cy="207" rx="49" ry="5" fill="none" stroke="#1b1817" stroke-width="5"/>' +
      '<ellipse cx="70" cy="178" rx="58" ry="9" fill="none" stroke="#1b1817" stroke-width="7"/>' +
      '<ellipse cx="70" cy="177" rx="58" ry="9" fill="none" stroke="#7a6d64" stroke-width="1.5" opacity=".6"/>' +
      '<g fill="#1b1817"><path d="M10 176 q-10 -18 -4 -34 q2 16 12 30Z M130 176 q10 -18 4 -34 q-2 16 -12 30Z M36 170 q-4 -16 2 -26 q2 12 6 24Z M104 170 q4 -16 -2 -26 q-2 12 -6 24Z"/></g>' +
      '<ellipse cx="70" cy="176" rx="52" ry="7" fill="url(#gCarvao' + bi + ')"/>' +
      '<g fill="#3a1206" opacity=".75"><circle cx="40" cy="175" r="5"/><circle cx="58" cy="172" r="4"/><circle cx="84" cy="173" r="5"/><circle cx="104" cy="176" r="4"/></g>' +
      '<g fill="#dfe8f1"><ellipse cx="26" cy="326" rx="14" ry="4"/><ellipse cx="70" cy="330" rx="16" ry="4"/><ellipse cx="114" cy="326" rx="14" ry="4"/></g>' +
      '</svg>' +
      '<div class="chamas"><i class="ch f3"></i><i class="ch f1"></i><i class="ch f4"></i><i class="ch f2"></i><i class="ch f5"></i></div>';
    for (var f = 0; f < 7; f++) {
      var s = document.createElement("i");
      s.className = "faisca";
      s.style.setProperty("--dx", (30 + rnd() * 90).toFixed(0) + "px");
      s.style.left = (52 + rnd() * 36).toFixed(0) + "px";
      s.style.animationDuration = (1.7 + rnd() * 1.4).toFixed(2) + "s";
      s.style.animationDelay = (-rnd() * 3).toFixed(2) + "s";
      b.appendChild(s);
    }
  });

  // nevasca: três camadas de flocos alongados (ladrilhos que se repetem, no eixo do vento)
  [["n1", 200, 30, 1.1, 1.6], ["n2", 280, 24, 1.7, 2.6], ["n3", 400, 12, 2.8, 4.2]].forEach(function (c) {
    var camada = document.querySelector(".neve." + c[0]), t = c[1], fundos = [];
    for (var i = 0; i < c[2]; i++) {
      var r = c[3] * (.6 + rnd() * .7), x = (rnd() * t).toFixed(0), y = (rnd() * t).toFixed(0);
      fundos.push("radial-gradient(" + (r * .8).toFixed(2) + "px " + (r * c[4]).toFixed(2) + "px at " + x + "px " + y + "px, rgba(240,246,252,.95), rgba(240,246,252,.5) 45%, rgba(240,246,252,0))");
    }
    camada.style.backgroundImage = fundos.join(",");
    camada.style.backgroundSize = t + "px " + t + "px";
    camada.style.setProperty("--t", t + "px");
  });

  /* ---------- encaixe na tela ---------- */
  var palco = $("palco");
  function encaixa() {
    var s = Math.min(innerWidth / 1440, innerHeight / 900);
    palco.style.transform = "translate(-50%, -50%) scale(" + s + ")";
  }
  encaixa(); addEventListener("resize", encaixa);

  /* ---------- a câmera (requestAnimationFrame) ---------- */
  // Progressão geométrica sobre a escala (o olho lê zoom em razão, não em soma), acelerando:
  // p = t^1,8; a fachada vai de 0,86 a 7,6 e sobe até centrar a porta; o primeiro plano
  // (braseiros, montes) vai a 30 e sai do quadro antes dos 60%; o céu só avança 1,3×.
  var DUR = 1950, S0 = .86;
  var longe = $("longe"), mundo = $("mundo"), perto = $("perto"), neveTela = $("neveTela");
  function quadro(ms) {
    var t = Math.min(1, Math.max(0, ms / DUR)), p = Math.pow(t, 1.8), q = Math.pow(t, 2.2);
    mundo.style.transform = "translate(0px," + (-110 * p).toFixed(2) + "px) scale(" + (S0 * Math.pow(7.6 / S0, p)).toFixed(4) + ")";
    perto.style.transform = "translate(0px," + (-60 * p).toFixed(2) + "px) scale(" + (S0 * Math.pow(30 / S0, p)).toFixed(4) + ")";
    perto.style.visibility = t > .62 ? "hidden" : "";
    longe.style.transform = "translate(0px," + (-36 * p).toFixed(2) + "px) scale(" + (S0 * Math.pow(1.3, p)).toFixed(4) + ")";
    neveTela.style.transform = "scale(" + (1 + 2.2 * q).toFixed(3) + ")";
    neveTela.style.opacity = (1 - q).toFixed(3);
  }
  function repouso() {
    [mundo, perto, longe].forEach(function (c) { c.style.transform = "scale(" + S0 + ")"; });
    perto.style.visibility = "";
    neveTela.style.transform = ""; neveTela.style.opacity = "";
  }
  repouso();

  /* ---------- abrir e reiniciar ---------- */
  var estado = "fechada", timer = 0, laco = 0;
  var entrada = $("entrada"), loja = $("loja"), botao = $("entrar");
  var calmo = matchMedia("(prefers-reduced-motion: reduce)");
  function abrir() {
    if (estado !== "fechada") return;
    estado = "abrindo";
    // o som nasce no clique
    Som.destravar(); Som.play("catalog:open");
    document.body.classList.add("abrindo");
    var reduz = calmo.matches;
    if (!reduz) {
      var t0 = performance.now();
      var passo = function (agora) {
        if (estado !== "abrindo" || window.__congelado) return;
        quadro(agora - t0);
        if (agora - t0 < DUR) laco = requestAnimationFrame(passo);
      };
      laco = requestAnimationFrame(passo);
    }
    timer = setTimeout(function () {
      estado = "aberta"; document.body.classList.add("aberta");
      entrada.setAttribute("aria-hidden", "true");
      loja.focus({ preventScroll: true });
    }, reduz ? 1000 : 2150);
  }
  function reiniciar() {
    clearTimeout(timer); cancelAnimationFrame(laco); window.__congelado = false;
    if (Som.parar) Som.parar();
    document.body.classList.remove("abrindo", "aberta");
    entrada.removeAttribute("aria-hidden");
    repouso();
    void document.body.offsetWidth;
    estado = "fechada";
    botao.focus({ preventScroll: true });
  }
  // o clique abre em qualquer lugar da entrada (menos nos IDs, que selecionam)
  entrada.addEventListener("click", function (e) {
    if (e.target.closest(".ea-id")) return;
    abrir();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "r" || e.key === "R") { if (!e.ctrlKey && !e.metaKey && !e.altKey) reiniciar(); return; }
    if ((e.key === "Enter" || e.key === " ") && estado === "fechada") {
      if (e.target.closest && e.target.closest(".ea-id")) return;
      e.preventDefault(); abrir();
    }
  });

  // para o QA: congela a abertura no instante ms (câmera e animações CSS juntas, em quadros comparáveis)
  var DA_ABERTURA = /^(tranca|acorda|abre-esq|abre-dir|escurece|acende|some|luz-neve|poca|raios|flash|loja|esmaece|loja-calma)$/;
  window.__congela = function (ms, clima) {
    window.__congelado = true; cancelAnimationFrame(laco);
    if (document.body.classList.contains("abrindo") && !calmo.matches) quadro(ms);
    document.getAnimations().forEach(function (a) {
      a.pause();
      a.currentTime = DA_ABERTURA.test(a.animationName || "") ? ms : (clima == null ? 2600 : clima);
    });
  };
  window.__abrir = abrir; window.__reiniciar = reiniciar; window.__DUR = DUR; window.__quadro = quadro;
  window.__pronto = true;
})();
</script>
