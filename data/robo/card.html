<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Forja — molde do card da build (a Ficha)</title>
<!-- F13-T98 (Leo, 01/11/2026: "os usuários gostaram mais do conceito 1 do card do Discord"): o molde
     do card da prévia no Discord no desenho da Ficha da build (o conceito 1 da F13-T95: o retrato, as
     runas, a ordem das habilidades, os iniciais, o Core, a bota e os situacionais), no lugar da Bigorna.
     O robô dos cards (data/robo/cards.py) abre esta página num Chrome sem janela, chama
     desenhar(build) para cada build publicada e fotografa o #card (1200×630). Tudo vem da build (o
     servidor), do catálogo (../catalog.js), das runas (../runas.js) e do Data Dragon (a arte, o retrato,
     as habilidades e os ícones, como no app). Aberta sozinha, ?amostra mostra uma build de exemplo. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<!-- media="print" até carregar: a folha das fontes não segura os scripts (se o Google Fonts pendurar,
     o molde abre do mesmo jeito e o card sai marcado "sem as fontes") -->
<link id="fontes" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet" media="print">
<script src="../catalog.js"></script>
<script src="../runas.js"></script>
<style>
  :root {
    --ferro-1: #1a1614; --ferro-2: #100d0b; --borda: #443a32; --brasa: #ff7a1e; --brasa-clara: #ffd27a;
    --brasa-glow: rgba(255,120,30,.55); --ouro: #c9a25b; --ouro-claro: #e9c983; --texto: #d8cbb6; --suave: #8f8074;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #0b0908; }
  .card { width: 1200px; height: 630px; position: relative; overflow: hidden; color: var(--texto); font-family: 'Alegreya', Georgia, serif;
    background: radial-gradient(ellipse at 80% 20%, #2a201a 0%, #120e0c 60%, #0b0908 100%); }
  .ico { display: block; border-radius: 4px; box-shadow: 0 0 0 1px rgba(0,0,0,.6), 0 2px 6px rgba(0,0,0,.6); }
  .marca { position: absolute; right: 34px; top: 30px; font-family: 'Cinzel', serif; letter-spacing: .18em; font-size: 15px; color: var(--ouro); white-space: nowrap; }
  .marca b { color: var(--brasa-clara); font-weight: 700; }
  .fundo { position: absolute; inset: 0 0 0 auto; width: 720px; background-size: cover; background-position: 50% 25%; opacity: .32;
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 45%); mask-image: linear-gradient(90deg, transparent 0%, #000 45%); }
  .topo { position: absolute; left: 34px; top: 26px; right: 190px; display: flex; gap: 20px; align-items: center; height: 124px; }
  .retrato { flex: none; width: 118px; height: 118px; border-radius: 50%; border: 3px solid var(--ouro); box-shadow: 0 0 0 5px #0b0908, 0 0 0 6px var(--borda), 0 0 24px var(--brasa-glow); background-size: cover; }
  .cab { min-width: 0; flex: 1; }
  .nome { font-family: 'Cinzel', serif; font-weight: 700; font-size: 50px; color: var(--ouro-claro); line-height: 1.05; letter-spacing: .04em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .build { font-family: 'Cinzel', serif; font-size: 22px; color: var(--texto); margin-top: 6px; letter-spacing: .06em; text-transform: uppercase;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tags { margin-top: 6px; font-size: 18px; color: var(--brasa-clara); font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .painel { position: absolute; background: rgba(16,13,11,.86); border: 1px solid #6b5333; box-shadow: inset 0 0 0 1px rgba(201,162,91,.18), 0 6px 18px rgba(0,0,0,.6); padding: 12px 14px; }
  .painel h3 { margin: 0 0 10px; font-family: 'Cinzel', serif; font-size: 14px; letter-spacing: .14em; color: var(--ouro-claro); font-weight: 600; white-space: nowrap; }
  .painel .vazio { font-style: italic; color: var(--suave); font-size: 16px; }
  .runas { left: 34px; top: 176px; width: 196px; height: 410px; }
  .runas .chave { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .runas .col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; justify-items: center; align-items: center; }
  .runas .frag { display: flex; gap: 10px; margin-top: 12px; justify-content: center; }
  .fileira { display: flex; gap: 12px; align-items: flex-end; }
  .it { text-align: center; width: 92px; font-size: 13px; line-height: 1.15; color: var(--texto); }
  .it .ico { margin: 0 auto 6px; }
  .it span { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  .hab { text-align: center; font-family: 'Cinzel', serif; font-size: 15px; color: var(--ouro-claro); }
  .hab .letra { width: 56px; height: 56px; display: grid; place-items: center; background: #2b2521; border-radius: 4px; font-size: 24px; }
  .gt { font-family: 'Cinzel', serif; color: var(--ouro); font-size: 24px; align-self: center; margin-bottom: 18px; }
  .mais { color: var(--suave); font-size: 16px; align-self: center; margin-left: 4px; }
  .pe { position: absolute; left: 34px; bottom: 12px; font-family: 'Cinzel', serif; letter-spacing: .18em; font-size: 13px; color: var(--ouro); white-space: nowrap; max-width: 520px; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<div class="card" id="card"></div>
<script>
const DD = "https://ddragon.leagueoflegends.com/cdn/";
const PATCH = CATALOG.meta.patch;
// Map, não objeto: quem publica escolhe o itemId e as runas, e "constructor" ou "__proto__" num objeto
// comum achavam a função herdada (F13-T95: o desenho quebrava e, com ele, a rodada do robô)
const porSlug = new Map(CATALOG.items.map(i => [i.slug, i]));
const porNome = new Map(CATALOG.items.map(i => [i.namePt, i]));
const runas = new Map();
RUNAS.trilhas.forEach(t => { runas.set(t.id, t); t.slots.forEach(s => s.runas.forEach(r => runas.set(r.id, r))); });
(RUNAS.fragmentos || []).forEach(f => f.runas.forEach(r => { if (!runas.has(r.id)) runas.set(r.id, r); }));
// os nomes de rota da tela (index.html, ROTAS)
const ROTAS = new Map(Object.entries({ top: "Top", selva: "Selva", meio: "Meio", atirador: "Atirador", suporte: "Suporte" }));
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const lista = x => Array.isArray(x) ? x : [];
// o prazo de cada coisa que vem da rede (a arte, um ícone, as habilidades, as fontes): passou, conta como falha
const PRAZO_MS = 15000;
function comPrazo(promessa, ms, valor) {
  return Promise.race([promessa, new Promise(ok => setTimeout(() => ok(valor), ms))]);
}

// Bota: a do tier Bota e a evolução de uma bota (Marcha Célere, Grevas Bélicas…), que vem de uma Bota.
function ehBota(it) {
  if (it.tier === "Bota") return true;
  return /Evolução/.test(it.tier || "") && lista(it.components).some(c => (porNome.get(c.namePt) || {}).tier === "Bota");
}
// o item de suporte: a Dádiva dos Mundos e o que ela vira (Trenó do Solstício, Canção de Sangue…)
const ehSuporte = it => it.tier === "Lendário (Evolução)" || lista(it.components).some(c => (porNome.get(c.namePt) || {}).tier === "Lendário (Evolução)");
function ehLendario(it) { return (/^Lendário/.test(it.tier || "") || (it.tier === "Evolução" && !ehBota(it))) && !ehSuporte(it); }
const ehInicial = it => it.tier === "Starter" || it.tier === "Consumível" || it.tier === "Trinket";

// Os quadros da Ficha. A build é lida como o "Total (sem opcionais)" do app: sem as caixas Opcionais,
// e da Escolha 1 só a primeira (a padrão). Core: os três primeiros Lendários nessa ordem; Bota (e o
// item de suporte, se houver): a bota da build, não a peça "Botas"; Iniciais: os iniciais, poções e a
// sentinela; Situacionais: as outras opções das caixas de Escolha e os Lendários fora do Core. Item que
// o catálogo não tem fica de fora.
function fichaDaBuild(build) {
  const caixas = lista(build && build.caixas).filter(c => c && typeof c === "object" && c.kind !== "opcional");
  const contados = [], visto = new Set();
  caixas.forEach(c => (c.kind === "escolha" ? lista(c.items).slice(0, 1) : lista(c.items)).forEach(e => {
    const it = e && porSlug.get(e.itemId);
    if (it && !visto.has(it.slug)) { visto.add(it.slug); contados.push({ it, escolha: c.kind === "escolha" }); }
  }));
  let grandes = contados.filter(x => ehLendario(x.it));
  // sem Lendário: o que não é bota, suporte, inicial, sentinela nem item distribuído
  if (!grandes.length) grandes = contados.filter(x => !ehBota(x.it) && !ehSuporte(x.it) && !ehInicial(x.it) && x.it.tier !== "Distribuído");
  const core = grandes.slice(0, 3);
  const noCore = new Set(core.map(x => x.it.slug));
  const botas = contados.filter(x => ehBota(x.it) && !noCore.has(x.it.slug));
  const pecas = new Set(botas.flatMap(x => lista(x.it.components).map(c => (porNome.get(c.namePt) || {}).slug)));
  const finais = botas.filter(x => !pecas.has(x.it.slug));
  const bota = (finais.length ? finais : botas).slice(0, 1);
  const sups = contados.filter(x => ehSuporte(x.it) && !noCore.has(x.it.slug));
  const viradas = sups.filter(x => x.it.tier !== "Lendário (Evolução)");
  const suporte = (viradas.length ? viradas : sups).slice(0, 1);
  const iniciais = contados.filter(x => ehInicial(x.it) && !noCore.has(x.it.slug)).slice(0, 6);
  const mostrados = new Set([...core, ...bota, ...suporte, ...iniciais].map(x => x.it.slug));
  // situacionais: as opções das caixas de Escolha (Lendário ou bota) e os Lendários fora do Core
  const situ = [];
  const poe = it => { if (it && !mostrados.has(it.slug) && !situ.includes(it.slug)) situ.push(it.slug); };
  caixas.forEach(c => {
    if (c.kind === "escolha") lista(c.items).forEach(e => { const it = e && porSlug.get(e.itemId); if (it && (ehLendario(it) || ehBota(it))) poe(it); });
    else lista(c.items).forEach(e => { const it = e && porSlug.get(e.itemId); if (it && ehLendario(it)) poe(it); });
  });
  const so = l => l.map(x => x.it.slug);
  return { core: so(core), bota: so(bota), suporte: so(suporte), iniciais: so(iniciais), situacionais: situ.slice(0, 15), aMais: Math.max(0, situ.length - 15) };
}

// a ordem de maximização das habilidades (Q, W, E até o teto de 5), como o app
function ordemDasHabilidades(h) {
  const seq = lista(h);
  const d = ["Q", "W", "E"].map(L => {
    let n = 0, quinto = 99, prim = 99;
    seq.forEach((x, i) => { if (x !== L) return; n++; if (prim === 99) prim = i; if (n === 5) quinto = i; });
    return { L, n, quinto, prim };
  }).filter(x => x.n).sort((a, b) => a.quinto - b.quinto || b.n - a.n || a.prim - b.prim);
  return d.map(x => x.L);
}

function carregar(url, prazo = PRAZO_MS) {
  return comPrazo(new Promise(ok => { if (!url) return ok(false); const i = new Image(); i.onload = () => ok(true); i.onerror = () => ok(false); i.src = url; }), prazo, false);
}
async function habilidadesDo(ch) {
  if (!ch) return null;
  try {
    const r = await comPrazo(fetch(`${DD}${PATCH}/data/pt_BR/champion/${encodeURIComponent(ch)}.json`).then(x => x.ok ? x.json() : null), PRAZO_MS, null);
    const c = r && r.data && Object.values(r.data)[0];
    return c && Array.isArray(c.spells) ? c.spells : null;
  } catch (e) { return null; }
}

// a folha das fontes: liga quando chegar (ver o <link id="fontes">)
const folhaDasFontes = new Promise(ok => {
  const l = document.getElementById("fontes");
  const liga = v => { l.media = "all"; ok(v); };
  if (l.sheet) return liga(true);
  l.addEventListener("load", () => liga(true));
  l.addEventListener("error", () => liga(false));
});
// os rostos que o card usa (o nome, os títulos dos quadros, a build; os nomes dos itens e as marcas, em itálico)
const ROSTOS = ["700 50px Cinzel", "600 14px Cinzel", "22px Cinzel", "13px Alegreya", "italic 18px Alegreya"];

async function desenhar(build) {
  const card = document.getElementById("card");
  const ch = build.campeao && build.campeao.id;
  const faltou = [];
  // a arte centrada do Data Dragon (o campeão no meio); sem ela, a splash
  let arte = ch ? `${DD}img/champion/centered/${encodeURIComponent(ch)}_0.jpg` : "";
  let temArte = await carregar(arte);
  if (ch && !temArte) { arte = `${DD}img/champion/splash/${encodeURIComponent(ch)}_0.jpg`; temArte = await carregar(arte); }
  const retrato = ch ? `${DD}${PATCH}/img/champion/${encodeURIComponent(ch)}.png` : "";
  const f = fichaDaBuild(build);
  const R = build.runas && typeof build.runas === "object" ? build.runas : {};
  const ordem = ordemDasHabilidades(build.habilidades);
  const spells = ordem.length ? await habilidadesDo(ch) : null;
  if (ordem.length && ch && !spells) faltou.push("habilidades");
  const ico = (slug, px) => `<img class="ico" src="${esc(porSlug.get(slug).iconUrl)}" width="${px}" height="${px}" alt="">`;
  const rIco = (id, px) => { const r = runas.get(id); return r && r.iconUrl ? `<img src="${esc(r.iconUrl)}" width="${px}" height="${px}" alt="">` : ""; };
  const hab = L => { const s = spells && spells["QWE".indexOf(L)]; return s && s.image ? `<img class="ico" src="${esc(DD + PATCH + "/img/spell/" + s.image.full)}" width="56" height="56" alt="">` : `<div class="letra">${L}</div>`; };
  const it = s => `<div class="it">${ico(s, 64)}<span>${esc(porSlug.get(s).namePt)}</span></div>`;
  const temRunas = runas.has(R.assinatura) || lista(R.slots).some(id => runas.has(id));
  const tags = [ROTAS.get(build.rota) || "", build.modo].filter(Boolean).join(" · ");
  const quem = [build.campeao && build.campeao.name, ROTAS.get(build.rota) || "", build.modo].filter(Boolean).join(" · ");
  const pe = [build.autor ? "por " + build.autor : "", build.patch ? "patch " + build.patch : ""].filter(Boolean).join(" · ");
  const nomeCampeao = build.campeao && build.campeao.name;
  const vazio = t => `<div class="vazio">${t}</div>`;
  card.innerHTML = `${temArte ? `<div class="fundo" style="background-image:url(&quot;${esc(arte)}&quot;)"></div>` : ""}
    <div class="topo">${ch ? `<div class="retrato" style="background-image:url(&quot;${esc(retrato)}&quot;)"></div>` : ""}
      <div class="cab"><div class="nome">${esc(nomeCampeao || build.nome || "Build sem nome")}</div>
        ${nomeCampeao ? `<div class="build">${esc(build.nome || "Build sem nome")}</div>` : ""}
        ${tags ? `<div class="tags">${esc(tags)}</div>` : ""}</div></div>
    <div class="painel runas"><h3>RUNAS</h3>${temRunas ? `
      <div class="chave">${rIco(R.assinatura, 74)}<div>${rIco(R.primaria, 30)}</div></div>
      <div class="col">${lista(R.slots).map(id => rIco(id, 44)).join("")}${rIco(R.secundaria, 30)}</div>
      <div class="col" style="margin-top:10px">${lista(R.secundarios).map(id => rIco(id, 40)).join("")}</div>
      <div class="frag">${lista(R.fragmentos).map(id => rIco(id, 26)).join("")}</div>` : vazio("sem runas")}</div>
    <div class="painel" style="left:250px;top:176px;width:330px;height:132px"><h3>ORDEM DAS HABILIDADES</h3>
      ${ordem.length ? `<div class="fileira">${ordem.map((L, i) => `<div class="hab">${hab(L)}<div>${L}</div></div>${i < ordem.length - 1 ? '<div class="gt">›</div>' : ""}`).join("")}</div>` : vazio("sem a ordem")}</div>
    <div class="painel" style="left:600px;top:176px;width:566px;height:132px"><h3>ITENS INICIAIS</h3>
      ${f.iniciais.length ? `<div class="fileira">${f.iniciais.map(s => ico(s, 56)).join("")}</div>` : vazio("sem iniciais")}</div>
    <div class="painel" style="left:250px;top:326px;width:500px;height:150px"><h3>CORE</h3>
      ${f.core.length ? `<div class="fileira">${f.core.map(it).join("")}</div>` : vazio("sem Lendários")}</div>
    <div class="painel" style="left:770px;top:326px;width:396px;height:150px"><h3>${f.suporte.length ? "BOTA E SUPORTE" : "BOTA"}</h3>
      ${f.bota.length || f.suporte.length ? `<div class="fileira">${[...f.bota, ...f.suporte].map(it).join("")}</div>` : vazio("sem bota")}</div>
    <div class="painel" style="left:250px;top:494px;width:916px;height:92px"><h3>SITUACIONAIS</h3>
      ${f.situacionais.length ? `<div class="fileira" style="gap:9px">${f.situacionais.map(s => ico(s, 44)).join("")}${f.aMais ? `<span class="mais">+ ${f.aMais}</span>` : ""}</div>` : vazio("sem situacionais")}</div>
    ${pe ? `<div class="pe">${esc(pe)}</div>` : ""}
    <div class="marca"><b>FORJA</b></div>`;
  // as fontes, com prazo e sem deixar a falha de rede derrubar o desenho; o robô confere "fontes" —
  // rosto a rosto: um só que falte e a foto sai incompleta
  await comPrazo(folhaDasFontes, PRAZO_MS, false);
  const rostos = await comPrazo(Promise.all(ROSTOS.map(fo => document.fonts.load(fo).then(l => l.length > 0 && l.every(x => x.status === "loaded"), () => false))), PRAZO_MS, []);
  await comPrazo(document.fonts.ready.catch(() => null), PRAZO_MS, null);
  const fontes = rostos.length === ROSTOS.length && rostos.every(Boolean);
  if (ch && retrato && !(await carregar(retrato))) faltou.push("retrato");
  await Promise.all([...card.querySelectorAll("img")].map(i => i.complete ? i.naturalWidth > 0 : carregar(i.src)));
  // o que a foto vai mostrar, para o robô e o roteiro conferirem
  const caixa = card.getBoundingClientRect();
  // o rodapé corta o autor comprido com "…" de propósito (o max-width): nele só conta passar da borda
  const fora = [...card.querySelectorAll(".painel, .topo, .pe")].filter(e => { const b = e.getBoundingClientRect(); return b.right > caixa.right + 1 || b.bottom > caixa.bottom + 1
    || (!e.classList.contains("pe") && e.scrollWidth > e.clientWidth + 1) || e.scrollHeight > e.clientHeight + 1; }).length;
  return { arte: temArte, fontes, quebradas: [...card.querySelectorAll("img")].filter(i => !i.naturalWidth).length, faltou, cabe: fora === 0,
           ...f, ordem, temRunas, pe, quem };
}
window.fichaDaBuild = fichaDaBuild;
window.ordemDasHabilidades = ordemDasHabilidades;
window.desenhar = desenhar;

// ?amostra: a build do Ekko de exemplo (as runas e a ordem tiradas das runas; os itens, do catálogo)
if (/[?&]amostra\b/.test(location.search)) {
  const T = RUNAS.trilhas, um = s => s.runas[0].id;
  desenhar({ nome: "Mage Assasin", autor: "", campeao: { id: "Ekko", name: "Ekko" }, modo: "Summoner's Rift", rota: "selva", patch: CATALOG.meta.patch,
    runas: { primaria: T[0].id, assinatura: um(T[0].slots[0]), slots: T[0].slots.slice(1, 4).map(um), secundaria: T[1].id,
             secundarios: [um(T[1].slots[1]), um(T[1].slots[2])], fragmentos: (RUNAS.fragmentos || []).map(f => f.runas[0].id) },
    habilidades: ["Q", "E", "W", "Q", "Q", "R", "Q", "E", "Q", "E", "R", "E", "E", "W", "W", "R", "W", "W"],
    caixas: [{ kind: "comum", items: [{ itemId: "scorchclaw-pup" }, { itemId: "health-potion" }, { itemId: "stealth-ward" }] }, { kind: "comum", items: [{ itemId: "sorcerer-s-shoes" }] },
      { kind: "prioridade", items: [{ itemId: "dusk-and-dawn" }, { itemId: "nashor-s-tooth" }, { itemId: "shadowflame" }] }, { kind: "opcional", items: [{ itemId: "oracle-lens" }] },
      { kind: "escolha", items: [{ itemId: "hextech-rocketbelt" }, { itemId: "cosmic-drive" }] }, { kind: "escolha", items: [{ itemId: "zhonya-s-hourglass" }] }, { kind: "escolha", items: [{ itemId: "void-staff" }] }] });
}
</script>
</body>
</html>
